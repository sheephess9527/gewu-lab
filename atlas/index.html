<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfd" />
    <title>格物实验室 · 疆域变迁</title>
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-charts.css" />
    <style>
      /* 格物实验室外壳：青黛夜 / 宣纸 */
      :root {
        /* 浅色（默认）：Apple 式极简 */
        --x-bg-1: #fbfbfd; --x-bg-2: #fbfbfd; --x-panel: #ffffff;
        --x-line: rgba(0, 0, 0, .08); --x-line-2: rgba(0, 0, 0, .14);
        --x-ink: #1d1d1f; --x-ink-2: #6e6e73;
        --x-acc: #0a9396; --x-gold: #c98a12; --x-red: #e5484d;
        --x-sea: #fbfbfd; --x-land: #ffffff; --x-r: 18px;
        --x-card: #ffffff; --x-sel: #e8f1fc; --x-hover: #f5f5f7;
        --x-acc-ink: #077275; --x-gold-ink: #8a5c00; --x-red-ink: #c4282d;
        --x-blue: #0071e3; --x-blue-ink: #0062c4; --x-blue-soft: #e8f1fc;
        --x-fill: #f5f5f7; --x-fill-2: #e8e8ed; --x-on-blue: #ffffff;
        --x-glass: rgba(251, 251, 253, .72); --x-shadow: 0 4px 24px rgba(0, 0, 0, .04);
        --x-thumb-shadow: 0 1px 4px rgba(0, 0, 0, .18), 0 0 0 .5px rgba(0, 0, 0, .06);
        --x-ease: cubic-bezier(.2, .8, .2, 1); --x-dur: .3s;
        --x-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --x-serif: var(--x-sans);
        --x-mono: ui-monospace, Menlo, "SF Mono", Consolas, monospace;
        --x-top: 56px; --x-side: 220px; --x-right: 340px; --x-bottom: 92px;
      }
      :root[data-theme="dark"] {
        --x-bg-1: #000000; --x-bg-2: #000000; --x-panel: #1d1d1f;
        --x-line: rgba(255, 255, 255, .1); --x-line-2: rgba(255, 255, 255, .18);
        --x-ink: #f5f5f7; --x-ink-2: #a1a1a6;
        --x-acc: #2ec4b6; --x-gold: #f2b544; --x-red: #ff6369;
        --x-sea: #000000; --x-land: #1d1d1f;
        --x-card: #1d1d1f; --x-sel: #0b2a4a; --x-hover: #2c2c2e;
        --x-acc-ink: #3dd9c9; --x-gold-ink: #f2b544; --x-red-ink: #ff6369;
        --x-blue: #2997ff; --x-blue-ink: #2997ff; --x-blue-soft: #0b2a4a;
        --x-fill: #2c2c2e; --x-fill-2: #3a3a3c; --x-on-blue: #ffffff;
        --x-glass: rgba(29, 29, 31, .72); --x-shadow: 0 4px 24px rgba(0, 0, 0, .4);
        --x-thumb-shadow: 0 1px 4px rgba(0, 0, 0, .5);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden; color: var(--x-ink);
        background: linear-gradient(160deg, var(--x-bg-1), var(--x-bg-2));
        font: 14px/1.6 var(--sans), system-ui, sans-serif;
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      .x-app { display: grid; height: 100vh; height: 100dvh;
        grid-template-columns: var(--x-side) minmax(0, 1fr) var(--x-right);
        grid-template-rows: var(--x-top) minmax(0, 1fr) var(--x-bottom);
        grid-template-areas: "top top top" "chs stage panel" "chs bar panel"; }
      /* 顶栏 */
      .x-top { grid-area: top; display: flex; align-items: center; gap: 14px;
        padding: 0 14px; border-bottom: 1px solid var(--x-line); background: var(--x-panel);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .x-brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 136px; }
      .x-brand b { font: 600 15px/1.2 var(--x-serif); letter-spacing: .02em; }
      .x-brand span { font-size: 12px; color: var(--x-ink-2); }
      .x-prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
      .x-prog__segs { display: flex; gap: 3px; flex: 1; min-width: 0; }
      .x-prog__segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--x-line-2); }
      .x-prog__segs i.on { background: var(--x-acc); }
      .x-count { font: 12px var(--x-mono); color: var(--x-ink-2); white-space: nowrap; }
      .x-tools { display: flex; gap: 6px; }
      .x-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center;
        justify-content: center; gap: 4px; padding: 0 10px; border: 1px solid var(--x-line-2);
        border-radius: var(--x-r); background: transparent; transition: 200ms var(--ease-out);
        font-size: 13px; }
      .x-btn:hover { border-color: var(--x-acc); color: var(--x-acc); }
      .x-btn[disabled] { opacity: .35; cursor: not-allowed; }
      .x-btn.on { background: var(--x-acc); border-color: var(--x-acc); color: #04201d; }
      /* 章节栏 */
      .x-chs { grid-area: chs; overflow: auto; border-right: 1px solid var(--x-line);
        background: var(--x-panel); padding: 8px 0; }
      .x-ch { display: block; width: 100%; text-align: left; background: transparent;
        border: 0; border-left: 3px solid transparent; padding: 8px 12px; min-height: 48px;
        transition: 200ms var(--ease-out); }
      .x-ch b { display: block; font: 12px var(--x-mono); color: var(--x-ink-2); }
      .x-ch span { font: 500 14px/1.35 var(--x-serif); }
      .x-ch:hover { background: var(--x-hover); }
      .x-ch.on { border-left-color: var(--x-acc); background: var(--x-sel); }
      .x-ch.on b, .x-ch.on span { color: var(--x-acc-ink); }
      .x-ch.soon span { color: var(--x-ink-2); }
      /* 舞台 */
      .x-stage { grid-area: stage; position: relative; overflow: hidden; }
      #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
      .x-over { position: absolute; top: 12px; left: 12px; max-width: min(380px, 62%);
        background: var(--x-panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 12px 14px; }
      .x-over h2 { margin: 0 0 4px; font: 600 17px/1.3 var(--x-serif); }
      .x-over p { margin: 6px 0 0; font-size: 13px; color: var(--x-ink-2); }
      .x-over.min p, .x-over.min .x-over__src { display: none; }
      .x-over__src { font-size: 12px; color: var(--x-ink-2); margin-top: 8px; }
      .x-fold { position: absolute; top: 8px; right: 8px; border: 1px solid var(--x-line-2);
        background: transparent; border-radius: 8px; width: 44px; height: 44px; min-width: 0;
        min-height: 0; line-height: 1; font-size: 14px; top: 4px; right: 4px; }
      .x-over { padding-right: 52px; }
      .x-note { position: absolute; bottom: 12px; right: 12px; font: 12px var(--x-mono);
        color: var(--x-ink-2); background: var(--x-panel); padding: 4px 8px; border-radius: 8px;
        border: 1px solid var(--x-line); }
      /* 底部时间轴 */
      .x-bar { grid-area: bar; border-top: 1px solid var(--x-line); background: var(--x-panel);
        padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
      .x-bar__row { display: flex; align-items: center; gap: 10px; }
      .x-ticks { display: flex; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
      .x-tick { flex: 1 0 44px; min-width: 44px; min-height: 44px; background: transparent; border: 0;
        padding: 4px 0 0; position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .x-tick::before { content: ""; position: absolute; left: 0; right: 0; top: 11px;
        height: 1px; background: var(--x-line-2); }
      .x-tick i { width: 9px; height: 9px; border-radius: 50%; background: var(--x-bg-2);
        border: 1px solid var(--x-line-2); position: relative; z-index: 1; }
      .x-tick em { font: 12px var(--x-mono); color: var(--x-ink-2); font-style: normal; white-space: nowrap; }
      .x-tick.live i { background: var(--x-acc); border-color: var(--x-acc);
        box-shadow: 0 0 0 4px rgba(46, 196, 182, .2); }
      .x-tick.live em { color: var(--x-acc-ink); font-weight: 600; }
      .x-tick:not([disabled]) i { border-color: var(--x-acc); }
      .x-tick[disabled] { cursor: not-allowed; }
      .x-bar__meta { font: 12px var(--x-mono); color: var(--x-ink-2); text-align: center; }
      /* 右侧面板 */
      .x-panel { grid-area: panel; overflow: auto; border-left: 1px solid var(--x-line);
        background: var(--x-panel); padding: 14px; }
      .x-card { border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 12px;
        margin-bottom: 12px; background: var(--x-card); color: var(--x-ink); }
      .x-card > h3 { margin: 0 0 8px; font: 600 13px/1.3 var(--x-serif); letter-spacing: .04em; color: var(--x-ink); }
      .x-card--text { font-size: 13px; color: var(--x-ink-2); }
      .x-card--text summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--x-ink); }
      .x-tag { display: inline-block; font: 12px var(--x-mono); color: var(--x-acc-ink);
        border: 1px solid var(--x-acc); border-radius: 999px; padding: 1px 8px; margin-bottom: 8px; }
      .x-figs { display: flex; gap: 12px; margin: 0 0 10px; }
      .x-fig b { display: block; font: 600 22px/1.1 var(--x-mono); }
      .x-fig span { font-size: 12px; color: var(--x-ink-2); }
      .x-pol { display: flex; flex-direction: column; gap: 6px; }
      .x-pol button { display: flex; align-items: center; gap: 8px; min-height: 44px;
        padding: 6px 10px; border: 1px solid var(--x-line); border-radius: var(--x-r);
        background: transparent; text-align: left; transition: 200ms var(--ease-out); }
      .x-pol button:hover { border-color: var(--x-line-2); }
      .x-pol button.on { border-color: var(--x-acc); background: var(--x-sel); }
      .x-pol i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
      .x-pol small { display: block; color: var(--x-ink-2); font-size: 12px; }
      .x-switches { display: flex; flex-wrap: wrap; gap: 6px; }
      .x-sw { min-height: 44px; min-width: 56px; padding: 0 12px; border: 1px solid var(--x-line-2);
        border-radius: 999px; background: transparent; font-size: 13px; }
      .x-sw.on { background: var(--x-acc); border-color: var(--x-acc); color: #04201d; }
      .x-q { font-size: 13px; }
      .x-q p { margin: 0 0 8px; }
      .x-q__opts { display: flex; flex-direction: column; gap: 6px; }
      .x-q__opts button { min-height: 44px; text-align: left; padding: 8px 10px;
        border: 1px solid var(--x-line); border-radius: var(--x-r); background: transparent; }
      .x-q__opts button.right { border-color: var(--x-acc); color: var(--x-acc-ink); }
      .x-q__opts button.wrong { border-color: var(--x-red); color: var(--x-red); }
      .x-ans { margin-top: 10px; font-size: 12px; color: var(--x-ink-2);
        border-left: 2px solid var(--x-gold); padding-left: 10px; display: none; }
      .x-ans.show { display: block; }
      /* 第 17 章：随堂检测 */
      .x-qz__opts { display: flex; flex-direction: column; gap: 6px; }
      .x-qz__opts button { min-height: 44px; text-align: left; padding: 8px 10px; font-size: 13px;
        border: 1px solid var(--x-line); border-radius: var(--x-r); background: transparent; color: var(--x-ink); }
      .x-qz__opts button:not([disabled]):hover { border-color: var(--x-line-2); background: var(--x-hover); }
      .x-qz__opts button.right { border-color: var(--x-acc); color: var(--x-acc-ink); background: var(--x-sel); }
      .x-qz__opts button.wrong { border-color: var(--x-red); color: var(--x-red); }
      .x-qz__ctx { font-size: 12px; color: var(--x-ink-2); margin: 0 0 6px; }
      .x-qz__go { margin-top: 10px; width: 100%; }
      .x-qz__list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      .x-qz__list li { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--x-line); }
      .x-qz__list li:first-child { border-top: 0; }
      .x-qz__list b { flex: none; width: 18px; color: var(--x-acc-ink); }
      .x-qz__list li.no b { color: var(--x-red); }
      .x-gk { border-left: 2px solid var(--x-gold); padding-left: 10px; font-size: 12px;
        color: var(--x-ink-2); margin-top: 10px; }
      .x-soon { font: 12px var(--x-mono); color: var(--x-gold-ink); border: 1px dashed var(--x-gold);
        border-radius: 999px; padding: 2px 8px; display: inline-block; }
      .x-chart { margin: 0; }
      .x-chart .chart__canvas { height: 150px; }
      /* 第 4 章：战役弹窗 */
      .x-pop { position: absolute; z-index: 5; width: 240px; background: var(--x-panel);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--x-line-2);
        border-radius: var(--x-r); padding: 10px 44px 10px 12px; font-size: 13px; color: var(--x-ink-2);
        transform: translate(-50%, calc(-100% - 16px)); }
      .x-pop[hidden] { display: none; }
      .x-pop h3 { margin: 0 0 4px; font: 600 14px/1.3 var(--x-serif); color: var(--x-ink); }
      .x-pop p { margin: 0; }
      .x-pop .x-fold { width: 36px; height: 36px; }
      /* 第 5 章：西晋时间线 */
      .x-tl { list-style: none; margin: 0 0 10px; padding: 0; font-size: 13px; }
      .x-tl li { display: flex; gap: 10px; padding: 6px 0 6px 14px; border-left: 2px solid var(--x-line-2); position: relative; }
      .x-tl li::before { content: ""; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--x-gold); }
      .x-tl b { font: 12px var(--x-mono); color: var(--x-gold-ink); min-width: 64px; padding-top: 1px; }
      /* 第 7 章：孝文帝改革小卡 */
      .x-qwc ul { margin: 4px 0 0; padding-left: 18px; color: var(--x-ink); }
      .x-qwc li { opacity: 0.15; transition: opacity 200ms; }
      .x-qwc li.on { opacity: 1; }
      .x-drawer__btn { display: none; }
      @media (max-width: 1023px) {
        :root { --x-right: 300px; --x-side: 180px; }
      }
      @media (max-width: 767px) {
        .x-app { grid-template-columns: minmax(0, 1fr);
          grid-template-rows: var(--x-top) 44px minmax(0, 1fr) auto;
          grid-template-areas: "top" "chs" "stage" "bar"; }
        .x-chs { display: flex; overflow-x: auto; border-right: 0;
          border-bottom: 1px solid var(--x-line); padding: 0; }
        .x-ch { width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent;
          min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
        .x-ch.on { border-bottom-color: var(--x-acc); }
        .x-ch b { display: inline; }
        .x-brand { min-width: 0; }
        .x-tools .x-btn span { display: none; }
        .x-panel { grid-area: auto; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
          max-height: 76vh; border-left: 0; border-top: 1px solid var(--x-line-2);
          border-radius: 16px 16px 0 0; transform: translateY(calc(100% - 50px));
          transition: transform 200ms var(--ease-out); padding-top: 50px;
          backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .x-panel.open { transform: translateY(0); }
        .x-drawer__btn { display: block; position: absolute; top: 0; left: 0; right: 0;
          height: 48px; border: 0; background: transparent; font-size: 13px; }
        .x-over { max-width: 86%; font-size: 12px; }
        .x-bar { padding-bottom: 58px; }
      }
    </style>
    <style>
      /* ===== 视觉改版：与门户首页一致的 Apple 式极简风格（只改样式） ===== */
      :root { --sans: var(--x-sans); --chart-mono: var(--x-mono); color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { background: var(--x-bg-1); color: var(--x-ink);
        font: 15px/1.6 var(--x-sans); -webkit-font-smoothing: antialiased; letter-spacing: 0; }
      h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; }
      a { color: var(--x-blue-ink); }
      :focus-visible { outline: 2px solid var(--x-blue); outline-offset: 2px; }
      .x-btn, .x-ch, .x-pol button, .x-sw, .x-q__opts button, .x-qz__opts button, .x-tick i,
      .x-prog__segs i, .x-fold, .x-back, .x-drawer__btn, .x-qwc li {
        transition: background-color var(--x-dur) var(--x-ease), color var(--x-dur) var(--x-ease),
          border-color var(--x-dur) var(--x-ease), box-shadow var(--x-dur) var(--x-ease),
          opacity var(--x-dur) var(--x-ease), transform var(--x-dur) var(--x-ease);
      }

      /* 顶栏 */
      .x-top { gap: 12px; padding: 0 16px; background: var(--x-glass);
        -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 0; box-shadow: inset 0 -0.5px 0 var(--x-line-2); position: relative; z-index: 10; }
      .x-back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; min-width: 44px;
        padding: 0 10px 0 4px; margin-left: -4px; border-radius: 980px; white-space: nowrap; flex: none;
        color: var(--x-blue-ink); text-decoration: none; font: 400 15px/1 var(--x-sans); letter-spacing: -0.01em; }
      .x-back b { font-size: 22px; font-weight: 400; line-height: 1; margin-top: -2px; }
      .x-back:hover { background: var(--x-blue-soft); }
      .x-brand { min-width: 0; padding-left: 12px; border-left: 0.5px solid var(--x-line-2); }
      .x-brand b { font: 600 15px/1.25 var(--x-sans); letter-spacing: -0.02em; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
      .x-brand span { font-size: 12px; color: var(--x-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-prog__segs { gap: 3px; }
      .x-prog__segs i { height: 3px; border-radius: 980px; background: var(--x-fill-2); }
      .x-prog__segs i.on { background: var(--x-blue); }
      .x-count { font: 12px var(--x-mono); color: var(--x-ink-2); }
      .x-tools { gap: 4px; }
      .x-btn { border: 0; border-radius: 980px; background: var(--x-fill); color: var(--x-ink);
        font: 500 14px/1 var(--x-mono); padding: 0 12px; }
      .x-btn:hover { background: var(--x-fill-2); color: var(--x-ink); }
      .x-btn:active { transform: scale(.96); }
      .x-btn.on, .x-btn[aria-pressed="true"] { background: var(--x-blue); color: var(--x-on-blue); }
      .x-btn[disabled] { opacity: .35; }
      .x-btn[disabled]:hover { background: var(--x-fill); }
      .x-toc { font: 500 13px/1 var(--x-sans); }

      /* 章节栏 */
      .x-chs { background: var(--x-bg-1); border-right: 0; box-shadow: inset -0.5px 0 0 var(--x-line-2); padding: 10px 8px; }
      .x-ch { border-left: 0; border-radius: 12px; padding: 8px 12px; margin: 1px 0; }
      .x-ch b { font: 12px var(--x-mono); color: var(--x-ink-2); letter-spacing: 0; }
      .x-ch span { font: 500 15px/1.35 var(--x-sans); letter-spacing: -0.01em; }
      .x-ch:hover { background: var(--x-hover); }
      .x-ch.on { background: var(--x-blue-soft); }
      .x-ch.on b, .x-ch.on span { color: var(--x-blue-ink); }
      .x-ch.on span { font-weight: 600; }
      .x-app.x-toc-off { grid-template-columns: 0 minmax(0, 1fr) var(--x-right); }
      .x-app.x-toc-off .x-chs { visibility: hidden; padding: 0; overflow: hidden; }

      /* 舞台浮层 */
      .x-stage { background: var(--x-sea); }
      .x-over { top: 16px; left: 16px; border: 0; border-radius: 22px; padding: 16px 56px 16px 18px;
        background: var(--x-glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
        box-shadow: var(--x-shadow), 0 0 0 0.5px var(--x-line); max-width: min(400px, 62%); }
      .x-over h2 { font: 600 20px/1.25 var(--x-sans); letter-spacing: -0.02em; margin: 0 0 6px; }
      .x-over p { font-size: 15px; line-height: 1.6; color: var(--x-ink); }
      .x-over__src { font-size: 12px !important; color: var(--x-ink-2) !important; }
      .x-fold { border: 0; background: var(--x-fill); border-radius: 980px; width: 44px; height: 44px;
