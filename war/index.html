<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>格物实验室 · 战役沙盘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />

    <style>
      :root, :root[data-theme="dark"] {
        --x-bg1: #0e1420; --x-bg2: #121a2a; --x-panel: #151e30; --x-line: #283245; --x-wash: #1b2538;
        --x-acc: #2ec4b6; --x-gold: #f2b544; --x-red: #ef6461; --x-text: #e6ecf5; --x-text2: #9aa6bb;
        --x-qin: #ef6461; --x-zhao: #5b9bff;
        --x-chu: #f5a03a; --x-qinj: #c8423c; --x-zhou: #8fa3bf;
        --x-cao: #3fd0e0; --x-yuan: #b07cff;
        --x-wu: #f0584c; --x-shu: #5fd068;
        --x-jin: #f2b544; --x-fq: #a97cff;
        --x-gr: #d6a35a; --x-pe: #d04a7e;
        --x-mac: #f2c14e; --x-pr: #a77bff;
        --x-ca: #f5953a; --x-ro: #e5484d;
        --x-nor: #4f8cff; --x-eng: #ef5350;
      }
      :root[data-theme="light"] {
        --x-bg1: #f6f3ec; --x-bg2: #efeadf; --x-panel: #ffffff; --x-line: #dcdfe4; --x-wash: #f3f1ec;
        --x-acc: #0f7d73; --x-gold: #9a6a0a; --x-red: #b83d40; --x-text: #1d2433; --x-text2: #566074;
        --x-qin: #b83d40; --x-zhao: #2f6fd0;
        --x-chu: #b8620a; --x-qinj: #6e1c1f; --x-zhou: #56677e;
        --x-cao: #0b8597; --x-yuan: #7a3fc4;
        --x-wu: #b8322b; --x-shu: #2f8a3a;
        --x-jin: #9a6a0a; --x-fq: #7140b8;
        --x-gr: #8a5a14; --x-pe: #921f55;
        --x-mac: #8f6400; --x-pr: #6a3bb5;
        --x-ca: #b45f06; --x-ro: #b42328;
        --x-nor: #2a62c9; --x-eng: #b8322f;
      }
      html, body { background-color: var(--x-bg1); }
      :root {
        --x-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
        --x-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", var(--sans);
        --x-mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --x-r: 10px; --x-t: 200ms;
      }
      .x-app { position: fixed; inset: 0; display: grid; grid-template: "top top top" 56px "side stage panel" 1fr "side ctrl panel" auto / 220px minmax(0, 1fr) 340px;
        background: var(--x-bg1) linear-gradient(160deg, var(--x-bg1), var(--x-bg2)); color: var(--x-text); font: 400 14px/1.5 var(--x-sans); }
      .x-app button { font: inherit; color: inherit; cursor: pointer; }
      .x-top { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--x-line); background: var(--x-panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
      .x-brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
      .x-brand small { font-size: 12px; color: var(--x-text2); letter-spacing: 0.08em; }
      .x-brand b { font: 600 16px/1.2 var(--x-serif); white-space: nowrap; }
      .x-prog { flex: 1; display: flex; align-items: center; gap: 10px; justify-content: center; min-width: 0; }
      .x-segs { display: flex; gap: 4px; flex: 0 1 360px; }
      .x-segs button { flex: 1; height: 24px; border: 0; padding: 0; background: none; display: grid; align-items: center; }
      .x-segs button::before { content: ""; height: 4px; border-radius: 2px; background: var(--x-line); transition: background var(--x-t); }
      .x-segs button[aria-current="true"]::before { background: var(--x-acc); }
      .x-count { font: 12px var(--x-mono); color: var(--x-text2); white-space: nowrap; }
      .x-tools { display: flex; gap: 6px; }
      .x-ib { width: 36px; height: 36px; border-radius: var(--x-r); border: 1px solid var(--x-line); background: var(--x-wash); display: grid; place-items: center; font: 13px var(--x-mono) !important; transition: border-color var(--x-t), background var(--x-t); }
      .x-ib:hover { border-color: var(--x-acc); }
      .x-ib:disabled { opacity: 0.4; cursor: default; }
      .x-side { grid-area: side; background: var(--x-bg1); overflow-y: auto; border-right: 1px solid var(--x-line); padding: 10px 0; margin: 0; list-style: none; }
      .x-side button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 16px 9px 18px; border-left: 3px solid transparent; transition: background var(--x-t); }
      .x-side button:hover { background: var(--x-wash); }
      .x-side button[aria-current="true"] { border-left-color: var(--x-acc); background: var(--x-wash); }
      .x-side i { display: block; font: normal 12px var(--x-mono); color: var(--x-text2); }
      .x-side span { font: 500 15px var(--x-serif); }
      .x-side em { font-style: normal; font-size: 12px; color: var(--x-text2); margin-left: 6px; }
      .x-stage { grid-area: stage; position: relative; overflow: hidden; touch-action: none; }
      .x-stage canvas { display: block; width: 100%; height: 100%; outline: none; }
      .x-ov { position: absolute; top: 14px; left: 14px; max-width: min(420px, calc(100% - 28px)); padding: 12px 14px; border-radius: var(--x-r); background: var(--x-panel); border: 1px solid var(--x-line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .x-ov header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .x-ov h1 { font: 600 20px/1.3 var(--x-serif); }
      .x-ov .x-meta { font: 12px var(--x-mono); color: var(--x-gold); margin-top: 2px; }
      .x-ov p.x-txt { margin-top: 8px; color: var(--x-text2); font-size: 13px; }
      .x-ov.is-folded p.x-txt { display: none; }
      .x-hud { position: absolute; left: 14px; bottom: 64px; display: grid; gap: 4px; font: 12px var(--x-mono); pointer-events: none; }
      .x-hud div { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; background: var(--x-panel); }
      .x-hud b { width: 8px; height: 8px; border-radius: 50%; }
      .x-sub { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(640px, calc(100% - 28px)); text-align: center; padding: 8px 14px; border-radius: var(--x-r); background: rgb(8 12 20 / 0.72); color: #e6ecf5; font: 500 15px/1.5 var(--x-serif); transition: opacity var(--x-t); }
      .x-sub:empty { opacity: 0; }
      .x-soon, .x-fail { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
      .x-soon span, .x-fail span { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--x-gold); color: var(--x-gold); background: var(--x-panel); font: 600 15px var(--x-serif); }
      .x-fail span { border-color: var(--x-red); color: var(--x-red); }
      .x-ctrl { grid-area: ctrl; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--x-line); background: var(--x-panel); }
      .x-tl { flex: 1; display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
      .x-tl button { flex: 1 0 auto; min-width: 64px; position: relative; overflow: hidden; border: 1px solid var(--x-line); border-radius: 8px; background: var(--x-wash); padding: 6px 8px 8px; font-size: 12px !important; text-align: center; white-space: nowrap; }
      .x-tl button i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--x-acc); }
      .x-tl button.is-past i { width: 100%; opacity: 0.45; }
      .x-tl button[aria-current="true"] { border-color: var(--x-acc); color: var(--x-acc); }
      .x-tl button:disabled { cursor: default; opacity: 0.6; }
      .x-panel { grid-area: panel; overflow-y: auto; border-left: 1px solid var(--x-line); background: var(--x-panel); padding: 14px 16px 24px; }
      .x-grip { display: none; }
      .x-card { border: 1px solid var(--x-line); border-radius: var(--x-r); padding: 12px 14px; margin-bottom: 12px; background: var(--x-wash); }
      .x-card h2 { font: 600 15px var(--x-serif); margin-bottom: 8px; }
      .x-card p, .x-card li { font-size: 13px; color: var(--x-text); }
      .x-card ul, .x-card ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
      .x-book { font-size: 12px; color: var(--x-acc); margin-bottom: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--x-line); }
      .x-dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
      .x-dl dt { color: var(--x-text2); } .x-dl dd { margin: 0; }
      .x-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; font-size: 13px; }
      .x-row input[type="range"] { flex: 1; accent-color: var(--x-acc); }
      .x-row output { font: 12px var(--x-mono); color: var(--x-gold); min-width: 40px; text-align: right; }
      .x-sw { appearance: none; -webkit-appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--x-line); position: relative; cursor: pointer; transition: background var(--x-t); flex: none; }
      .x-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--x-text); transition: transform var(--x-t); }
      .x-sw:checked { background: var(--x-acc); } .x-sw:checked::after { transform: translateX(16px); }
      .x-gk { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--x-gold); background: var(--x-wash); border-radius: 0 8px 8px 0; font-size: 13px; }
      .x-gk b { color: var(--x-gold); }
      .x-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--x-gold); color: var(--x-gold); font-size: 12px; }
      .x-panel .chart { padding: 12px 10px 8px; margin: 0; background: transparent; }
      .x-qsc { display: flex; align-items: baseline; gap: 6px; font: 13px var(--x-mono); color: var(--x-text2) !important; }
      .x-qsc b { font: 600 28px var(--x-mono); color: var(--x-gold); }
      .x-qsc small { margin-left: auto; font-size: 12px; }
      .x-card ol.x-marks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 0; margin-top: 8px; list-style: none; }
      .x-marks li { height: 26px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--x-line); font: 12px var(--x-mono); color: var(--x-text2); }
      .x-marks li[aria-current="true"] { border-color: var(--x-gold); color: var(--x-gold); }
      .x-marks li.is-ok, .x-sum li.is-ok b { color: var(--x-acc); border-color: var(--x-acc); }
      .x-marks li.is-no, .x-sum li.is-no b { color: var(--x-red); border-color: var(--x-red); }
      .x-qst { line-height: 1.6; margin-bottom: 10px; }
      .x-opts { display: grid; gap: 6px; }
      .x-opt, .x-qbtn { min-height: var(--tap); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--x-line); background: var(--x-panel); text-align: left; font-size: 13px !important; transition: border-color var(--x-t); }
      .x-opt:hover:not(:disabled), .x-qbtn:hover { border-color: var(--x-gold); }
      .x-opt:disabled { cursor: default; opacity: 0.7; }
      .x-opt.is-ok { border-color: var(--x-acc); color: var(--x-acc); opacity: 1; }
      .x-opt.is-no { border-color: var(--x-red); color: var(--x-red); opacity: 1; }
      .x-fb { margin-top: 10px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--x-acc); background: var(--x-panel); line-height: 1.6; }
      .x-fb.is-no { border-left-color: var(--x-red); }
      .x-fb b { display: block; }
      .x-fb.is-ok b { color: var(--x-acc); } .x-fb.is-no b { color: var(--x-red); }
      .x-qbtn { display: block; width: 100%; margin-top: 10px; text-align: center; border-color: var(--x-acc); color: var(--x-acc) !important; font-weight: 600 !important; }
      .x-hint { margin-top: 10px; font-size: 12px !important; color: var(--x-text2) !important; }
      .x-sum small { display: block; color: var(--x-text2); font-size: 12px; }
      .x-qt { width: 100%; border-collapse: collapse; font-size: 12px; }
      .x-qt th, .x-qt td { padding: 6px 4px; border-bottom: 1px solid var(--x-line); text-align: left; vertical-align: top; }
      .x-qt thead th { color: var(--x-text2); font-weight: 500; }
      .x-qt tbody th { font: 600 13px var(--x-serif); white-space: nowrap; }
      .x-qt tbody th small { display: block; font: 12px var(--x-mono); color: var(--x-gold); }
      @media (max-width: 1023px) { .x-app { grid-template-columns: 180px minmax(0, 1fr) 300px; } }
      @media (max-width: 767px) {
        .x-app { grid-template: "top" 56px "side" 48px "stage" 1fr "ctrl" auto / minmax(0, 1fr); padding-bottom: 52px; }
        .x-top { gap: 8px; padding: 0 8px; }
        .x-segs { display: none; }
        .x-tools { gap: 2px; } .x-ib { width: var(--tap); height: var(--tap); border: 0; background: none; }
        .x-side { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; border-right: 0; border-bottom: 1px solid var(--x-line); scrollbar-width: none; }
        .x-side li { flex: none; }
        .x-side button { height: 48px; padding: 4px 12px; border-left: 0; border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 6px; }
        .x-side button[aria-current="true"] { border-bottom-color: var(--x-acc); }
        .x-side em { display: none; }
        .x-tl button { min-height: var(--tap); }
        .x-ctrl .x-ib { flex: none; }
        .x-hud { bottom: auto; top: 14px; left: auto; right: 14px; }
        .x-ov { max-width: calc(100% - 150px); }
        .x-panel { position: fixed; left: 0; right: 0; bottom: 0; height: 74vh; z-index: 30; border: 1px solid var(--x-line); border-radius: 16px 16px 0 0; padding-top: 0; transform: translateY(calc(100% - 52px)); transition: transform 300ms var(--ease-out); box-shadow: 0 -8px 30px rgb(0 0 0 / 0.3); }
        .x-panel.is-open { transform: none; }
        .x-grip { display: flex; position: sticky; top: 0; z-index: 2; width: calc(100% + 32px); margin: 0 -16px 10px; height: 52px; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--x-panel); font: 600 14px var(--x-serif) !important; backdrop-filter: blur(16px); }
        .x-grip::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--x-text2); }
      }
    </style>
  </head>
  <body>

    <script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s), root = document.documentElement, PI = Math.PI;
  /* ---------- 章节内容（取自 war.txt） ---------- */
  const CH = [
    { name: "长平之战", meta: "前 260 年 · 秦 对 赵", live: true,

      t: "曹操统一北方后率军南下，统一全国的进程却在长江边受阻。下列战役中，奠定三国鼎立基础的是",
      e: "208 年赤壁之战，孙刘联军火攻曹军战船，奠定三国鼎立基础；官渡之战奠定的是曹操统一北方的基础。" },
    { b: 4, s: 3, k: "草木皆兵、风声鹤唳", a: 0, o: ["淝水之战；北方重新分裂", "淝水之战；前秦统一北方", "赤壁之战；北方重新分裂", "官渡之战；北方归于统一"],
      t: "“草木皆兵”“风声鹤唳”两个成语出自的战役，以及此战后北方的局势分别是",
      e: "383 年淝水之战，苻坚望八公山“草木皆兵”，溃逃时“风声鹤唳”；战后前秦瓦解，北方重新分裂，东晋得以稳定。" },
    { b: 5, s: 3, k: "萨拉米斯海战", a: 0, o: ["温泉关之战", "马拉松战役", "高加米拉战役", "坎尼会战"],
      t: "希波战争中，希腊联军扼守山崖与大海之间的狭道，殿后部队全军殉国，为萨拉米斯海战的胜利赢得了时间。这场战役是",
      e: "前 480 年温泉关之战，列奥尼达率部殿后殉国；同年希腊在萨拉米斯海战中大败波斯。" },
    { b: 7, s: 3, k: "两翼包围", a: 2, o: ["温泉关之战", "高加米拉战役", "坎尼会战", "黑斯廷斯战役"],
      t: "第二次布匿战争中，一方以新月阵型中路诱敌、两翼合围，歼灭对手大军。军事史上这一两翼包围歼敌的经典战例是",
      e: "前 216 年坎尼会战，汉尼拔两翼合围罗马约八万大军；罗马虽惨败，最终仍赢得第二次布匿战争。" },
    { b: 8, s: 4, k: "诺曼征服", a: 0, o: ["建立起强有力的王权，封建制度进一步发展", "颁布《大宪章》，王权受到限制", "议会取得最高权力，确立君主立宪制", "封建制度瓦解，走向共和"],
      t: "1066 年，诺曼底公爵威廉在黑斯廷斯战役中击败英格兰国王哈罗德。诺曼征服后，英格兰",
      e: "诺曼征服后英格兰建立起强有力的王权，封建制度进一步发展；《大宪章》在 1215 年，君主立宪制确立于 17 世纪末。" },
  ];
  let qi = 0, qAns = [], qHold = false;
  const AB = "ABCD";
  function qStage(q) {
    const Q = CH[cur], B = CH[q.b]; Q.sc = B.sc; Q.stages = B.stages; Q.live = true;
    $("#soon").hidden = true; $("#ovMeta").textContent = `${B.name} · ${B.meta}`; $("#ovTxt").textContent = B.bg;
    $("#tl").innerHTML = B.stages.map((s, k) => `<button data-s="${k}"><i></i>${s}</button>`).join("");
    ["#bPlay", "#bSPrev", "#bSNext"].forEach((s) => ($(s).disabled = false));
    lastS = -1; lastSub = ""; $("#sub").textContent = ""; setAuto(false); qHold = true; goStage(q.s);
    if (R) { cfg = B.sc.terrain; buildTerrain(); buildFeatures(); buildArmies(); resetView(); }
  }
  function qShow() {
    const ok = (i) => qAns[i] === QZ[i].a, done = qAns.length, n = QZ.filter((_, i) => ok(i)).length;
    $("#qScore").innerHTML = `<h2>得分卡</h2><p class="x-qsc"><b>${n}</b>/ ${QZ.length}<small>已答 ${done} 题</small></p>
      <ol class="x-marks">${QZ.map((_, i) => `<li class="${i < done ? (ok(i) ? "is-ok" : "is-no") : ""}" ${i === qi ? 'aria-current="true"' : ""} aria-label="第 ${i + 1} 题${i < done ? (ok(i) ? " 正确" : " 错误") : ""}">${i < done ? (ok(i) ? "✓" : "✗") : i + 1}</li>`).join("")}</ol>`;
    const body = $("#qBody");
    if (qi >= QZ.length) {
      body.innerHTML = `<h2>检测结果：${n} / ${QZ.length}</h2><ol class="x-sum">${QZ.map((q, i) => `<li class="${ok(i) ? "is-ok" : "is-no"}"><b>${ok(i) ? "✓" : "✗"}</b> ${q.k}
        <small>你选 ${AB[qAns[i]]}，正确 ${AB[q.a]}. ${q.o[q.a]}</small></li>`).join("")}</ol><button class="x-qbtn" data-act="redo">重新作答</button>`;
      return;
    }
    const q = QZ[qi], a = qAns[qi], ans = a !== undefined, B = CH[q.b];
    body.innerHTML = `<h2>第 ${qi + 1} 题 / ${QZ.length}</h2><p class="x-qst">${q.t}（　　）</p>
      <div class="x-opts">${q.o.map((o, k) => `<button class="x-opt${ans && k === q.a ? " is-ok" : ""}${ans && k === a && a !== q.a ? " is-no" : ""}" data-k="${k}" ${ans ? "disabled" : ""}>${AB[k]}. ${o}</button>`).join("")}</div>` +
      (ans ? `<p class="x-fb ${a === q.a ? "is-ok" : "is-no"}"><b>${a === q.a ? "回答正确" : `回答错误，正确答案 ${AB[q.a]}`}</b>${q.e}</p>
        <button class="x-qbtn" data-act="next">${qi + 1 < QZ.length ? "下一题" : "查看得分"}</button>`
        : `<p class="x-hint">舞台已切到「${B.name} · ${B.stages[q.s]}」，作答后播放该阶段演示。</p>`);
  }
  function qClick(e) {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k !== undefined) { qAns[qi] = +b.dataset.k; qHold = false; setAuto(false); goStage(QZ[qi].s); }
    else if (b.dataset.act === "next") { qi++; if (qi < QZ.length) qStage(QZ[qi]); }
    else if (b.dataset.act === "redo") { qi = 0; qAns = []; qStage(QZ[0]); }
    qShow(); const f = $("#qBody").querySelector("button:not([disabled])"); if (f) f.focus({ preventScroll: true });
  }
  /* ---------- 切章 ---------- */
  function setChapter(i, fromHash) {
    cur = (i + CH.length) % CH.length; const c = CH[cur];
    qHold = false; if (c.quiz) c.live = false;
    if (!fromHash) history.replaceState(null, "", "#" + (cur + 1));
    document.querySelectorAll("#side button, #segs button").forEach((b) => b.setAttribute("aria-current", +b.dataset.i === cur));
    const sb = document.querySelector(`#side button[data-i="${cur}"]`); if (sb) sb.scrollIntoView({ block: "nearest", inline: "nearest" });
    $("#count").textContent = `${pad(cur + 1)} / ${pad(CH.length)}`;
    $("#ovTitle").textContent = `第 ${cur + 1} 章 · ${c.name}`; $("#ovMeta").textContent = c.meta; $("#ovTxt").textContent = c.bg;
    $("#soon").hidden = !!c.live; $("#sub").textContent = ""; $("#hud").innerHTML = ""; lastSub = ""; lastS = -1; T = 0; setAuto(false);
    $("#tl").innerHTML = (c.stages.length ? c.stages : ["交互即将上线"]).map((s, k) => `<button data-s="${k}" ${c.live ? "" : "disabled"}><i></i>${s}</button>`).join("");
    ["#bPlay", "#bSPrev", "#bSNext"].forEach((s) => ($(s).disabled = !c.live));
    const panel = $("#panel"); panel.innerHTML = panelHTML(c); panel.scrollTop = 0; panel.classList.remove("is-open");
    $("#grip").addEventListener("click", () => { const o = panel.classList.toggle("is-open"); $("#grip").setAttribute("aria-expanded", o); });
    if (c.live) {
      $("#spd").addEventListener("input", (e) => { speed = +e.target.value; $("#spdOut").textContent = speed + "×"; });
      $("#swL").addEventListener("change", (e) => { show.labels = e.target.checked; if (labelsG) labelsG.visible = show.labels; });
      $("#swH").addEventListener("change", (e) => { show.helpers = e.target.checked; if (helpersG) helpersG.visible = show.helpers; });
    }
    makeChart();
    if (R) { cfg = c.live ? c.sc.terrain : TERRAIN.generic; buildTerrain(); buildFeatures(); buildArmies(); resetView(); }
    if (c.quiz) { $("#qBody").addEventListener("click", qClick); qStage(QZ[Math.min(qi, QZ.length - 1)]); if (qAns[qi] !== undefined || qi >= QZ.length) qHold = false; qShow(); }
  }
  function toggleTheme() {
    const t = isDark() ? "light" : "dark"; root.setAttribute("data-theme", t);
    try { localStorage.setItem("hark-theme", t); } catch (e) { /* 存储不可用：本次有效 */ }
    if (R) { buildTerrain(); buildFeatures(); armies.forEach((a) => { a.m.color.set(col(a.c)); a.m.blending = isDark() ? THREE.AdditiveBlending : THREE.NormalBlending; a.m.needsUpdate = true; }); }
  }
  function toggleFull() {
    const d = document; if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen();
    else if (root.requestFullscreen) root.requestFullscreen().catch(() => {});
  }
  /* ---------- 绑定 ---------- */
  $("#side").innerHTML = CH.map((c, i) => `<li><button data-i="${i}"><i>${pad(i + 1)}</i><span>${c.name}</span>${c.live || c.quiz ? "" : "<em>即将上线</em>"}</button></li>`).join("");
  $("#segs").innerHTML = CH.map((c, i) => `<button data-i="${i}" aria-label="第 ${i + 1} 章 ${c.name}"></button>`).join("");
  document.querySelectorAll("#side button, #segs button").forEach((b) => b.addEventListener("click", () => setChapter(+b.dataset.i)));
  $("#tl").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (b && !b.disabled) { setAuto(false); goStage(+b.dataset.s); } });
  $("#bPlay").addEventListener("click", () => { if (!auto && T >= NS() * DUR - 0.01) T = 0; setAuto(!auto); });
  $("#bSPrev").addEventListener("click", () => { setAuto(false); goStage(stageOf() - 1); });
  $("#bSNext").addEventListener("click", () => { setAuto(false); goStage(stageOf() + 1); });
  $("#bPrev").addEventListener("click", () => setChapter(cur - 1));
  $("#bNext").addEventListener("click", () => setChapter(cur + 1));
  $("#bTheme").addEventListener("click", toggleTheme);
  $("#bReset").addEventListener("click", resetView);
  $("#bFull").addEventListener("click", toggleFull);
  $("#bFold").addEventListener("click", () => { const f = $("#ov").classList.toggle("is-folded"); $("#bFold").textContent = f ? "+" : "–"; $("#bFold").setAttribute("aria-label", f ? "展开讲解" : "折叠讲解"); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft") setChapter(cur - 1); else if (k === "arrowright") setChapter(cur + 1);
    else if (k === "t") toggleTheme(); else if (k === "r") resetView(); else if (k === "f") toggleFull();
  });
  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return n >= 1 && n <= CH.length ? n - 1 : 0; };
  window.addEventListener("hashchange", () => { if (fromHash() !== cur) setChapter(fromHash(), true); });
  initGL();
  setChapter(fromHash(), true);
  requestAnimationFrame(tick);
})();
    </script>
  </body>
</html>
