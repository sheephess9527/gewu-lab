<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>近代中国 · 格物实验室</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--sel:#e8f1fc;--selfg:#0058b0;--btn2:#f5f5f7;--bar:rgba(251,251,253,.72);--shadow:0 2px 12px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04);
--sans:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace}
html.dark{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--blue:#2997ff;--sel:rgba(41,151,255,.18);--selfg:#6cb6ff;--btn2:#2c2c2e;--bar:rgba(0,0,0,.72);--shadow:0 0 0 1px rgba(255,255,255,.08)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;padding-top:env(safe-area-inset-top);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{color:var(--blue);text-decoration:none;white-space:nowrap;display:flex;align-items:center;min-height:44px}
.back b{font-size:22px;font-weight:400;margin-right:4px}
.tname{font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.segs{display:flex;gap:3px}.segs i{width:18px;height:4px;border-radius:2px;background:var(--line)}.segs i.on{background:var(--blue)}
.count{font:13px var(--mono);color:var(--sub)}
.tbtns{display:flex;gap:8px}
.pill{border:0;border-radius:980px;padding:0 16px;min-height:36px;background:var(--btn2);font-size:14px;white-space:nowrap}
.pill.primary{background:var(--blue);color:#fff}
html.dark .pill.primary,html.dark .chips button.on{color:#000}
.pill:disabled{opacity:.4;cursor:default}
.chbtn{margin-left:auto;min-height:44px}
/* layout */
.app{display:grid;grid-template-columns:220px 1fr 340px;height:calc(100vh - 56px)}
.toc{border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
.toc button,.sheet button.it{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px;align-items:center}
.toc button:hover{background:var(--btn2)}
.toc button.on,.sheet button.it.on{background:var(--sel);color:var(--selfg);font-weight:600}
.toc .mono,.sheet .mono{font-size:13px;color:var(--sub)}.on .mono{color:var(--selfg)!important}
.stage{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;min-height:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 20px}
.explain{flex:none}
.ehead{display:flex;align-items:center;gap:10px}
.ehead h2{font-size:20px;flex:1;min-width:0}
.book{font-size:13px;color:var(--sub);margin:2px 0 0}
.etext{margin:8px 0 0;max-height:4.9em;overflow:auto;line-height:1.6}
.explain.collapsed .etext,.explain.collapsed .book{display:none}
.fold{border:0;background:var(--btn2);border-radius:980px;padding:4px 12px;font-size:13px;color:var(--sub);min-height:32px}
.cwrap{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mtitle{display:none}
.sec h3{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:0;margin:0 0 8px}
.ctrls{display:flex;flex-direction:column;gap:12px}
.sl label{display:flex;justify-content:space-between;font-size:14px}.sl output{font-family:var(--mono);color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:0;border-radius:980px;padding:0 14px;min-height:34px;background:var(--btn2);font-size:14px}.chips button.on{background:var(--blue);color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:36px;border:0;background:none;padding:0;width:100%}
.tg i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:.2s}.tg i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on i{background:#34c759}.tg.on i::after{left:20px}
.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.ro dt{color:var(--sub)}.ro dd{margin:0;text-align:right;font-family:var(--mono)}
.points ul{margin:0;padding-left:18px}.points li{margin:4px 0}
.gk a{color:var(--blue);text-decoration:none;font-size:14px}
.mdark{display:none}
.soon{color:var(--sub);font-size:14px;margin:0}
/* sheet */
.mask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:70vh;overflow:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.bbar{display:none}
/* tablet */
@media (max-width:1023px){
 .prog{display:none}.app{display:block;height:auto}.toc{display:none}
 .stage{padding:12px}.cwrap{order:-1;flex:none;height:56vh}
 .explain .fold{display:none}.explain.collapsed .etext,.explain.collapsed .book{display:block}.etext{max-height:none;overflow:visible}
 .panel{border:0;padding:0 12px 24px}
}
@media (min-width:1024px){.chbtn{display:none}}
/* phone */
@media (max-width:767px){
 .top{height:calc(52px + env(safe-area-inset-top));gap:6px;padding-left:4px;padding-right:8px}
 .back{width:44px;justify-content:center}.back span{display:none}.back b{margin:0}
 .tname{flex:1;font-size:16px}.tbtns{display:none}.chbtn{margin-left:0;padding:0 12px}
 .stage{padding:0;gap:0}.cwrap{height:52vh;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
 .explain{background:none;box-shadow:none;padding:16px 16px 4px}.ehead h2{font-size:20px}.etext{font-size:16px;line-height:1.7}
 .panel{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
 input[type=range]{height:44px}.chips button,.tg{min-height:44px}
 .mdark{display:block;align-self:flex-start;min-height:44px}
 .bbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .bbar .pill{flex:1;min-height:44px}
}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../"><b>‹</b><span>格物实验室</span></a>
  <div class="tname">近代中国 · ModernLab</div>
  <div class="prog"><div class="segs" id="segs"></div><span class="count" id="count">01 / 10</span></div>
  <div class="tbtns">
    <button class="pill" id="prev">上一章</button><button class="pill primary" id="next">下一章</button>
    <button class="pill" id="dark">深色</button><button class="pill" id="fs">全屏</button>
  </div>
  <button class="pill chbtn" id="chbtn">章节 <span class="mono" id="chnum">01/10</span></button>
</header>
<div class="app">
  <nav class="toc" id="toc" aria-label="章节"></nav>
  <main class="stage">
    <section class="card explain" id="explain">
      <div class="ehead"><h2 id="ctitle"></h2><button class="fold" id="fold" aria-expanded="true">收起</button></div>
      <p class="book" id="cbook"></p>
      <p class="etext" id="ctext"></p>
    </section>
    <div class="cwrap" id="cwrap"><canvas id="cv"></canvas></div>
  </main>
  <aside class="panel">
    <section class="card sec" id="ctrlSec"><h3>控件</h3><div class="ctrls" id="ctrl"></div></section>
    <section class="card sec" id="readSec"><h3>读数</h3><div id="read"></div></section>
    <section class="card sec points" id="ptSec"><h3>要点</h3><div id="pts"></div></section>
    <section class="card sec gk" id="gkSec"><h3>高考链接</h3><div id="gk"></div></section>
    <button class="pill mdark" id="mdark">深色</button>
  </aside>
</div>
<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="章节列表"><div class="grab"></div><div id="slist"></div></div>
<div class="bbar"><button class="pill" id="bprev">上一章</button><button class="pill primary" id="bnext">下一章</button></div>
<script>
const CH=[
{n:"鸦片战争与《南京条约》",book:"统编版《中外历史纲要（上）》第 16 课",ready:true},
{n:"第二次鸦片战争与太平天国",book:"纲要（上）第 16–17 课",ready:true},
{n:"洋务运动",book:"纲要（上）第 18 课",ready:true},
{n:"甲午战争与瓜分狂潮",book:"纲要（上）第 18 课",ready:true},
{n:"戊戌变法与义和团运动",book:"纲要（上）第 18 课",ready:true},
{n:"辛亥革命",book:"纲要（上）第 19 课",ready:true},
{n:"新文化运动与五四运动",book:"纲要（上）第 20–21 课",ready:true},
{n:"中共成立与国民大革命",book:"纲要（上）第 21–22 课",ready:true},
{n:"全民族抗战",book:"纲要（上）第 23–24 课",ready:true},
{n:"随堂检测",book:"浙江选考 中国近代史",ready:true}];
/* ---------- map tool (100–132°E, 18–44°N, equirectangular) ---------- */
const MF="-apple-system,'PingFang SC','Noto Sans SC',sans-serif";
const COAST=[[107.9,21.5],[108.5,21.6],[109.6,21.5],[110.4,21.2],[111.6,21.6],[113.1,22.1],[114.2,22.3],[115.4,22.7],[116.7,23.4],[118.1,24.5],[119.0,25.3],[119.6,26.0],[120.2,26.9],[120.9,28.0],[121.5,28.7],[121.9,29.9],[121.0,30.6],[121.9,31.4],[120.9,32.6],[120.3,34.0],[119.4,34.7],[119.6,35.5],[120.4,36.1],[121.0,36.6],[122.1,37.4],[121.4,37.5],[120.3,37.6],[118.9,37.7],[118.0,38.3],[117.7,39.0],[118.5,39.2],[119.6,39.9],[121.0,40.8],[122.2,40.7],[121.6,38.9],[123.0,39.6],[124.4,40.1]];
const KOREA=[[124.4,40.1],[125.0,39.6],[125.3,37.7],[126.4,36.9],[126.3,34.6],[127.6,34.7],[129.3,35.2],[129.4,36.5],[128.4,38.6],[129.7,41.0],[130.7,42.3],[132,43]];
const LAND=[[100,18],[106,18],[105.8,19],[106.6,20.4]].concat(COAST,KOREA,[[132,44],[100,44]]);
const TAIWAN=[[121.0,25.3],[121.9,25.0],[121.6,24.0],[121.0,22.6],[120.8,21.9],[120.3,22.5],[120.1,23.3],[120.3,24.3],[120.8,25.0]];
const HAINAN=[[110.3,20.1],[111.0,19.6],[110.5,18.7],[109.6,18.2],[108.7,18.5],[108.6,19.3],[109.2,19.9],[109.7,20.0]];
const YANGTZE=[[100.5,28.5],[104,29],[106.5,29.6],[108.5,30.8],[111.3,30.7],[113,29.6],[114.3,30.6],[116,29.8],[117.6,30.9],[118.8,32.1],[119.4,32.2],[121.0,31.8],[121.9,31.4]];
const YELLOW=[[101,36],[103.8,36],[105.5,37.5],[106.5,39.5],[108,40.6],[110.5,40.3],[110.5,36.5],[110.2,34.6],[113.5,34.9],[116.5,36.3],[118.9,37.7]];
function mapChina(ctx,box){const T=theme(),dk=isDark(),s=Math.min(box.w/32,box.h/26),ox=box.x+(box.w-32*s)/2,oy=box.y+(box.h-26*s)/2;
 const X=lon=>ox+(lon-100)*s,Y=lat=>oy+(44-lat)*s,m={X,Y,s,box};
 const poly=(pts,close)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));if(close)ctx.closePath()};
 ctx.save();ctx.beginPath();ctx.rect(ox,oy,32*s,26*s);ctx.clip();ctx.fillStyle=dk?"#14212e":"#e6f1fb";ctx.fillRect(ox,oy,32*s,26*s);
 const coast=dk?"rgba(255,255,255,.35)":"rgba(0,0,0,.28)";ctx.fillStyle=dk?"#2a2a2c":"#f3efe6";ctx.strokeStyle=coast;ctx.lineWidth=1;ctx.lineJoin="round";
 poly(LAND,true);ctx.fill();poly(COAST.concat(KOREA));ctx.stroke();[TAIWAN,HAINAN].forEach(p=>{poly(p,true);ctx.fill();ctx.stroke()});
 ctx.strokeStyle=dk?"rgba(41,151,255,.7)":"rgba(0,113,227,.5)";ctx.lineWidth=1.2;[YANGTZE,YELLOW].forEach(p=>{poly(p);ctx.stroke()});
 ctx.restore();ctx.save();ctx.fillStyle=T.fg;ctx.globalAlpha=.6;ctx.font="12px "+MF;ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillText("示意图",ox+32*s-8,oy+26*s-6);ctx.restore();return m}
function city(ctx,m,name,lon,lat,color,r,side){const x=m.X(lon),y=m.Y(lat),g=(r=r||4)+4;side=side||"r";ctx.save();
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=theme().bg;ctx.stroke();
 if(name){ctx.font="600 12px "+MF;ctx.textBaseline="middle";ctx.textAlign=side==="l"?"right":side==="r"?"left":"center";
  ctx.lineWidth=3;ctx.strokeStyle=theme().bg;const tx=x+(side==="l"?-g:side==="r"?g:0),ty=y+(side==="t"?-g-3:side==="b"?g+4:0);ctx.strokeText(name,tx,ty);ctx.fillText(name,tx,ty)}ctx.restore()}
function arrowPath(ctx,m,pts,color,progress){progress=Math.max(0,Math.min(1,progress==null?1:progress));const P=pts.map(p=>[m.X(p[0]),m.Y(p[1])]),seg=[];let L=0;
 for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);seg.push(d);L+=d}let left=L*progress;if(left<=0)return;
 ctx.save();ctx.strokeStyle=ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.lineCap=ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);let ex=P[0][0],ey=P[0][1],a=0;
 for(let i=1;i<P.length&&left>0;i++){const f=Math.min(1,left/(seg[i-1]||1e-9));ex=P[i-1][0]+(P[i][0]-P[i-1][0])*f;ey=P[i-1][1]+(P[i][1]-P[i-1][1])*f;a=Math.atan2(P[i][1]-P[i-1][1],P[i][0]-P[i-1][0]);ctx.lineTo(ex,ey);left-=seg[i-1]}
 ctx.stroke();ctx.beginPath();ctx.moveTo(ex+Math.cos(a)*4,ey+Math.sin(a)*4);ctx.lineTo(ex-Math.cos(a-.5)*10,ey-Math.sin(a-.5)*10);ctx.lineTo(ex-Math.cos(a+.5)*10,ey-Math.sin(a+.5)*10);ctx.closePath();ctx.fill();ctx.restore()}
const MODS=[];// MODS[i]={text,points,gk,mount(ctrlEl,readEl),draw(ctx,w,h,t),pointer(e,type,x,y),unmount()}
/* ---------- 01 鸦片战争与《南京条约》 ---------- */
MODS[0]=(()=>{
 const EV=[
  {t:1839.45,d:"1839.6",n:"虎门销烟",s:"林则徐在虎门当众销毁鸦片，英国以此为借口发动战争。"},
  {t:1840.45,d:"1840.6",n:"封锁珠江口",s:"英军封锁珠江口，鸦片战争爆发。"},
  {t:1840.55,d:"1840.7",n:"攻占定海",s:"英军北上，攻占浙江定海。"},
  {t:1840.63,d:"1840.8",n:"抵天津大沽口",s:"英舰抵天津大沽口，威胁京师，清廷求和。"},
  {t:1841.05,d:"1841.1",n:"强占香港岛",s:"英军强占香港岛。"},
  {t:1842.6,d:"1842.8",n:"攻镇江 · 兵临南京",s:"英军沿长江攻镇江，兵临南京，清政府被迫签订《南京条约》。"}];
 const P={hm:[113.7,22.8],gz:[113.3,23.1],xm:[118.1,24.5],dh:[122.1,30.0],dg:[117.7,39.0],hk:[114.2,22.3],ws:[121.5,31.4],zj:[119.4,32.2],nj:[118.8,32.1]};
 const A1=[P.gz,[113.9,22.2],[117.0,22.9],P.xm,[120.4,25.6],[122.5,28.4],P.dh];
 const A2=[P.dh,[123.0,33.0],[122.9,36.9],[121.0,38.4],[119.3,38.7],P.dg];
 const B=[P.ws,[120.3,31.9],P.zj,P.nj];
 const PORTS=[["广州",113.3,23.1,"l"],["厦门",118.1,24.5,"r"],["福州",119.3,26.1,"r"],["宁波",121.6,29.9,"r"],["上海",121.5,31.2,"r"]];
 const CL=[
  {h:"《南京条约》",n:"割香港岛给英国",e:"领土主权被破坏",hl:"hk"},
  {h:"《南京条约》",n:"赔款 2100 万银元",e:"加重人民负担"},
  {h:"《南京条约》",n:"开放五口通商",e:"外国商品倾销，冲击自然经济",hl:"ports"},
  {h:"《南京条约》",n:"协定关税",e:"关税自主权遭破坏"}];
 const EX=[
  {h:"1843《虎门条约》",n:"领事裁判权",e:"司法主权遭破坏",x:1},
  {h:"1843《虎门条约》",n:"片面最惠国待遇",e:"英国可“一体均沾”，侵略特权不断扩大",x:1},
  {h:"1843《虎门条约》",n:"租地建屋",e:"为日后列强在通商口岸设立租界埋下伏笔",x:1},
  {h:"1844 美、法",n:"《望厦条约》（美）《黄埔条约》（法）",e:"美、法攫取与英国类似的特权，侵略势力扩大",hl:"ports",x:1}];
 const S={mode:"war",step:0,t0:0,reset:true,timer:null,sel:-1,ext:false,rects:[],dots:[],ro:null,warRow:null,tg:null,play:null};
 const cards=()=>S.ext?CL.concat(EX):CL;
 function upd(){const T=theme();if(!S.ro)return;
  if(S.mode==="war"){const e=EV[S.step];S.ro.update([["时间",e.d,T.blue],["事件",e.n,T.redText],["说明",e.s]])}
  else{const c=cards()[S.sel];S.ro.update(c?[["条款",c.h+" "+c.n,c.x?T.blue:T.goldText],["影响",c.e,T.redText]]:[["提示","点击条款卡片，查看对主权的影响"]])}}
 function setStep(k){S.step=Math.max(0,Math.min(EV.length-1,k));S.reset=true;upd()}
 function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}if(S.play)S.play.textContent="自动播放"}
 function play(){if(S.timer)return stop();if(S.step>=EV.length-1)setStep(0);S.play.textContent="暂停";
