<!doctype html>
<html lang="zh-CN" data-skin="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>格物实验室 · 等高线</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <style>
      :root {
        --bg1: #0e1420; --bg2: #121a2a; --panel: rgba(21, 30, 48, 0.82); --line: rgba(255, 255, 255, 0.08);
        --acc: #2ec4b6; --acc2: #f2b544; --warn: #ef6461; --ink: #e6ecf5; --ink2: #8a97ad;
        --serif: "Noto Serif SC", "Songti SC", serif; --mono: "Geist Mono", ui-monospace, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --r: 10px; --dur: 200ms;
      }
      :root[data-skin="paper"] {
        --bg1: #f6f3ec; --bg2: #efebe1; --panel: rgba(255, 255, 255, 0.88); --line: rgba(29, 36, 51, 0.12);
        --acc: #0b7a70; --acc2: #9a690c; --ink: #1d2433; --ink2: #5d6880;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background-color: var(--bg1);
        background-image: linear-gradient(160deg, var(--bg1), var(--bg2));
        color: var(--ink); font: 400 14px/1.6 var(--sans); overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      .app { display: grid; grid-template-rows: 56px 1fr; height: 100%; }
      /* top bar */
      .top { display: flex; align-items: center; gap: 16px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(14px); }
      .brand { font-family: var(--serif); font-weight: 700; white-space: nowrap; }
      .brand small { display: block; font: 400 12px/1.2 var(--sans); color: var(--ink2); letter-spacing: .08em; }
      .prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
      .prog__bars { display: flex; gap: 4px; flex: 1; min-width: 0; }
      .prog__bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background var(--dur); }
      .prog__bars i.on { background: var(--acc); }
      .prog__n { font: 500 12px var(--mono); color: var(--ink2); white-space: nowrap; }
      .tools { display: flex; gap: 6px; }
      .tbtn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: var(--r); display: grid; place-items: center; font: 500 13px var(--mono); transition: background var(--dur), border-color var(--dur); }
      .tbtn:hover { background: var(--line); border-color: var(--acc); }
      /* body grid */
      .body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; min-height: 0; }
      .chaps { border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; background-color: var(--bg1); }
      .app, .body { background-color: var(--bg1); }
      .chap { display: block; width: 100%; text-align: left; padding: 10px 14px 10px 16px; border-left: 3px solid transparent; transition: background var(--dur); }
      .chap b { display: block; font: 500 12px var(--mono); color: var(--ink2); letter-spacing: .1em; }
      .chap span { font-family: var(--serif); font-size: 15px; }
      .chap:hover { background: var(--line); }
      .chap.on { border-left-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
      .chap.on b, .chap.on span { color: var(--acc); }
      /* stage */
      .stage { position: relative; min-width: 0; overflow: hidden; }
      #gl { display: block; width: 100%; height: 100%; touch-action: none; }
      .float { position: absolute; top: 14px; left: 14px; width: min(380px, calc(100% - 28px)); background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
      .float h2 { margin: 0 0 6px; font: 700 17px/1.3 var(--serif); }
      .float p { margin: 0 0 6px; color: var(--ink2); font-size: 13px; }
      .float p:last-child { margin-bottom: 0; }
      .float__src { font: 400 12px var(--mono); color: var(--acc2); letter-spacing: .02em; padding-right: 40px; }
      .float h2 { padding-right: 40px; }
      .fold { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border-radius: 8px; color: var(--ink2); }
      .float.min .float__body { display: none; }
      .readout { position: absolute; left: 14px; bottom: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; font: 500 12px var(--mono); backdrop-filter: blur(14px); }
      .readout b { color: var(--acc); }
      .lab { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font: 500 12px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; transition: opacity var(--dur); }
      .lab[data-kind="water"] { color: #5aa9e6; }
      .lab[data-kind="cliff"] { color: var(--warn); }
      .lab[data-kind="saddle"] { color: var(--acc2); }
      /* panel */
      .panel { background-color: var(--bg2); border-left: 1px solid var(--line); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--panel); }
      .card h3 { margin: 0 0 8px; font: 700 14px var(--serif); }
      .card ul { margin: 0; padding-left: 18px; color: var(--ink2); font-size: 13px; }
      .card li { margin-bottom: 5px; }
      .ttl { font: 500 12px var(--mono); letter-spacing: .14em; color: var(--ink2); text-transform: uppercase; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
      .row label { font-size: 13px; }
      .val { font: 500 12px var(--mono); color: var(--acc); }
      .sw { position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--line); border: 1px solid var(--line); transition: background var(--dur); flex: none; }
      .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink2); transition: transform var(--dur), background var(--dur); }
      .sw[aria-pressed="true"] { background: color-mix(in srgb, var(--acc) 35%, transparent); }
      .sw[aria-pressed="true"]::after { transform: translateX(20px); background: var(--acc); }
      input[type="range"] { width: 100%; accent-color: var(--acc); height: 44px; }
      .dock { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px); }
      .dock button { min-height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; transition: background var(--dur); }
      .dock button:hover { background: var(--line); }
      .dock button[aria-pressed="true"] { background: color-mix(in srgb, var(--acc) 18%, transparent); border-color: var(--acc); color: var(--acc); }
      @media (max-width: 1023px) { .readout { bottom: 132px; } .top { gap: 8px; padding: 0 8px; } .tools { gap: 3px; } .dock { bottom: 62px; left: 14px; right: auto; flex-wrap: wrap; } }
      .note { font-size: 12px; color: var(--ink2); }
      .hl { color: var(--acc2); }
      .soon { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px; color: var(--ink2); font-size: 13px; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 400 12px var(--mono); color: var(--ink2); }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
      .drawer__grab { display: none; }
      .x-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      .x-btn { min-height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; transition: background var(--dur), border-color var(--dur); }
      .x-btn:hover { background: var(--line); border-color: var(--acc); }
      .x-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--acc) 18%, transparent); border-color: var(--acc); color: var(--acc); }
      @media (max-width: 1023px) {
        .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .chaps { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; gap: 6px; }
        .chap { width: auto; white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; border-radius: 8px; padding: 6px 10px; }
        .chap.on { border-left: 0; border-bottom-color: var(--acc); }
        .chap b { display: inline; margin-right: 6px; }
        .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 72vh; border-left: 0; border-top: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(16px); border-radius: 16px 16px 0 0; transform: translateY(calc(100% - 52px)); transition: transform var(--dur); z-index: 5; }
        .panel.open { transform: translateY(0); }
        .chap { min-height: 44px; }
        .drawer__grab { display: block; width: 100%; min-height: 44px; font: 500 12px var(--mono); color: var(--ink2); }
        .prog__bars { display: none; }
        .brand small { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">等高线<small>格物实验室</small></div>
        <div class="prog"><div class="prog__bars" id="bars"></div><span class="prog__n" id="count">01 / 10</span></div>
        <div class="tools">
          <button class="tbtn" id="prev" aria-label="上一章">←</button>
          <button class="tbtn" id="next" aria-label="下一章">→</button>
          <button class="tbtn" id="theme" aria-label="切换主题">T</button>
          <button class="tbtn" id="reset" aria-label="重置视角">R</button>
          <button class="tbtn" id="full" aria-label="全屏">F</button>
        </div>
      </header>
      <div class="body">
        <nav class="chaps" id="chaps" aria-label="章节"></nav>
        <div class="stage" id="stage">
          <canvas id="gl"></canvas>
          <div class="float" id="float">
            <button class="fold" id="fold" aria-label="折叠讲解">—</button>
            <h2 id="f-title">认识等高线地形图</h2>
            <div class="float__body" id="f-body"></div>
          </div>
          <div class="readout" id="readout">悬停地表读取海拔</div>
          <div class="dock" id="dock" role="toolbar" aria-label="视角">
            <button data-view="persp" aria-pressed="true">斜视</button>
            <button data-view="top" aria-pressed="false">俯视</button>
            <button data-view="south" aria-pressed="false">南望</button>
            <button id="spin" aria-pressed="false">自动旋转</button>
          </div>
        </div>
        <aside class="panel" id="panel">
          <button class="drawer__grab" id="grab">控制面板 ▲</button>
          <div id="panel-body"></div>
        </aside>
      </div>
    </div>
    <script src="hark.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
      /* ---------- 内容：10 章讲解（取自 contour.txt） ---------- */
      const CH = [
        { t: "认识等高线地形图", p: ["等高线是地面上海拔相同的各点连成的闭合曲线。把立体的地表“压”成平面上的一圈圈线条，就能在一张纸上读出山的高低、坡的陡缓和地形的起伏。", "8 km × 8 km 虚拟山区北部三座山峰连成东西向山脉，西支流发源于西峰—主峰之间的鞍部，东支流发源于主峰—东峰之间的鞍部，在中南部汇合；东峰东南翼被断层切出一道陡崖；西南有盆地湖泊，南部还有一座孤丘。下方悬浮的是同一地区的等高线地形图。", "拖动旋转视角，滚轮缩放，右键平移；鼠标悬停地表可读取该点海拔与坡度。"] },
        { t: "等高线的形成", p: ["用一组间隔相等的水平面去截切地表，每个水平面与地表的交线就是一条等高线；再把这些交线垂直投影到同一平面上，便得到等高线地形图。", "同线等高：同一条等高线上各点的海拔相等。同图等距：同一幅图中，相邻等高线的高差（等高距）相同。", "闭合曲线：每条等高线都是闭合的，可能在图幅外闭合。一般不相交：只有在陡崖处才会重合。"] },
        { t: "海拔与相对高度", p: ["海拔（绝对高度）是地面某点高出海平面的垂直距离；相对高度是两个地点之间的海拔差。", "相对高度 = 海拔高 − 海拔低。"] },
        { t: "等高距与坡度", p: ["相邻两条等高线之间的高差叫等高距。在同一幅图中，等高线越密集，坡度越陡；越稀疏，坡度越缓。", "密陡·疏缓：水平距离越短、升高同样的等高距，坡就越陡。"] },
        { t: "山顶与盆地", p: ["两者都表现为一组闭合等高线。数值内高外低为山顶，内低外高为盆地（洼地）。", "示坡线是垂直于等高线的短线，指向海拔较低的一侧。山顶的示坡线画在闭合线外侧，盆地的画在内侧。"] },
        { t: "山脊与山谷", p: ["等高线向同一方向弯曲时：弯曲部分凸向低处为山脊，凸向高处为山谷。", "凸低为脊 · 凸高为谷", "山脊线（金色）是分水线：雨水沿它向两侧分流。", "山谷线是集水线，河流多发育在山谷中（蓝色河流）。", "河流的流向与山谷处等高线的凸出方向相反；本图两条支流都发源于北部鞍部，自北向南流，在中南部汇合。"] },
        { t: "鞍部", p: ["鞍部是相邻两个山顶之间相对低洼的部位，形似马鞍。在图上表现为两组闭合等高线之间的部分。", "两山夹一低：比两侧山顶低，又比两侧山谷高。"] },
        { t: "陡崖", p: ["多条等高线在某处重合的地方是陡崖。图上常用专门的陡崖符号表示，短齿指向崖下低处。", "本图东峰的东南翼被一条东北—西南走向的断层切断，下降盘一侧沉落，留下高耸的断层崖：崖高在中段最大，向两端逐渐消失，等高线也只在中段重合。"] },
        { t: "地形剖面图", p: ["剖面图反映沿某条直线方向的地势起伏。在地形图上确定剖面线，找出它与各等高线的交点，按比例标出交点海拔，再用平滑曲线连接。", "四步：01 定剖面线 · 02 找交点 · 03 定海拔 · 04 连曲线。"] },
        { t: "随堂检测", p: ["用 4–6 道单选题检查等高线形成、地形部位判断、相对高度计算与剖面图绘制的掌握情况，作答后即时给出对错与解析。"] },
      ];
      /* ---------- 地形高度函数（后续章节复用） ---------- */
      const SIZE = 8, HMAX = 1500, CI = 100;
      const sq = (v) => v * v;
      const RIV = [
        [[3.0, 6.15], [3.1, 5.2], [3.5, 4.2], [4.0, 3.3]],
        [[5.0, 6.1], [4.9, 5.2], [4.5, 4.2], [4.0, 3.3]],
        [[4.0, 3.3], [3.8, 2.2], [3.95, 1.0], [3.75, 0.0]],
      ];
      function gauss(x, y, cx, cy, a, s) { return a * Math.exp(-(sq(x - cx) + sq(y - cy)) / (2 * s * s)); }
      function segDist(x, y, a, b) {
        const vx = b[0] - a[0], vy = b[1] - a[1];
        let t = ((x - a[0]) * vx + (y - a[1]) * vy) / (vx * vx + vy * vy);
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(a[0] + vx * t - x, a[1] + vy * t - y);
      }
      function riverW(x, y) {
        let c = 0;
        for (let i = 0; i < RIV.length; i++) {
          const p = RIV[i]; let d = 1e9;
          for (let k = 0; k < p.length - 1; k++) d = Math.min(d, segDist(x, y, p[k], p[k + 1]));
          const ramp = i < 2 ? Math.min(1, Math.max(0, (p[0][1] + 0.25 - y) / 0.8)) : 1;
          c = Math.max(c, ramp * Math.exp(-d * d / (2 * 0.24 * 0.24)));
        }
        return c;
      }
      // 海拔（米），x,y 单位 km，范围 0–8
      function H(x, y) {
        let h = 110 + 34 * y + 190 * Math.exp(-sq((y - 6.75) / 0.9)) * Math.exp(-sq(sq((x - 4) / 3.2)));
        h += gauss(x, y, 2.0, 6.7, 640, 0.62) + gauss(x, y, 4.0, 6.9, 900, 0.68) + gauss(x, y, 6.0, 6.6, 740, 0.62) + gauss(x, y, 6.75, 5.5, 420, 0.8);
        const r = Math.hypot(x - 1.7, y - 2.1);
        h += 230 * Math.exp(-sq((r - 1.05) / 0.42)) - 60 * Math.exp(-r * r / 0.5);
        h += gauss(x, y, 6.3, 1.5, 420, 0.45);
        const w = riverW(x, y);
        h += (1 - w) * (18 * Math.sin(x * 2.1 + 1.3) * Math.sin(y * 1.7 + 0.4) + 9 * Math.sin(x * 4.3 + y * 3.1) + 5 * Math.sin(x * 7.9 - y * 6.7));
        h -= w * (60 + 0.25 * Math.max(0, h - 200));
        const ax = 7.3, ay = 5.9, vx = 6.1 - ax, vy = 4.5 - ay, L = Math.hypot(vx, vy);
        const t = ((x - ax) * vx + (y - ay) * vy) / (L * L), s = -((x - ax) * vy - (y - ay) * vx) / L;
        const sm = Math.min(1, Math.max(0, (s + 0.03) / 0.06));
        h -= 300 * Math.exp(-sq((t - 0.5) / 0.3)) * (sm * sm * (3 - 2 * sm)) * Math.exp(-sq(Math.max(s, 0)) / 1.2);
        return Math.max(0, Math.min(HMAX, h));
      }
      // 坡度（度）
      function slopeDeg(x, y) {
        const e = 0.02;
        const gx = (H(x + e, y) - H(x - e, y)) / (2 * e * 1000);
        const gy = (H(x, y + e) - H(x, y - e)) / (2 * e * 1000);
        return Math.atan(Math.hypot(gx, gy)) * 180 / Math.PI;
      }
      // 按海拔分层设色 绿→黄→褐→白
      const RAMP = [[0, 46, 102, 66], [120, 86, 140, 72], [320, 150, 170, 86], [600, 186, 158, 104], [900, 150, 118, 86], [1150, 170, 150, 140], [1350, 240, 244, 250], [1500, 255, 255, 255]];
      function colorAt(h) {
        for (let i = 1; i < RAMP.length; i++) {
          if (h <= RAMP[i][0]) {
            const a = RAMP[i - 1], b = RAMP[i], t = (h - a[0]) / (b[0] - a[0]);
            return [(a[1] + (b[1] - a[1]) * t) / 255, (a[2] + (b[2] - a[2]) * t) / 255, (a[3] + (b[3] - a[3]) * t) / 255];
          }
        }
        return [1, 1, 1];
      }
      /* ---------- 等高线提取（marching squares，可复用） ---------- */
      const GRIDS = {};
      function heightGrid(n) {
        if (GRIDS[n]) return GRIDS[n];
        const st = SIZE / n, g = [];
        for (let j = 0; j <= n; j++) { const row = new Float32Array(n + 1); for (let i = 0; i <= n; i++) row[i] = H(i * st, j * st); g.push(row); }
        return (GRIDS[n] = g);
      }
      function contourSegs(level, n) {
        n = n || 180; const st = SIZE / n, out = [];
        const grid = heightGrid(n);
        const ip = (x1, v1, x2, v2) => x1 + (x2 - x1) * ((level - v1) / (v2 - v1));
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
          const x0 = i * st, y0 = j * st, x1 = x0 + st, y1 = y0 + st;
          const a = grid[j][i], b = grid[j][i + 1], c = grid[j + 1][i + 1], d = grid[j + 1][i];
          const idx = (a > level) | ((b > level) << 1) | ((c > level) << 2) | ((d > level) << 3);
          if (idx === 0 || idx === 15) continue;
          const pt = { 0: [x0, ip(y0, a, y1, d)], 1: [ip(x0, a, x1, b), y0], 2: [x1, ip(y0, b, y1, c)], 3: [ip(x0, d, x1, c), y1] };

        const Q = [
          { t: "地形部位", s: "图中 P 点位于西峰与主峰之间，P 点所在的地形部位是", o: ["山顶", "鞍部", "山谷", "陡崖"], a: 1,
            why: "P 位于西峰、主峰两组闭合等高线之间，比两侧山顶低、又比南北两侧山谷高——<span class=\"hl\">两山夹一低</span>，为鞍部。",
            pre: () => { aim(3, 6.8, -0.2, 0.9, 6); dot(3, 6.84, PINK, "P"); },
            post: () => { hi(1000, [3, 6.84], 1.6, GOLD, -Math.PI / 2); dot(2, 6.7, ORG, "西峰 " + Math.round(H(2, 6.7)) + " m"); dot(4, 6.9, ORG, "主峰 " + Math.round(H(4, 6.9)) + " m"); topLab(3, 7.3, "鞍部 P " + Math.round(H(3, 6.84)) + " m"); } },
          { t: "河流流向", s: "图中某河段处的等高线向北凸出，该河段的流向是", o: ["自北向南", "自南向北", "自西向东", "自东向西"], a: 0,
            why: "等高线向北凸出，凸向数值高处，说明这里是<span class=\"hl\">山谷</span>，北高南低；河流流向与等高线凸出方向相反，故<span class=\"hl\">自北向南</span>。",
            pre: () => { aim(3.1, 5.4, 0, 0.85, 5); hi(300, [3.1, 5.5], 0.7, GOLD, 0); hi(400, [3.1, 5.9], 0.7, GOLD, 0); topLab(3.1, 5.2, "该河段"); },
            post: () => { path(RIV[0], BLUE); topLab(3.1, 6.0, "等高线凸向北（高处）"); topLab(3.6, 4.4, "↓ 自北向南流"); } },
          { t: "陡崖崖高", s: "东峰东南翼陡崖处有 3 条等高线重合，等高距 100 m，崖高 ΔH 的范围是", o: ["100 ≤ ΔH < 200 m", "200 ≤ ΔH < 300 m", "200 ≤ ΔH < 400 m", "300 ≤ ΔH < 400 m"], a: 2,
            why: "公式 <span class=\"hl\">(n−1)d ≤ ΔH &lt; (n+1)d</span>，n = 3、d = 100 m，得 <span class=\"hl\">200 ≤ ΔH &lt; 400 m</span>。重合的是 500、600、700 m 线：崖顶 700–800 m，崖底 400–500 m。",
            pre: () => { aim(6.8, 5.3, 0.75, 0.95, 5); [500, 600, 700].forEach((lv) => hi(lv, [6.8, 5.3], 0.45, RED)); mapLab(6.8, 5.3, "3 条线重合"); },
            post: () => { dot(6.75, 5.39, ORG, "崖顶 " + Math.round(H(6.75, 5.39)) + " m"); dot(6.92, 5.24, BLUE, "崖底 " + Math.round(H(6.92, 5.24)) + " m"); } },
          { t: "坡度缓陡", s: "从同一起点出发的登山路线甲（红）、乙（蓝），水平长度都是 1.5 km，坡度较缓的是", o: ["路线甲", "路线乙", "一样缓", "无法判断"], a: 1,
            why: "同一幅图等高距相同，<span class=\"hl\">等高线越稀疏，坡度越缓</span>。同样 1.5 km，乙穿过的等高线远少于甲，所以乙更缓。",
            pre: () => { aim(4.5, 6.0, 0.3, 0.9, 7); path([R1, R甲], RED); path([R1, R乙], BLUE); topLab(R甲[0], R甲[1], "甲"); topLab(R乙[0], R乙[1], "乙"); },
            post: () => { const a = crossings(R1, R甲, RED), b = crossings(R1, R乙, BLUE); mapLab(3.6, 6.3, "甲穿过 " + a + " 条（密·陡）"); mapLab(5.6, 5.6, "乙穿过 " + b + " 条（疏·缓）"); } },
          { t: "剖面图", s: "沿图中 A—B 线（自西向东）作地形剖面，正确的剖面图是", o: ["①", "②", "③", "④"], a: 2,
            fig: () => '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">' + PROF.map(mini).join("") + "</div>",
            why: "AB 依次经过西峰、主峰、东峰：三个峰中<span class=\"hl\">中间最高</span>、东侧高于西侧，A 端低于 B 端。② 起伏颠倒，① 东西反向，④ 少了两侧山峰，只有 ③ 正确。",
            pre: () => { aim(3.6, 6.4, 0, 0.9, 9); path([PA, PB], PINK); topLab(PA[0], PA[1], "A"); topLab(PB[0], PB[1], "B"); },
            post: () => { [2.1, 4.0, 6.0].forEach((x) => dot(x, 6.75, ORG, Math.round(H(x, 6.75)) + " m")); } },
          { t: "闭合等高线", s: "主峰处最内一条闭合等高线与外侧较高的一条同为 1400 m（等高距 100 m），闭合区内山顶海拔 H 可能是", o: ["1300 < H < 1400 m", "H = 1400 m", "1400 < H < 1500 m", "1300 < H < 1500 m"], a: 2,
            why: "闭合区与<span class=\"hl\">较高线等值</span>、内高外低，是山顶：H 在 (高, 高+d)，即 <span class=\"hl\">1400 &lt; H &lt; 1500 m</span>（“大于大的”）。",
            pre: () => { aim(4, 6.9, -0.35, 0.95, 6); hi(1300, [4, 6.9], 1, GOLD, -Math.PI / 2); hi(1400, [4, 6.9], 0.6, RED, -Math.PI / 3); },
            post: () => { dot(4, 6.9, ORG, "主峰 " + Math.round(H(4, 6.9)) + " m"); } },
        ];
        const ok = (i) => '<span style="color:var(--acc)">✓</span>', no = '<span style="color:var(--warn)">✗</span>';
        function score() {
          const s = el("c10-sc"); if (!s) return;
          const n = ans.filter(Boolean).length;
          s.innerHTML = '<h3>得分卡</h3><p style="margin:0;font:600 28px var(--mono);color:var(--acc)">' + n + ' <span class="note">/ ' + Q.length + "</span></p>" +
            '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px">' + Q.map((q, i) =>
              '<span style="text-align:center;border:1px solid ' + (i === qi ? "var(--acc)" : "var(--line)") + ';border-radius:6px;padding:4px 0;font:400 12px var(--mono)">' + (i + 1) + " " + (ans[i] == null ? "·" : ans[i] ? ok() : no) + "</span>").join("") +
            '</div><p class="note">已答 ' + ans.filter((a) => a != null).length + " / " + Q.length + " 题</p>";
        }
        function render() {
          const box = el("c10-q"); if (!box) return;
          clear(); score();
          if (qi >= Q.length) {
            aim(4, 4.6, -0.6, 1.0, 12);
            box.innerHTML = '<p>得分 <b style="color:var(--acc)">' + ans.filter(Boolean).length + " / " + Q.length + '</b></p><ul style="margin:0;padding-left:18px;font-size:13px">' +
              Q.map((q, i) => "<li>" + (ans[i] ? ok() : no) + " 第 " + (i + 1) + " 题 · " + q.t + "</li>").join("") +
              '</ul><div class="x-btns"><button class="x-btn" id="c10-redo">重新作答</button></div>';
            el("c10-redo").onclick = () => { ans = []; qi = 0; render(); };
            return;
          }
          const q = Q[qi]; q.pre();
          box.innerHTML = '<p class="note" style="margin:0">第 ' + (qi + 1) + " / " + Q.length + " 题 · 单选</p><p>" + q.s + "</p>" + (q.fig ? q.fig() : "") +
            '<div class="x-btns">' + q.o.map((t, i) => '<button class="x-btn" data-i="' + i + '" aria-pressed="false">' + "ABCD"[i] + ". " + t + "</button>").join("") +
            '</div><div class="note" id="c10-f" aria-live="polite"></div>';
          box.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => {
            if (ans[qi] != null) return;
            const i = +b.dataset.i, right = i === q.a; ans[qi] = right;
            b.setAttribute("aria-pressed", "true");
            box.querySelectorAll("[data-i]").forEach((o) => { if (+o.dataset.i === q.a) o.style.borderColor = "var(--acc)"; else if (o === b) { o.style.borderColor = "var(--warn)"; o.style.color = "var(--warn)"; } });
            el("c10-f").innerHTML = "<p>" + (right ? ok() + " 正确。" : no + " 错误，正确答案 " + "ABCD"[q.a] + "。") + q.why + '</p><div class="x-btns"><button class="x-btn" id="c10-n">' + (qi < Q.length - 1 ? "下一题 →" : "查看得分") + "</button></div>";
            q.post(); score();
            el("c10-n").onclick = () => { qi++; render(); };
          }));
        }
        const panel = [
          '<p class="ttl">第 10 章 · 随堂检测</p>',
          '<div class="card" id="c10-sc"></div>',
          '<div class="card"><h3>单选题</h3><div id="c10-q"></div></div>',
          '<div class="card"><h3>要点</h3><ul>',
          '<li>地形部位：闭合内高外低为山顶；<span class="hl">两山夹一低</span>为鞍部；多线重合为陡崖。</li>',
          '<li>凸低为脊、凸高为谷；河流流向与谷地等高线凸出方向<span class="hl">相反</span>。</li>',
          '<li>崖高 <span class="hl">(n−1)d ≤ ΔH &lt; (n+1)d</span>；密陡·疏缓；闭合区“大于大的，小于小的”。</li>',
          '<li><b>高考链接：</b>等高线判读是浙江地理选考必考基础，常与河流、选址、通视、剖面图组合出题。</li></ul></div>',
        ].join("");
        function loop() {
          if (!on) return;
          const r = canvas.getBoundingClientRect();
          pool.forEach((d, i) => { if (i >= labs.length) d.style.display = "none"; });
          labs.forEach((Lb, i) => {
            let d = pool[i];
            if (!d) { d = document.createElement("div"); d.className = "lab"; stage.appendChild(d); pool.push(d); }
            d.style.display = ""; d.textContent = Lb.t;
            v3.set(Lb.p[0], Lb.p[1], Lb.p[2]).project(camera);
            d.style.opacity = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 ? 1 : 0;
            d.style.left = (v3.x * 0.5 + 0.5) * r.width + "px";
            d.style.top = (-v3.y * 0.5 + 0.5) * r.height + "px";
          });
          requestAnimationFrame(loop);
        }
        window.C10 = {
          panel: panel,
          enter: (active) => {
            g10.visible = m10.visible = active;
            if (!active) { if (on) { on = false; pool.forEach((d) => (d.style.display = "none")); } return; }
            if (qi < Q.length && ans[qi] != null) qi++;
            render();
            if (!on) { on = true; requestAnimationFrame(loop); }
          },
        };
        if (cur === 9) go(9);
      })();
    </script>
  </body>
</html>
