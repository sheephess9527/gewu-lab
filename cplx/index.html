<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>格物实验室 复数</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--blue-ink:#fff;--sel-bg:#e8f1fc;--sel-fg:#0058b0;--btn2:#f5f5f7;--glass:rgba(251,251,253,.72);--shadow:0 2px 12px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
--sans:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace;--r:22px;color-scheme:light}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--blue:#2997ff;--blue-ink:#000;--sel-bg:#0b2a4a;--sel-fg:#6cb6ff;--btn2:#2c2c2e;--glass:rgba(0,0,0,.72);--shadow:0 2px 12px rgba(0,0,0,.4);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;min-width:44px;font-size:15px;white-space:nowrap}
.back b{font-size:22px;font-weight:400;line-height:1}
.ttl{font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.segs{display:flex;gap:4px}.segs i{width:22px;height:4px;border-radius:2px;background:var(--line)}.segs i.on{background:var(--blue)}
.pnum{font:13px var(--mono);color:var(--sub)}
.tbtns{display:flex;gap:8px}
.pill{border:0;border-radius:999px;padding:0 16px;min-height:36px;background:var(--btn2);font-size:14px;white-space:nowrap}
.pill.pri{background:var(--blue);color:var(--blue-ink)}
.pill:disabled{opacity:.4;cursor:default}
.pill:focus-visible,.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chbtn{display:none;margin-left:auto;min-height:44px}
/* layout */
.app{display:grid;grid-template-columns:220px 1fr 340px;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.toc{border-right:1px solid var(--line);padding:16px 12px;overflow:auto}
.toc button,.sheet button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px;align-items:center}
.toc button:hover{background:var(--btn2)}
.toc .num,.sheet .num{font:13px var(--mono);color:var(--sub)}
.toc button.on,.sheet button.on{background:var(--sel-bg);color:var(--sel-fg);font-weight:600}
.toc button.on .num,.sheet button.on .num{color:var(--sel-fg)}
.stage{display:flex;flex-direction:column;gap:16px;padding:16px;min-width:0;min-height:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.lesson{flex:0 0 auto;padding:14px 20px}
.lhead{display:flex;align-items:baseline;gap:12px}
.lhead h2{font-size:20px}
.book{font-size:13px;color:var(--sub)}
.fold{margin-left:auto;border:0;background:none;color:var(--blue);font-size:13px;min-height:32px}
.ltext{margin:6px 0 0;max-height:4.8em;overflow:auto;line-height:1.6;color:var(--fg)}
.lesson.folded .ltext,.lesson.folded .book{display:none}
.cvwrap{position:relative;flex:1 1 auto;min-height:0;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.soon div{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:24px 32px;text-align:center}
.soon h3{font-size:20px}.soon p{margin:4px 0 0;color:var(--sub);font-size:14px}
.panel{border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.mlesson,.mdark{display:none}
.box{padding:16px 18px}
.box h3{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:0;margin-bottom:8px}
.ctrls{display:flex;flex-direction:column;gap:12px}
.ctrls:empty,.reads:empty{display:none}
.row{display:flex;flex-direction:column;gap:6px}
.row .lab{display:flex;justify-content:space-between;font-size:14px}
.row .val{font-family:var(--mono);color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--blue),var(--blue)) 0/var(--p,50%) 100% no-repeat,var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:999px;background:var(--btn2);padding:0 14px;min-height:34px;font-size:14px}
.chips button.on{background:var(--blue);color:var(--blue-ink)}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:36px;border:0;background:none;padding:0;width:100%}
.tog i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-pressed=true] i{background:var(--blue)}.tog[aria-pressed=true] i::after{transform:translateX(18px)}
.reads{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.reads dt{color:var(--sub)}.reads dd{margin:0;text-align:right;font-family:var(--mono)}
.pts{margin:0;padding-left:1.2em;font-size:14px}.pts li+li{margin-top:6px}
.gk{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:14px}
.mbar,.sheetbg{display:none}
.imm .toc,.imm .panel{display:none}.imm .app{grid-template-columns:1fr}
@media (max-width:1023px){.imm .cvwrap{height:calc(100vh - 160px)}}
/* tablet + phone */
@media (max-width:1023px){
 .prog,.toc,.tbtns .nav2{display:none}
 .chbtn{display:inline-flex;align-items:center}
 .tbtns{margin-left:0}
 .app{display:block;height:auto}
 .stage{padding:12px 16px 0}
 .lesson{display:none}
 .cvwrap{flex:none;height:56vh}
 .panel{border:0;overflow:visible;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
 .mlesson{display:block}
 .mlesson h2{font-size:20px}
 .mlesson p.ltext2{font-size:16px;line-height:1.7;margin:8px 0 0}
 .mbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .mbar .pill{flex:1;min-height:44px;font-size:15px}
 .sheetbg{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3)}
 .sheet{position:absolute;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
 .sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
 .row{min-height:44px}
 input[type=range]{height:44px}
 .chips button{min-height:44px}
 .tog{min-height:44px}
}
@media (max-width:767px){
 .top{height:52px;gap:6px;padding:0 6px 0 2px}
 .back span,.tbtns{display:none}
 .ttl{flex:1;font-size:16px}
 .chbtn{margin-left:0;padding:0 14px}
 .stage{padding:0}
 .cvwrap{height:52vh;border-radius:0;border-width:0 0 1px;box-shadow:none}
 .mdark{display:inline-flex;align-items:center;align-self:flex-start;min-height:44px}
}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../" aria-label="返回格物实验室"><b>‹</b><span>格物实验室</span></a>
  <div class="ttl">复数 · ComplexLab</div>
  <div class="prog"><div class="segs" id="segs"></div><span class="pnum" id="pnum">01 / 07</span></div>
  <button class="pill chbtn" id="chBtn" aria-haspopup="dialog">章节 01/07</button>
  <div class="tbtns">
    <button class="pill nav2" id="prev">上一章</button>
    <button class="pill pri nav2" id="next">下一章</button>
    <button class="pill" id="dark">深色</button>
    <button class="pill" id="full">全屏</button>
  </div>

  <nav class="toc" id="toc" aria-label="章节"></nav>
  <main class="stage">
    <section class="card lesson" id="lesson">
      <div class="lhead"><h2 id="lt"></h2><span class="book" id="lb"></span><button class="fold" id="fold" aria-expanded="true">收起</button></div>

    <div class="mlesson"><h2 id="mt"></h2><div class="book" id="mb"></div><p class="ltext2" id="mx"></p></div>

</div>
<div class="mbar"><button class="pill" id="mprev">上一章</button><button class="pill pri" id="mnext">下一章</button></div>
<div class="sheetbg" id="sheet" hidden><div class="sheet" role="dialog" aria-label="章节列表"><div class="grab"></div><div id="sheetList"></div></div></div>
<script>
const CH=[
 {n:"数系的扩充",book:"人教A版 必修第二册 · 7.1.1 数系的扩充和复数的概念",ready:false},
 {n:"复平面与模",book:"人教A版 必修第二册 · 7.1.2 复数的几何意义",ready:false},
 {n:"加减法与向量",book:"人教A版 必修第二册 · 7.2.1 复数的加、减运算及其几何意义",ready:false},
 {n:"乘法即旋转",book:"人教A版 必修第二册 · 7.2.2 复数的乘、除运算",ready:false},
 {n:"除法与共轭",book:"人教A版 必修第二册 · 7.2.2 复数的乘、除运算",ready:false},
 {n:"三角形式与 n 次方根",book:"人教A版 必修第二册 · 7.3 复数的三角表示 · 拓展",ready:false},
 {n:"随堂检测",book:"人教A版 必修第二册 · 第七章 复数",ready:false}];
const MODS=new Array(CH.length).fill(null);
/* ---------- 01 数系的扩充 ---------- */
MODS[0]=(()=>{
const F=(s,b)=>(b?"600 ":"")+s+'px -apple-system,"PingFang SC","Noto Sans SC",sans-serif',SUP=n=>String(n).replace(/\d/g,d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
const LV=[{s:"N",n:"自然数",eq:"计数",rep:"0, 1, 2, 3",add:"0, 1, 2, 3, …",why:"用来计数"},
 {s:"Z",n:"整数",eq:"x+3=1",rep:"−1, −2",add:"负整数 −1, −2, …",why:"x + 3 = 1 ⇒ x = −2"},
 {s:"Q",n:"有理数",eq:"3x=2",rep:"2/3, −1/2",add:"分数 2/3, −1/2, …",why:"3x = 2 ⇒ x = 2/3"},
 {s:"R",n:"实数",eq:"x²=2",rep:"√2, π",add:"无理数 √2, π, …",why:"x² = 2 ⇒ x = ±√2"},
 {s:"C",n:"复数",eq:"x²=−1",rep:"i, 2+3i",add:"虚数 i, 2 + 3i, …",why:"x² = −1 ⇒ x = ±i"}];
const S={mode:"ext",sel:4,anim:null,a:3,b:2,par:false,m:0,n:1};let rects=[],lastDark=null,sub=null;
const cls=(a,b)=>Math.abs(b)<1e-9?"实数":Math.abs(a)<1e-9?"纯虚数":"非纯虚数";
const z=()=>S.par?C(S.m*S.m-3*S.m+2,S.m-1):C(S.a,S.b);
function upd(){
 if(S.mode==="ext"){const L=LV[S.sel];readout([["当前层",L.s+" "+L.n,"blue"],["新加入的数",L.add,"gold"],["解决的问题",L.why]])}
 else if(S.mode==="cls"){const w=z(),c=cls(w.re,w.im),rows=[];if(S.par)rows.push(["m",nf(S.m)]);
  rows.push(["z = a + bi",C.fmt(w),"blue"],["实部 a",nf(w.re)],["虚部 b",nf(w.im)],["类别",c==="实数"?"实数":"虚数 · "+c,"gold"]);
  if(S.par)rows.push(["结论",Math.abs(S.m-1)<1e-9?"是实数 0，不是纯虚数":c==="纯虚数"?"m = 2：实部 0 且虚部 ≠ 0，是纯虚数":"实部 ≠ 0，不是纯虚数",c==="纯虚数"?"blue":"red"]);
  readout(rows)}
 else{const k=S.n%4;readout([["n",String(S.n)],["n mod 4",String(k),"gold"],["i"+SUP(S.n),["1","i","−1","−i"][k],"blue"],["i + i² + i³ + i⁴","i − 1 − i + 1 = 0"]])}}
function build(){sub.innerHTML="";
 if(S.mode==="ext")button("逐层展开",()=>{S.anim=performance.now()},true,sub);
 else if(S.mode==="cls"){chips({parent:sub,label:"题型",options:[{label:"自由探索",value:false},{label:"参数题",value:true}],value:S.par,onchange:v=>{S.par=v;build();upd()}});
  if(S.par){const p=document.createElement("p");p.textContent="z = (m² − 3m + 2) + (m − 1)i 为纯虚数，求 m。";p.style.cssText="margin:0;font:var(--type-small);color:var(--text-secondary)";sub.appendChild(p);
   slider({parent:sub,label:"m",min:-3,max:4,step:.5,value:S.m,oninput:v=>{S.m=v;upd()}})}
  else{slider({parent:sub,label:"实部 a",min:-5,max:5,step:.5,value:S.a,oninput:v=>{S.a=v;upd()}});
   slider({parent:sub,label:"虚部 b",min:-5,max:5,step:.5,value:S.b,oninput:v=>{S.b=v;upd()}})}}
 else slider({parent:sub,label:"n",min:0,max:20,step:1,value:S.n,fmt:x=>String(x),oninput:v=>{S.n=v;upd()}})}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function drawExt(c,W,H){const T=theme(),m=16,dy=Math.max(22,Math.min(40,(H-2*m-40)/8)),dx=Math.min(56,(W-2*m)/12);
 let shown=5;if(S.anim!=null){const e=performance.now()-S.anim;shown=Math.min(5,1+Math.floor(e/700));if(e>4000)S.anim=null}
 rects=[];
 for(let k=4;k>=0;k--){const d=4-k,x=m+d*dx,y=m+d*dy,w=W-2*m-2*d*dx,h=H-2*m-2*d*dy,L=LV[k],on=k===S.sel;rects[k]={x,y,w,h};
  if(k>=shown)continue;
  rr(c,x,y,w,h,14);c.fillStyle=T.bg;c.fill();c.globalAlpha=.06+.06*k;c.fillStyle=T.blue;c.fill();c.globalAlpha=1;
  c.strokeStyle=on?T.blue:T.axis;c.lineWidth=on?2.5:1;c.stroke();
  c.textBaseline="middle";c.textAlign="left";c.font=F(13,1);c.fillStyle=on?T.blue:T.fg;const ty=y+dy/2+2,t1=L.s+" "+L.n;c.fillText(t1,x+10,ty);
  const lw=c.measureText(t1).width;c.font=F(13);c.fillStyle=T.fg;const t2=k?"解 "+L.eq:L.eq;c.fillText(" · "+t2,x+10+lw,ty);
  const used=lw+c.measureText(" · "+t2).width+24;c.fillStyle=T.goldText;
  if(k===0){if(h-dy>18){c.textAlign="center";c.fillText(L.rep,x+w/2,y+dy+(h-dy)/2)}}
  else if(used+c.measureText(L.rep).width<w){c.textAlign="right";c.fillText(L.rep,x+w-10,ty)}}}
function drawCls(c,W,H){const T=theme(),w=z(),k=cls(w.re,w.im),bw=Math.min(120,W/4.4),bh=36;
 const N={root:[W/2,H*.17,"复数 a+bi"],re:[W*.27,H*.44,"实数"],im:[W*.68,H*.44,"虚数"],pu:[W*.52,H*.71,"纯虚数"],np:[W*.84,H*.71,"非纯虚数"]},
  on={root:1,re:k==="实数",im:k!=="实数",pu:k==="纯虚数",np:k==="非纯虚数"};
 c.textAlign="center";c.textBaseline="middle";
 [["root","re","b = 0"],["root","im","b ≠ 0"],["im","pu","a = 0"],["im","np","a ≠ 0"]].forEach(([p,q,l])=>{const A=N[p],B=N[q],hl=on[q];
  c.strokeStyle=hl?T.blue:T.axis;c.lineWidth=hl?2.5:1;c.beginPath();c.moveTo(A[0],A[1]+bh/2);c.lineTo(B[0],B[1]-bh/2);c.stroke();
  c.font=F(12);c.fillStyle=hl?T.blue:T.fg;c.fillText(l,(A[0]+B[0])/2+(B[0]<A[0]?-24:24),(A[1]+B[1])/2)});
 Object.keys(N).forEach(key=>{const [x,y,l]=N[key],hl=on[key];rr(c,x-bw/2,y-bh/2,bw,bh,10);c.fillStyle=T.bg;c.fill();
  if(hl){c.globalAlpha=.12;c.fillStyle=T.blue;c.fill();c.globalAlpha=1}c.strokeStyle=hl?T.blue:T.axis;c.lineWidth=hl?2:1;c.stroke();
  c.font=F(14,hl);c.fillStyle=hl?T.blue:T.fg;c.fillText(l,x,y)});
 c.font=F(15,1);c.fillStyle=T.blue;c.fillText((S.par?"z = (m² − 3m + 2) + (m − 1)i = ":"z = ")+C.fmt(w),W/2,H*.88)}
function drawPow(c,W,H){const T=theme(),M=drawAxes(c,{x:16,y:16,w:W-32,h:H-56},[-1.7,1.7],[-1.5,1.5],{grid:false,ticks:false,labels:["实轴","虚轴"]}),
 k=S.n%4,P=[[1,0,"1"],[0,1,"i"],[-1,0,"−1"],[0,-1,"−i"]];
 c.strokeStyle=T.axis;c.lineWidth=1;c.beginPath();c.arc(M.X(0),M.Y(0),M.s,0,7);c.stroke();
 arrow(c,M.X(0),M.Y(0),M.X(P[k][0]),M.Y(P[k][1]),T.blue);
 P.forEach(([x,y,l],j)=>{const hl=j===k,px=M.X(x),py=M.Y(y);c.fillStyle=hl?T.blue:T.fg;c.beginPath();c.arc(px,py,hl?7:4,0,7);c.fill();
  c.font=F(hl?15:13,hl);c.textAlign=x<0?"right":"left";c.textBaseline=y<0?"top":"bottom";
  c.fillText("i"+SUP(j)+" = "+l,px+(x<0?-12:x>0?12:10),py+(y<0?10:-10))});
 c.font=F(15);c.fillStyle=T.fg;c.textAlign="center";c.textBaseline="middle";
 c.fillText("n = "+S.n+"，"+S.n+" mod 4 = "+k+"，i"+SUP(S.n)+" = "+P[k][2],W/2,H-22)}
return{
 text:"自然数不够减，就有了负数；整数不够除，就有了分数；有理数开不尽方，就有了无理数。到了实数，x² + 1 = 0 仍然无解——于是规定一个新数 i，让 i² = −1。形如 a + bi（a、b 为实数）的数叫复数：a 是实部，b 是虚部。b = 0 时是实数，b ≠ 0 是虚数，a = 0 且 b ≠ 0 是纯虚数。",

  if(type==="move"&&act){let nx=m.invX(x),ny=m.invY(y);if(snap){nx=Math.round(nx/snap)*snap;ny=Math.round(ny/snap)*snap}
   act.x=nx;act.y=ny;act.onmove&&act.onmove(act);return true}
  if(type==="up"){const was=!!act;act=null;return was}return false}}
function wrapText(ctx,text,x,y,maxW,lh){let line="",yy=y;for(const ch of String(text)){if(ch==="\n"){ctx.fillText(line,x,yy);line="";yy+=lh;continue}
 if(ctx.measureText(line+ch).width>maxW&&line){ctx.fillText(line,x,yy);line=ch;yy+=lh}else line+=ch}if(line)ctx.fillText(line,x,yy);return yy+lh}

const cv=$("cv"),ctx=cv.getContext("2d");let W=0,H=0,DPR=1,cur=-1,mod=null,t0=performance.now();
function resize(){const r=$("cvwrap").getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,3);W=r.width;H=r.height;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);frame(performance.now())}
function frame(now){if(!W||!H)return;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=theme().bg;ctx.fillRect(0,0,W,H);
 if(mod&&mod.draw){try{mod.draw(ctx,W,H,(now-t0)/1000)}catch(err){console.error(err)}}}
(function loop(now){frame(now);requestAnimationFrame(loop)})(performance.now());
new ResizeObserver(resize).observe($("cvwrap"));window.addEventListener("resize",resize);
function ptr(type){return e=>{if(!mod||!mod.pointer)return;const r=cv.getBoundingClientRect();
 if(type==="down")try{cv.setPointerCapture(e.pointerId)}catch(_){}
 mod.pointer(e,type,e.clientX-r.left,e.clientY-r.top)}}
cv.addEventListener("pointerdown",ptr("down"));cv.addEventListener("pointermove",ptr("move"));
cv.addEventListener("pointerup",ptr("up"));cv.addEventListener("pointercancel",ptr("up"));
function listHTML(el){el.innerHTML="";CH.forEach((c,i)=>{const b=document.createElement("button");b.type="button";
 b.innerHTML='<span class="num">'+pad(i)+"</span><span></span>";b.lastChild.textContent=c.n;b.onclick=()=>{go(i);closeSheet()};el.appendChild(b)})}

$("segs").innerHTML=CH.map(()=>"<i></i>").join("");
function go(i){i=Math.max(0,Math.min(CH.length-1,i));if(i===cur)return;
 if(mod&&mod.unmount)try{mod.unmount()}catch(e){console.error(e)}
 cur=i;const c=CH[i],ready=c.ready&&MODS[i];mod=ready?MODS[i]:null;CTRL=$("ctrl");READ=$("read");CTRL.innerHTML="";READ.innerHTML="";
 const text=ready?mod.text||"":"本章交互实验即将上线。";
 $("lt").textContent=$("mt").textContent=pad(i)+" "+c.n;$("lb").textContent=$("mb").textContent=c.book;$("lx").textContent=$("mx").textContent=text;
 $("soon").hidden=!!ready;
 if(ready&&mod.mount)try{mod.mount(CTRL,READ)}catch(e){console.error(e)}
 $("ctrlBox").hidden=!CTRL.children.length;$("readBox").hidden=!READ.children.length;
 const pts=ready&&mod.points||[];$("pts").innerHTML="";pts.forEach(p=>{const li=document.createElement("li");li.textContent=p;$("pts").appendChild(li)});$("ptBox").hidden=!pts.length;
 const gk=ready&&mod.gk;$("gk").innerHTML="";if(gk){const items=Array.isArray(gk)?gk:[gk];items.forEach(g=>{const el=document.createElement(g.href?"a":"p");el.className="gk";
  if(g.href)el.href=g.href;el.textContent=typeof g==="string"?g:g.label||g.text;$("gk").appendChild(el)})}$("gkBox").hidden=!gk;
 const lab=pad(i)+" / "+pad(CH.length-1);$("pnum").textContent=lab;$("chBtn").textContent="章节 "+pad(i)+"/"+pad(CH.length-1);
 document.querySelectorAll("#segs i").forEach((s,k)=>s.classList.toggle("on",k<=i));
 ["toc","sheetList"].forEach(id=>[...$(id).children].forEach((b,k)=>{b.classList.toggle("on",k===i);b.setAttribute("aria-current",k===i?"true":"false")}));
 $("prev").disabled=$("mprev").disabled=i===0;$("next").disabled=$("mnext").disabled=i===CH.length-1;
 if(location.hash!=="#"+(i+1))history.replaceState(null,"","#"+(i+1));resize()}
function shell(){/* re-render current chapter, e.g. after MODS[i] is registered */const i=cur;cur=-1;go(i)}
$("prev").onclick=$("mprev").onclick=()=>go(cur-1);$("next").onclick=$("mnext").onclick=()=>go(cur+1);
$("dark").onclick=$("dark2").onclick=toggleTheme;
function setImm(on){document.documentElement.classList.toggle("imm",on);$("full").textContent=on?"退出全屏":"全屏";$("full").setAttribute("aria-pressed",on);resize()}
$("full").onclick=()=>{const on=!document.documentElement.classList.contains("imm");setImm(on);
 try{const p=on?(!document.fullscreenElement&&document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()):(document.fullscreenElement&&document.exitFullscreen());p&&p.catch&&p.catch(()=>{})}catch(e){}};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.documentElement.classList.contains("imm"))setImm(false)});
$("fold").onclick=()=>{const f=$("lesson").classList.toggle("folded");$("fold").textContent=f?"展开":"收起";$("fold").setAttribute("aria-expanded",!f);resize()};
function closeSheet(){$("sheet").hidden=true}
$("chBtn").onclick=()=>{$("sheet").hidden=false;const on=$("sheetList").querySelector(".on");on&&on.scrollIntoView({block:"nearest"})};
$("sheet").onclick=e=>{if(e.target===$("sheet"))closeSheet()};
document.addEventListener("keydown",e=>{const tg=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(tg)||e.target.isContentEditable)return;
 if(e.key==="Escape")closeSheet();if(e.key==="ArrowLeft")go(cur-1);if(e.key==="ArrowRight")go(cur+1)});
const fromHash=()=>{const n=parseInt(location.hash.slice(1),10);return n>=1&&n<=CH.length?n-1:0};
window.addEventListener("hashchange",()=>go(fromHash()));
applyTheme();go(fromHash());
