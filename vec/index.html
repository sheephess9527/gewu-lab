<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>格物实验室 平面向量</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--red:#e5484d;--gold:#c98a12;--teal:#0a9396;--purple:#8e6bd8;--soft:#f5f5f7;--sel:#eaf3fe;--seltext:#0058b0;--glass:rgba(251,251,253,.72);--grid:rgba(0,0,0,.06);--axis:rgba(0,0,0,.45);--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
--sans:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace;--safe:env(safe-area-inset-bottom,0px)}
.dark{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--blue:#2997ff;--red:#ff6369;--gold:#e0a93a;--teal:#2ec4b6;--purple:#a98bf0;--soft:#2c2c2e;--sel:#10263d;--seltext:#2997ff;--glass:rgba(0,0,0,.72);--grid:rgba(255,255,255,.08);--axis:rgba(255,255,255,.5);--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{font-size:14px;color:var(--blue);white-space:nowrap;display:flex;align-items:center;min-height:44px}
.title{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;gap:3px;margin-left:auto;align-items:center}
.prog i{width:16px;height:4px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--blue)}
.count{font:13px var(--mono);color:var(--sub);white-space:nowrap}
.tbtns{display:flex;gap:6px}
.pill{border:0;border-radius:980px;padding:7px 15px;background:var(--soft);font-size:13px;min-height:32px;white-space:nowrap}
.pill.primary{background:var(--blue);color:#fff}.pill:disabled{opacity:.4;cursor:default}
.chbtn{display:none}
/* layout */
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.toc{border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
.toc ol{list-style:none;margin:0;padding:0}
.toc button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px;line-height:1.4;min-height:40px}
.toc button b{font:13px var(--mono);color:var(--sub);font-weight:400;padding-top:1px}
.toc button:hover{background:var(--soft)}
.toc button.on{background:var(--sel);color:var(--seltext)}.toc button.on b,.toc button.on span{color:var(--seltext);background:none}
.sheethead{display:none}
.stage{display:flex;flex-direction:column;gap:14px;padding:16px;min-width:0;min-height:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.intro{padding:16px 20px;flex:0 0 auto}
.introhead{display:flex;align-items:center;gap:10px}
.introhead h2{font-size:20px;flex:1;min-width:0}
.book{font-size:13px;color:var(--sub);margin:2px 0 0}
.text{margin:6px 0 0;max-height:4.9em;overflow:auto;line-height:1.6}
.intro.fold .book,.intro.fold .text{display:none}
.cvwrap{position:relative;flex:1;min-height:0;overflow:hidden;padding:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.soon div{padding:22px 30px;text-align:center}.soon h3{font-size:20px}.soon p{margin:4px 0 0;color:var(--sub);font-size:14px}
.panel{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec{padding:16px 18px}.sec h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:0}
.mtitle,.mbook,.mtext{display:none}
/* controls */
.ctl{margin:10px 0}.ctl:first-child{margin-top:0}
.ctl .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}.ctl .row span:last-child{font-family:var(--mono);color:var(--sub)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--blue),var(--blue)) 0/var(--p,50%) 100% no-repeat,var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:0;border-radius:980px;padding:6px 13px;background:var(--soft);font-size:13px;min-height:32px}
.chips button.on{background:var(--blue);color:#fff}
.btnrow{margin:10px 0}
.tog{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;gap:10px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(18px)}
.read{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.read dt{color:var(--sub)}.read dd{margin:0;font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.empty{color:var(--sub);font-size:14px;margin:0}
.pts{margin:0;padding-left:18px;font-size:14px}.pts li{margin:4px 0}
.gk a{display:block;font-size:14px;padding:4px 0}
.mdark,.bbar,.scrim{display:none}
sub,sup{font-size:12px}
/* tablet + phone */
@media (max-width:1023px){
  .app{display:block;height:auto}
  .stage{padding:12px 12px 0}
  .cvwrap{order:-1;flex:none;height:52vh}
  .toc{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:70vh;background:var(--card);border:0;border-radius:20px 20px 0 0;padding:8px 12px calc(16px + var(--safe));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
  .toc button{min-height:44px;font-size:15px}
  body.sheet .toc{transform:none}
  .sheethead{display:flex;justify-content:center;padding:6px 0 10px}.sheethead i{width:36px;height:5px;border-radius:3px;background:var(--line)}
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3)}body.sheet .scrim{display:block}
  .chbtn{display:inline-flex;align-items:center;min-height:44px}
  .panel{border:0;overflow:visible;padding:12px}
  .toc-d{display:none}
}
@media (min-width:768px) and (max-width:1023px){.prog,.back span{display:none}.title{flex:1 0 auto}.back{min-width:44px;justify-content:center;font-size:22px}.cvwrap{height:56vh}.panel{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:767px){
  .top{height:52px;padding:0 6px 0 2px;gap:6px}
  .back{width:44px;height:44px;justify-content:center;font-size:24px}.back span{display:none}
  .title{flex:1}
  .prog,.count,.tbtns{display:none}
  .chbtn{margin-left:auto;font-size:13px}
  .cvwrap{border-radius:18px}
  .intro{display:none}
  .mtitle{display:block;font-size:20px;margin:6px 4px 0}.mbook{display:block;font-size:13px;color:var(--sub);margin:0 4px}
  .mtext{display:block;font-size:16px;line-height:1.7;margin:0 4px}
  .ctl,.tog{min-height:44px}.chips button,.btnrow .pill{min-height:44px;padding:10px 16px;font-size:14px}.btnrow .pill{width:100%}
  input[type=range]{height:36px}
  .mdark{display:inline-block;align-self:flex-start;font-size:13px;min-height:44px;min-width:64px}
  .panel{padding:12px 12px calc(84px + var(--safe))}
  .bbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 12px calc(10px + var(--safe));background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .bbar .pill{flex:1;min-height:44px;font-size:15px}
}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../" aria-label="返回格物实验室">‹<span>&nbsp;格物实验室</span></a>
  <h1 class="title">平面向量 · VecLab</h1>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <span class="count" id="count">01 / 09</span>
  <div class="tbtns">
    <button class="pill" id="prev">上一章</button>
    <button class="pill primary" id="next">下一章</button>
    <button class="pill" id="dark">深色</button>
    <button class="pill" id="fs">全屏</button>
  </div>
  <button class="pill chbtn" id="chbtn" aria-haspopup="dialog">章节 <span class="mono" id="chcount">&nbsp;01/09</span></button>
</header>
<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="toc" id="toc" aria-label="章节"><div class="sheethead"><i></i></div><ol id="toclist"></ol></nav>
  <main class="stage">
    <section class="card intro" id="intro">
      <div class="introhead"><h2 id="ctitle"></h2><button class="pill" id="fold" aria-expanded="true">收起</button></div>
      <p class="book" id="cbook"></p>
      <p class="text" id="ctext"></p>
    </section>
    <div class="card cvwrap" id="cvwrap">
      <canvas id="cv"></canvas>
      <div class="soon" id="soon" hidden><div class="card"><h3>即将上线</h3><p>本章交互实验正在制作中</p></div></div>
    </div>
  </main>
  <aside class="panel">
    <h2 class="mtitle" id="mtitle"></h2>
    <p class="mbook" id="mbook"></p>
    <p class="mtext" id="mtext"></p>
    <section class="card sec"><h3>控件</h3><div id="ctrl"></div></section>
    <section class="card sec"><h3>读数</h3><div id="read"></div></section>
    <section class="card sec"><h3>要点</h3><ul class="pts" id="pts"></ul></section>
    <section class="card sec gk"><h3>高考链接</h3><div id="gk"></div></section>
    <button class="pill mdark" id="mdark">深色</button>
  </aside>
</div>
<nav class="bbar"><button class="pill" id="bprev">上一章</button><button class="pill primary" id="bnext">下一章</button></nav>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const BK = "人教A版 必修第二册 · ";
const CH = [
  { n: "向量的概念与线性运算", book: BK + "6.1 平面向量的概念、6.2.1–6.2.2 向量的加法、减法运算", ready: true },
  { n: "数乘与共线", book: BK + "6.2.3 向量的数乘运算", ready: false },
  { n: "平面向量基本定理", book: BK + "6.3.1", ready: false },
  { n: "坐标运算", book: BK + "6.3.2–6.3.4", ready: false },
  { n: "数量积与投影", book: BK + "6.2.4、6.3.5", ready: false },
  { n: "极化恒等式", book: "高考拓展", ready: false },
  { n: "等和线", book: "高考拓展", ready: false },
  { n: "三角形四心", book: "高考拓展", ready: false },
  { n: "随堂检测", book: "第六章 平面向量及其应用", ready: false },
];
const MODS = [];

/* ---------- 第 1 章 向量的概念与线性运算 ---------- */
MODS[0] = (() => {
  const A = { x: 3, y: 1 }, B = { x: 1, y: 2 };
  const C = [{ x: -4, y: -2 }, { x: -1, y: -3 }, { x: 2, y: -1 }, { x: 3, y: 2 }, { x: 0, y: 4 }];
  /* b 平移到 a 终点后的终点：拖它即改 b */
  const Bt = {
    get x() { return A.x + B.x; }, set x(v) { B.x = v - A.x; },
    get y() { return A.y + B.y; }, set y(v) { B.y = v - A.y; },
  };
  let mode = "tri", snap = true, eq = false, both = false, anim = null, m = null, drag = null, rd = null, key = "";
  const ui = {};
  const clamp = (p) => {
    if (!m) return;
    const x = Math.max(Math.ceil(m.x0), Math.min(Math.floor(m.x1), p.x));
    const y = Math.max(Math.ceil(m.y0), Math.min(Math.floor(m.y1), p.y));
    p.x = x; p.y = y;
  };
  [A, B, Bt, ...C].forEach((p) => (p.onmove = clamp));
  const mkDrag = () => {
    const pts = mode === "multi" ? C : mode === "tri" ? [A, Bt] : [A, B];
    drag = dragPoints(pts, () => m, snap ? 1 : false);
  };
  const sync = () => {
    ui.anim.hidden = mode !== "tri";
    ui.both.hidden = mode !== "sub";
    ui.eq.hidden = mode === "multi";
  };

  /* 数值格式 */
  const len = (v) => Math.hypot(v.x, v.y);
  const f = (v) => String(+(+v).toFixed(2)).replace("-", "−");
  const vc = (v) => "(" + f(v.x) + ", " + f(v.y) + ")";
  const surd = (v) => {
    const s = v.x * v.x + v.y * v.y, r = Math.round(s), l = Math.sqrt(s);
    if (Math.abs(s - r) > 1e-6 || r === 0) return l.toFixed(2);
    const q = Math.round(Math.sqrt(r));
    if (q * q === r) return String(q);
    let k = 1;
    for (let i = 2; i * i <= r; i++) if (r % (i * i) === 0) k = i;
    return (k > 1 ? k : "") + "√" + r / (k * k) + "≈" + l.toFixed(2);
  };
  const sub2 = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });

  function rows(T) {
    if (mode === "multi") {
      const vs = [0, 1, 2, 3].map((i) => sub2(C[i + 1], C[i]));
      const s = sub2(C[4], C[0]), tot = vs.reduce((a, v) => a + len(v), 0);
      const r = vs.map((v, i) => ["abcd"[i], vc(v) + " · |" + "abcd"[i] + "|=" + surd(v), i ? null : T.blue]);
      r.push(["a+b+c+d", vc(s) + " · " + surd(s)]);
      r.push(["不等式", "|a+b+c+d| ≤ |a|+|b|+|c|+|d|"]);
      r.push(["数值", len(s).toFixed(2) + " ≤ " + tot.toFixed(2)]);
      const e = Math.abs(len(s) - tot) < 1e-6;
      r.push(["等号", e ? "成立 · 各向量共线同向" : "不成立", e ? T.blue : null]);
      return r;
    }
    const isSub = mode === "sub", op = isSub ? "−" : "+";
    const S = { x: A.x + B.x, y: A.y + B.y }, D = sub2(A, B), s = isSub ? D : S;
    const la = len(A), lb = len(B), L = Math.abs(la - lb), M = len(s), R = la + lb;
    const r = [
      ["a", vc(A) + " · |a|=" + surd(A), T.blue],
      ["b", vc(B) + " · |b|=" + surd(B)],
      ["a" + op + "b", vc(s) + " · |a" + op + "b|=" + surd(s)],
    ];
    if (isSub && both) r.push(["a+b", vc(S) + " · |a+b|=" + surd(S)]);
    r.push(["不等式", "||a|−|b|| ≤ |a" + op + "b| ≤ |a|+|b|"]);
    r.push(["数值", L.toFixed(2) + " ≤ " + M.toFixed(2) + " ≤ " + R.toFixed(2)]);
    const eL = Math.abs(L - M) < 1e-6, eR = Math.abs(M - R) < 1e-6;
    const txt = eL && eR ? "两边都取等 · 含零向量，a、b 共线" : eL ? "左边取等 · a、b 共线" : eR ? "右边取等 · a、b 共线" : "不成立 · a、b 不共线";
    r.push(["等号", txt, eL || eR ? T.blue : null]);
    return r;
  }

  return {
    text: "向量既有大小又有方向，可以自由平移——只要长度和方向不变，就是同一个向量。加法有两种画法：三角形法则「首尾相接，从第一个起点指向最后一个终点」；平行四边形法则「共起点，对角线就是和」。减法 a−b：共起点时，从 b 的终点指向 a 的终点。",
    points: [
      "向量 = 大小 + 方向",
      "零向量方向任意，与任意向量共线",
      "相等向量：模相等且方向相同",
      "加法交换律 a+b=b+a，结合律 (a+b)+c=a+(b+c)",
      "||a|−|b|| ≤ |a±b| ≤ |a|+|b|",
    ],
    gk: [
      "常与平面几何结合，用加减法把未知向量用已知向量表示，如 AD 是中线时 AD=(AB+AC)/2。",
      "易错：a−b 的方向是指向被减向量 a 的终点。",
      "易错：平行向量与共线向量是同一概念。",
    ],
    mount(ctrl, read) {
      ui.mode = chips(
        [{ v: "tri", l: "三角形法则" }, { v: "para", l: "平行四边形法则" }, { v: "sub", l: "减法" }, { v: "multi", l: "多个向量相加" }],
        mode, (v) => { mode = v; anim = null; mkDrag(); sync(); });
      ui.anim = button("平移动画", () => { anim = performance.now() / 1000; }, true);
      ui.both = toggle("也画 a+b", both, (v) => (both = v));
      ui.eq = toggle("显示相等向量", eq, (v) => (eq = v));
      ui.snap = toggle("整数吸附", snap, (v) => {
        snap = v;
        if (v) [A, B, ...C].forEach((p) => { p.x = Math.round(p.x); p.y = Math.round(p.y); });
        mkDrag();
      });
      rd = readout(); key = "";
      ctrl.append(ui.mode, ui.anim, ui.both, ui.eq, ui.snap);
      read.append(rd);
      mkDrag(); sync();
    },
    unmount() { anim = null; rd = null; },
    pointer(e, type, x, y) { return drag && drag(e, type, x, y); },
    draw(c, w, h, t) {
      const T = theme();
      m = drawAxes(c, { x: 0, y: 0, w, h }, [-6, 6], [-4.5, 4.5], { equal: true });
      const { X, Y } = m, O = { x: 0, y: 0 };
      const ar = (p, q, col, lab, wd) => arrow(c, X(p.x), Y(p.y), X(q.x), Y(q.y), col, lab, wd);
      const dash = (p, q, col) => {
        c.save(); c.setLineDash([5, 5]); c.strokeStyle = col; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(X(p.x), Y(p.y)); c.lineTo(X(q.x), Y(q.y)); c.stroke(); c.restore();
      };
      const dot = (p, col) => {
        c.beginPath(); c.arc(X(p.x), Y(p.y), 6, 0, 7); c.fillStyle = col; c.fill();
        c.lineWidth = 2; c.strokeStyle = T.bg; c.stroke();
      };
      const fade = (a, fn) => { c.save(); c.globalAlpha = a; fn(); c.restore(); };
      const S = { x: A.x + B.x, y: A.y + B.y };

      if (mode === "multi") {
        const cols = [T.blue, T.red, T.gold, T.purple];
        ar(C[0], C[4], T.teal, "a+b+c+d", 4);
        for (let i = 0; i < 4; i++) ar(C[i], C[i + 1], cols[i], "abcd"[i]);
        C.forEach((p, i) => dot(p, i ? cols[i - 1] : T.fg));
      } else {
        if (eq) {
          const cand = [[-5, -4], [2, -4], [-5, 2], [-3, -4], [4, -3], [-5, 0], [1, 3], [-2, 2], [3, -1]];
          const inV = (x, y) => x >= m.x0 + .3 && x <= m.x1 - .3 && y >= m.y0 + .3 && y <= m.y1 - .3;
          let n = 0;
          for (const [sx, sy] of cand) {
            if (n > 1) break;
            if (!inV(sx, sy) || !inV(sx + A.x, sy + A.y)) continue;

/* ---------- 第 3 章 平面向量基本定理 ---------- */
MODS[2] = (() => {
  const e1 = { x: 2, y: 0 }, e2 = { x: 1, y: 1.5 }, a = { x: 4, y: 3 }, O = { x: 0, y: 0 };
  const PRE = { orth: [[2, 0], [0, 2], [3, 2]], skew: [[2, 0], [1, 1.5], [4, 3]], tri: [[4, -1], [1, 3], [4, 3]] };
  /* 三角形中各目标向量的起点、终点（以 AB、AC 为基底的系数） */
  const TG = { AD: [[0, 0], [1 / 2, 1 / 2]], BE: [[1, 0], [0, 1 / 3]], AG: [[0, 0], [1 / 3, 1 / 3]] };
  let pre = "skew", tgt = "AD", snap = true, cx = 1, cy = 2, m = null, drag = null, rd = null, key = "";
  const ui = {};
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const f = (v) => String(+(+v).toFixed(2)).replace("-", "−");
  const vc = (v) => "(" + f(v.x) + ", " + f(v.y) + ")";
  const det = () => e1.x * e2.y - e1.y * e2.x;
  const ang = () => {
    const l = Math.hypot(e1.x, e1.y) * Math.hypot(e2.x, e2.y);
    return l ? (Math.acos(cl((e1.x * e2.x + e1.y * e2.y) / l, -1, 1)) * 180) / Math.PI : 0;
  };
  const ok = () => { const t = ang(); return t >= 3 && t <= 177; };
  const solve = (v) => { const d = det(); return { x: (v.x * e2.y - v.y * e2.x) / d, y: (e1.x * v.y - e1.y * v.x) / d }; };
  const comb = (x, y) => ({ x: x * e1.x + y * e2.x, y: x * e1.y + y * e2.y });
  const vec = () => {
    if (pre !== "tri") return { S: O, E: a, v: a };
    const [s, e] = TG[tgt], S = comb(s[0], s[1]), E = comb(e[0], e[1]);
    return { S, E, v: { x: E.x - S.x, y: E.y - S.y } };
  };
  /* 简单分数：分母不超过 12 */
  const GL = { "1/2": "½", "1/3": "⅓", "2/3": "⅔", "1/4": "¼", "3/4": "¾", "1/6": "⅙", "5/6": "⅚" };
  const fr = (v) => {
    const s = v < 0 ? "−" : "", u = Math.abs(v);
    for (let q = 1; q <= 12; q++) {
      const p = Math.round(u * q);
      if (Math.abs(u - p / q) < 0.004) return p === 0 ? "0" : s + (q === 1 ? p : GL[p + "/" + q] || p + "/" + q);
    }
    return null;
  };
  const fx = (v) => { const r = fr(v); return r === null ? f(v) : /^−?\d+$/.test(r) ? r : r + " ≈ " + f(v); };
  const coef = (v) => fr(v) ?? f(v);
  const formula = (x, y, n1, n2) => {
    const t = [[x, n1], [y, n2]].map(([v, n]) => { const s = coef(v); return s === "0" ? "" : s === "1" ? n : s === "−1" ? "−" + n : s + " " + n; }).filter(Boolean);
    return t.length ? t.join(" + ").replace("+ −", "− ") : "0";
  };
  const store = () => { if (ok()) { const s = solve(a); cx = s.x; cy = s.y; } };
  const fit = (p) => { if (m) { p.x = cl(p.x, m.x0 + .2, m.x1 - .2); p.y = cl(p.y, m.y0 + .2, m.y1 - .2); } };
  e1.onmove = e2.onmove = (p) => {
    fit(p); p.x = Math.round(p.x * 2) / 2; p.y = Math.round(p.y * 2) / 2;
    if (snap && pre !== "tri" && ok()) Object.assign(a, comb(cx, cy)); else store();
  };
  a.onmove = (p) => {
    fit(p);
    if (snap && ok()) { const s = solve(p); cx = Math.round(s.x); cy = Math.round(s.y); Object.assign(p, comb(cx, cy)); }
    else { p.x = Math.round(p.x * 100) / 100; p.y = Math.round(p.y * 100) / 100; store(); }
  };
  const sync = () => {
    ui.tg.hidden = pre !== "tri"; ui.snap.hidden = pre === "tri";
    drag = dragPoints(pre === "tri" ? [e1, e2] : [a, e1, e2], () => m, false);
  };
  const apply = (k) => {

    Object.assign(e1, { x: p[0], y: p[1] }); Object.assign(e2, { x: q[0], y: q[1] }); Object.assign(a, { x: r[0], y: r[1] });

  };

  function rows(T) {
    const tri = pre === "tri", n1 = tri ? "AB" : "e₁", n2 = tri ? "AC" : "e₂", t = ang();
    const r = [[n1, vc(e1)], [n2, vc(e2)], ["夹角", t.toFixed(1) + "°" + (Math.abs(t - 90) < .05 ? " · 垂直" : "")]];
    if (!ok()) { r.push(["状态", "共线 · 不能作为基底", T.blue]); return r; }
    const { v } = vec(), s = solve(v);

    r.push(["x", fx(s.x)], ["y", fx(s.y)], ["式子", (tri ? tgt : "a") + " = " + formula(s.x, s.y, n1, n2), T.blue]);

  }

  return {
    text: "任选两个不共线的向量 e₁、e₂ 作基底，平面内任何向量 a 都能唯一地写成 a = x e₁ + y e₂。几何上就是沿 e₁、e₂ 的方向画一张斜网格，a 的终点落在哪个格点，(x, y) 就是多少。基底一旦共线，网格塌成一条线，就无法表示整个平面。",
    points: [
      "基底必须不共线",
      "分解唯一：a = x e₁ + y e₂ 中的 x、y 只有一组",
      "同一向量在不同基底下系数不同",
      "正交分解是特例：单位正交基底下的系数就是坐标",
    ],
    gk: [
      "常在三角形、平行四边形中选两条边为基底表示其他向量，再用「系数唯一」列方程求参数。",
      "易错：零向量不能作基底。",
      "易错：基底不一定垂直。",
    ],
    mount(ctrl, read) {
      ui.pre = chips([{ v: "orth", l: "正交基底" }, { v: "skew", l: "斜基底" }, { v: "tri", l: "三角形中线" }], pre, (v) => { pre = v; apply(v); sync(); });
      ui.tg = chips(["AD", "BE", "AG"], tgt, (v) => (tgt = v));
      ui.snap = toggle("吸附整数系数", snap, (v) => {
        snap = v;
        if (v && ok()) { cx = Math.round(cx); cy = Math.round(cy); Object.assign(a, comb(cx, cy)); }
      });
      rd = readout(); key = "";
      ctrl.append(ui.pre, ui.tg, ui.snap);
      read.append(rd);
      store(); sync();
    },
    unmount() { rd = null; },
    pointer(e, type, x, y) { return drag && drag(e, type, x, y); },
    draw(c, w, h) {
      const T = theme(), font = getComputedStyle(document.body).fontFamily, tri = pre === "tri", good = ok();
      m = drawAxes(c, { x: 0, y: 0, w, h }, tri ? [-2, 6] : [-6, 6], tri ? [-2.5, 4] : [-4.5, 4.5], { equal: true, grid: !good });
      const { X, Y } = m;
      const ar = (p, q, col, lab, wd, dash) => {
        c.save(); if (dash) c.setLineDash([6, 5]);
        arrow(c, X(p.x), Y(p.y), X(q.x), Y(q.y), col, lab, wd); c.restore();
      };
      const txt = (s, x, y, col, align, size) => {
        c.save(); c.font = "600 " + (size || 14) + "px " + font; c.textAlign = align || "left"; c.textBaseline = "middle";
        c.lineWidth = 4; c.strokeStyle = T.bg; c.strokeText(s, x, y); c.fillStyle = col; c.fillText(s, x, y); c.restore();
      };
      const dot = (p, col, lab, r) => {
        c.beginPath(); c.arc(X(p.x), Y(p.y), r || 6, 0, 7); c.fillStyle = col; c.fill();
        c.lineWidth = 2; c.strokeStyle = T.bg; c.stroke();
        if (lab) txt(lab, X(p.x) + 9, Y(p.y) - 12, col);
      };
      const poly = (ps, close) => { c.beginPath(); ps.forEach((p, i) => (i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y)))); if (close) c.closePath(); };

      if (good) {
        /* 斜网格：覆盖可视区的两族平行线 */
        const cs = [[m.x0, m.y0], [m.x1, m.y0], [m.x0, m.y1], [m.x1, m.y1]].map(([x, y]) => solve({ x, y }));
        const xa = Math.min(...cs.map((p) => p.x)), xb = Math.max(...cs.map((p) => p.x));
        const ya = Math.min(...cs.map((p) => p.y)), yb = Math.max(...cs.map((p) => p.y));
        let st = 0.5;
        while ((xb - xa + yb - ya) / st > 240) st *= 2;
        c.save(); c.strokeStyle = T.fg; c.lineWidth = 1;
        [false, true].forEach((int) => {
          c.globalAlpha = int ? .16 : .06; c.beginPath();

            const p = comb(k, ya), q = comb(k, yb); c.moveTo(X(p.x), Y(p.y)); c.lineTo(X(q.x), Y(q.y));
          }
          for (let k = Math.ceil(ya / st) * st; k <= yb; k += st) if ((Math.abs(k - Math.round(k)) < 1e-9) === int) {
            const p = comb(xa, k), q = comb(xb, k); c.moveTo(X(p.x), Y(p.y)); c.lineTo(X(q.x), Y(q.y));
          }
          c.stroke();
        });
        c.restore();
      }
      if (tri) {
        const A = O, D = comb(1 / 2, 1 / 2), E = comb(0, 1 / 3), G = comb(1 / 3, 1 / 3);
        c.save(); c.strokeStyle = T.fg; c.lineWidth = 1.5; c.globalAlpha = .55; poly([A, e1, e2], true); c.stroke(); c.restore();
        dot(A, T.fg, "A"); dot(D, T.sub, "D", 4); dot(E, T.sub, "E", 4); dot(G, T.sub, "G", 4);
      }
      const n1 = tri ? "AB" : "e₁", n2 = tri ? "AC" : "e₂";
      if (good) {
        const { S, E, v } = vec(), s = solve(v);
        const P1 = { x: S.x + s.x * e1.x, y: S.y + s.x * e1.y }, P2 = { x: S.x + s.y * e2.x, y: S.y + s.y * e2.y };
        c.save(); c.fillStyle = T.teal; c.globalAlpha = .08; poly([S, P1, E, P2], true); c.fill();
        c.globalAlpha = .35; c.setLineDash([3, 4]); c.strokeStyle = T.sub; c.lineWidth = 1; poly([S, P2, E]); c.stroke(); c.restore();

/* ---------- 第 4 章 坐标运算 ---------- */
MODS[3] = (() => {
  const A = { x: -2, y: -1 }, B = { x: 3, y: 2 }, a = { x: 2, y: 1 }, b = { x: -1, y: 2 }, O = { x: 0, y: 0 };
  const pa = { x: 3, y: 1 }, pb = { x: 1, y: 3 }, dA = { x: -3, y: -1 }, dB = { x: 3, y: 2 }, dC = { x: 0, y: 3 };
  const ALL = [A, B, a, b, pa, pb, dA, dB, dC];
  let mode = "coord", snap = true, lam = 2, mu = 1, ld = 1, cen = false, m = null, drag = null, rd = null, key = "";
  const ui = {};
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const f = (v) => String(+(+v).toFixed(2)).replace("-", "−");
  const vc = (x, y) => "(" + x + ", " + y + ")";
  const pv = (p) => vc(f(p.x), f(p.y));
  const pr = (v) => (v < 0 ? "(" + f(v) + ")" : f(v));
  /* 分数：分母不超过 12，否则小数 */
  const fr = (v) => {
    const s = v < 0 ? "−" : "", u = Math.abs(v);
    for (let q = 1; q <= 12; q++) {
      const p = Math.round(u * q);
      if (Math.abs(u - p / q) < 1e-6) return p ? s + p + (q > 1 ? "/" + q : "") : "0";
    }
    return f(v);
  };
  const det = () => pa.x * pb.y - pb.x * pa.y;
  const par = () => Math.abs(det()) < 1e-6;
  const green = () => (document.documentElement.classList.contains("dark") ? "#30d158" : "#17834a");
  const divP = () => ({ x: (dA.x + ld * dB.x) / (1 + ld), y: (dA.y + ld * dB.y) / (1 + ld) });
  const fit = (p) => {
    if (m) {
      const lo = (v) => (snap ? Math.ceil(v) : v), hi = (v) => (snap ? Math.floor(v) : v);
      p.x = cl(p.x, lo(m.x0 + .3), hi(m.x1 - .3)); p.y = cl(p.y, lo(m.y0 + .3), hi(m.y1 - .3));

    if (!snap) { p.x = Math.round(p.x * 100) / 100; p.y = Math.round(p.y * 100) / 100; }
  };
  /* 关掉吸附时，b 靠近 a 所在直线就吸上去 */
  const magnet = () => {
    const l2 = pa.x * pa.x + pa.y * pa.y;
    if (snap || Math.abs(det()) / Math.sqrt(l2) > .15) return;
    const k = (pb.x * pa.x + pb.y * pa.y) / l2; pb.x = k * pa.x; pb.y = k * pa.y;
  };
  ALL.forEach((p) => {
    p.px = p.x; p.py = p.y;
    p.onmove = (q) => {
      fit(q);
      if ((q === a || q === pa) && !q.x && !q.y) { q.x = q.px; q.y = q.py; }
      if (q === pb) magnet();
      q.px = q.x; q.py = q.y;
    };
  });
  const sync = () => {
    ui.lam.hidden = ui.mu.hidden = mode !== "op";
    ui.ld.hidden = ui.mid.hidden = ui.cen.hidden = mode !== "div";
    const P = { coord: [A, B], op: [a, b], par: [pa, pb], div: cen ? [dA, dB, dC] : [dA, dB] }[mode];
    drag = dragPoints(P, () => m, snap ? 1 : false);
  };

  function rows(T) {
    if (mode === "coord") {
      const dx = B.x - A.x, dy = B.y - A.y;
      return [
        ["A", pv(A)], ["B", pv(B)],
        ["x_B−x_A", f(B.x) + " − " + pr(A.x) + " = " + f(dx)],
        ["y_B−y_A", f(B.y) + " − " + pr(A.y) + " = " + f(dy)],
        ["AB", "(x_B−x_A, y_B−y_A) = " + vc(f(dx), f(dy)), T.blue],
      ];

      return [

        ["μb", f(mu) + "·" + pv(b) + " = " + pv(mb)],
        ["和 λa+μb", vc(f(la.x) + " + " + pr(mb.x), f(la.y) + " + " + pr(mb.y)) + " = " + pv(s), T.blue],
      ];
    }
    if (mode === "par") {
      const ok = par(), d = ok ? 0 : det();
      const r = [
        ["a", vc(fr(pa.x), fr(pa.y))], ["b", vc(fr(pb.x), fr(pb.y))],
        ["x₁y₂−x₂y₁", f(pa.x) + "×" + pr(pb.y) + " − " + pr(pb.x) + "×" + pr(pa.y) + " = " + f(d)],
        ["结论", ok ? "= 0 · a ∥ b" : (d > 0 ? "> 0" : "< 0") + " · a 与 b 不平行", ok ? T.blue : null],
      ];
      if (ok) r.push(["b = ka", "k = " + fr((pb.x * pa.x + pb.y * pa.y) / (pa.x * pa.x + pa.y * pa.y))]);
      return r;
    }
    const P = divP(), s = 1 + ld;
    const sub = (k) => "(" + f(dA[k]) + " + " + pr(ld) + "×" + pr(dB[k]) + ") / " + pr(s) + " = " + fr(P[k]);
    const r = [
      ["A", pv(dA)], ["B", pv(dB)],
      ["λ", f(ld) + (ld === 1 ? " · 中点" : ld === 0 ? " · P 与 A 重合" : ld > 0 ? " · 内分" : " · 外分")],
      ["x_P", sub("x")], ["y_P", sub("y")],
      ["P", vc(fr(P.x), fr(P.y)), T.blue],
    ];
    if (cen) {
      const g = (k) => "(" + f(dA[k]) + " + " + pr(dB[k]) + " + " + pr(dC[k]) + ") / 3 = " + fr((dA[k] + dB[k] + dC[k]) / 3);
      r.push(["C", pv(dC)], ["x_G", g("x")], ["y_G", g("y")],
        ["G", vc(fr((dA.x + dB.x + dC.x) / 3), fr((dA.y + dB.y + dC.y) / 3)), T.blue]);
    }
    return r;
  }

  return {
    text: "取 x 轴、y 轴上的单位向量 i、j 作基底，a = x i + y j，就记作 a=(x, y)。从此向量运算变成数的运算：加减对应坐标相加减，数乘对应坐标都乘 λ；AB 的坐标是「终点减起点」。两个向量平行，当且仅当 x₁y₂ − x₂y₁ = 0。",
    points: [
      "AB = (x₂−x₁, y₂−y₁)",
      "a±b = (x₁±x₂, y₁±y₂)，λa = (λx₁, λy₁)",
      "a∥b ⇔ x₁y₂−x₂y₁ = 0",
      "中点 ((x₁+x₂)/2, (y₁+y₂)/2)",
      "重心 ((x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3)",
    ],
    gk: [
      "坐标法是向量题的「万能钥匙」，选填常用建系把几何问题化为计算。",
      "易错：平行条件是交叉相乘相减，不要写成 x₁x₂−y₁y₂（那是另一回事）。",
      "易错：AB 是终点减起点。",
    ],
    mount(ctrl, read) {
      ui.mode = chips([{ v: "coord", l: "坐标表示" }, { v: "op", l: "运算" }, { v: "par", l: "平行判定" }, { v: "div", l: "定比分点" }],

      const b = el("button", null, String(i + 1));
      if (i === qi) b.classList.add("on");

    });
    box.textContent = "";
    const q = Q[qi];
    const h = el("p", null, "第 " + (qi + 1) + " 题 · " + q.t + " · " + q.p + " 分" + (q.multi ? "（部分选对得 2 分，错选 0 分）" : ""));
    h.style.cssText = "margin:0 0 6px;font-size:13px;color:var(--sub)";

    if (q.opts) q.opts.forEach((o, k) => {
      const L = "ABCD"[k], b = el("button", "pill", o);
      b.style.cssText = "display:block;width:100%;text-align:left;margin:6px 0;min-height:44px;padding:10px 14px;line-height:1.5";
      const sel = q.multi ? pick[qi].includes(L) : pick[qi] === L;
      if (sel) b.classList.add("primary");
      if (done[qi]) {
        b.disabled = true;
        if (q.ans.includes(L)) { b.classList.remove("primary"); b.style.background = "var(--sel)"; b.style.color = "var(--blue)"; }
        else if (sel) { b.classList.remove("primary"); b.style.background = "var(--soft)"; b.style.color = DR(); }
      }
      b.onclick = () => {
        if (done[qi]) return;
        if (q.multi) { const a = pick[qi], j = a.indexOf(L); j < 0 ? a.push(L) : a.splice(j, 1); } else pick[qi] = L;
        foc = L; paint();

    });
    if (q.fill) {
      const i2 = el("input"); i2.type = "text"; i2.value = pick[qi]; i2.placeholder = "输入答案，如 −1";
      i2.setAttribute("aria-label", "第 6 题答案");
      i2.style.cssText = "width:100%;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);font:15px var(--mono)";
      i2.disabled = done[qi];
      if (done[qi]) i2.style.color = got[qi] ? "var(--blue)" : DR();

    }

    act.onclick = () => {
      if (!done[qi]) {

      } else if (!allDone()) { qi = done.findIndex((d, i) => !d && i > qi); if (qi < 0) qi = done.findIndex((d) => !d); }

    box.append(act);
    if (done[qi]) {

      const r = el("p", null, (ok ? "答对 · 得 " + q.p + " 分" : got[qi] > 0 ? "部分正确 · 得 " + got[qi] + " 分" : "答错 · 得 0 分") + "　你的答案 " + (mine || "—") + "　正确答案 " + q.ans);
      r.style.cssText = "margin:12px 0 4px;font-size:14px;font-weight:600;color:" + (got[qi] > 0 ? "var(--blue)" : DR());
      const sol = el("p", null, q.sol); sol.style.cssText = "margin:0;font-size:14px;line-height:1.7;color:var(--fg)"; box.append(r, sol);
    }
    key = "";
  }

  function rows(T) {
    const n = done.filter(Boolean).length;
    const r = [["进度", n + " / 6 题", T.fg], ["本题", "第 " + (qi + 1) + " 题 · " + Q[qi].t + " · " + Q[qi].p + " 分", T.fg],
      ["当前得分", total() + " / " + TOT, T.blue]];
    if (done[qi]) r.push(["本题得分", got[qi] + " / " + Q[qi].p, got[qi] > 0 ? T.blue : DR()]);
    if (allDone()) r.push(["结果", "全部完成 · 得分率 " + Math.round((total() / TOT) * 100) + "%", T.blue]);
    return r;
  }

  return {
    text: "六道题，共 31 分，覆盖本章的坐标运算、线性分解、数量积求模、投影向量、三角形四心与极化恒等式。右侧选好答案后点「提交」，画布会同步演示答案的几何图形，解析指出所用方法与对应章节。全部完成后画布中央给出成绩环。",
    points: ["垂直看数量积为 0，共线看交叉相乘为 0", "线性分解先统一起点，再换成基底", "求模先平方：|a−2b|²=|a|²−4a·b+4|b|²",
      "投影向量 = (a·b/|b|²)b，是向量不是数", "四心：等距为外心，向量和为零为重心", "极化恒等式 PA·PC = PO² − |AC|²/4"],
    gk: ["新高考 I 卷平面向量常考 1 单选 + 1 多选或填空，分值 10 分左右，侧重数量积与几何意义。",
      "多选题错选 0 分，宁可少选：把握不准的选项先放下。",
      "填空题的最值问题优先考虑极化恒等式或建系坐标化。"],
    mount(ctrl, read) {
      nav = el("div", "chips"); box = el("div");
      ctrl.append(nav, box);
      rd = readout(); read.append(rd);
      paint();
    },
    unmount() { rd = null; box = null; nav = null; anim = null; ring = null; holdP = false; },
    pointer(e, type, x, y) {
      if (ring && type === "down" && x >= ring.x && x <= ring.x + ring.w && y >= ring.y && y <= ring.y + ring.h) {
        pick = blank(); done = Q.map(() => false); got = Q.map(() => 0); qi = 0; Ps.t = 0.72; anim = null; ring = null; paint(); return true;
      }
      if (qi !== 5 || done[5] || !m) return false;
      if (type === "down") holdP = true;
      if (!holdP) return false;
      if (type === "up") { holdP = false; return true; }
      const p = { x: m.invX(x), y: m.invY(y) };
      let best = 1e9, bt = Ps.t;
      for (let t = 0; t < 4; t += 0.01) { const q = Pat(t), d = Math.hypot(q.x - p.x, q.y - p.y); if (d < best) { best = d; bt = t; } }
      Ps.t = bt; return true;
    },
    draw(c, w, h) {
      const T = theme(), font = getComputedStyle(document.body).fontFamily;
      const R = [[[-3, 3], [-2.5, 2.5]], [[-4, 4], [-3, 3]], [[-1, 3], [-1.5, 2.5]], [[-1, 5], [-1, 5]], [[-5, 5], [-3.5, 3.5]], [[-2.2, 2.2], [-2, 2]]];
      const grid = qi === 0 || qi === 3;
      m = drawAxes(c, { x: 0, y: 0, w, h }, R[qi][0], R[qi][1], { equal: true, grid, axes: grid });
      const X = m.X, Y = m.Y;
      const txt = (s, x, y, col, align, size) => { c.save(); c.font = "600 " + (size || 13) + "px " + font; c.textAlign = align || "left"; c.textBaseline = "middle";
        c.lineWidth = 4; c.strokeStyle = T.bg; c.strokeText(s, x, y); c.fillStyle = col; c.fillText(s, x, y); c.restore(); };
      const seg = (u, v, col, wd, dash, al) => { c.save(); c.globalAlpha = al || 1; if (dash) c.setLineDash([6, 5]); c.strokeStyle = col; c.lineWidth = wd || 1.6; c.lineCap = "round";
        c.beginPath(); c.moveTo(X(u.x), Y(u.y)); c.lineTo(X(v.x), Y(v.y)); c.stroke(); c.restore(); };
      const dot = (q, col, lab, r) => { c.beginPath(); c.arc(X(q.x), Y(q.y), r || 6, 0, 7); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = T.bg; c.stroke();
        if (lab) txt(lab, X(q.x) + 10, Y(q.y) - 14, col, "left", 15); };
      const ar = (u, v, col, lab, wd) => arrow(c, X(u.x), Y(u.y), X(v.x), Y(v.y), col, lab, wd);
      const fill3 = (pts, col) => { c.save(); c.globalAlpha = .18; c.fillStyle = col; c.beginPath(); pts.forEach((q, j) => c[j ? "lineTo" : "moveTo"](X(q.x), Y(q.y))); c.closePath(); c.fill(); c.restore(); };
      const O = { x: 0, y: 0 }, d6 = done[qi];
      if (qi === 0) {
        const a = { x: 1, y: 2 }, mv = d6 ? 2 : { A: -2, B: 2, C: .5, D: -.5 }[pick[0]] != null ? { A: -2, B: 2, C: .5, D: -.5 }[pick[0]] : 1;
        const b = { x: mv, y: -1 };
        ar(O, a, T.blue, "a"); ar(O, b, T.red, "b");
        if (d6) { const ua = { x: a.x / Math.hypot(a.x, a.y), y: a.y / Math.hypot(a.x, a.y) }, ub = { x: b.x / Math.hypot(b.x, b.y), y: b.y / Math.hypot(b.x, b.y) };
          const s = .45, p1 = sc(ua, s), p2 = sc(ub, s), p3 = add(p1, p2);
          seg(p1, p3, T.blue, 1.6); seg(p2, p3, T.blue, 1.6);
          txt("a·b = 1·2 + 2·(−1) = 0 ⇒ m = 2", 12, 22, T.blue, "left", 14); }

        const A = { x: -3, y: -1.6 }, B = { x: 3, y: -1.6 }, C = { x: .6, y: 2.6 };

        seg(A, B, T.fg, 2); seg(B, C, T.fg, 2); seg(C, A, T.fg, 2); seg(A, D, T.fg, 1.4, true, .7);
        dot(A, T.fg, "A"); dot(B, T.fg, "B"); dot(C, T.fg, "C"); dot(D, T.fg, "D", 5); dot(E, T.blue, "E", 6);
        ar(B, E, T.blue, "BE", 3);

          txt("BE = AE − AB = ¼(AB+AC) − AB = −¾AB + ¼AC", 12, 22, T.blue, "left", 14); }

      } else if (qi === 2) {
        const a = { x: 2, y: 0 }, b = { x: .5, y: Math.sqrt(3) / 2 }, b2 = sc(b, 2), r = sub(a, b2);
        ar(O, a, T.blue, "a"); ar(O, b, T.red, "b"); ar(O, b2, T.red, "2b", 2);
        ar(b2, a, T.gold, "a−2b", 3); seg(O, a, T.sub, 1, true, .5);
        txt("60°", X(.42), Y(.16), T.fg, "left", 13);
        if (d6) txt("|a−2b|² = 4 − 4a·b + 4 = 4 − 4 + 4 = 4 ⇒ |a−2b| = 2", 12, 22, T.blue, "left", 14);
        else txt("|a|=2，|b|=1，夹角 60°", 12, 22, T.fg, "left", 13);
      } else if (qi === 3) {
        const a = { x: 3, y: 4 }, b = { x: 1, y: 0 }, pr = { x: 3, y: 0 };
        seg(O, { x: 4.6, y: 0 }, T.sub, 1.2, true, .6);
        ar(O, a, T.blue, "a"); ar(O, b, T.red, "b");
        if (d6) { ar(O, pr, T.gold, "(3,0)", 3); seg(a, pr, T.sub, 1.4, true, .8); dot(pr, T.gold, null, 5);
          const s = .3; seg({ x: 3 - s, y: 0 }, { x: 3 - s, y: s }, T.gold, 1.4); seg({ x: 3 - s, y: s }, { x: 3, y: s }, T.gold, 1.4);
          txt("(a·b/|b|²)b = 3b = (3,0)", 12, 22, T.blue, "left", 14); }
        else txt("把 a 垂直投到 b 所在直线上", 12, 22, T.fg, "left", 13);
      } else if (qi === 4) {
        const A = { x: -3.2, y: -2 }, B = { x: 3.2, y: -2 }, C = { x: .4, y: 2.6 };
        seg(A, B, T.fg, 2); seg(B, C, T.fg, 2); seg(C, A, T.fg, 2);
        const G = sc(add(add(A, B), C), 1 / 3), sqn = (p) => p.x * p.x + p.y * p.y;
        const dd = 2 * ((B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x));
        const Oc = { x: (sqn(A) * (B.y - C.y) + sqn(B) * (C.y - A.y) + sqn(C) * (A.y - B.y)) / dd,
          y: (sqn(A) * (C.x - B.x) + sqn(B) * (A.x - C.x) + sqn(C) * (B.x - A.x)) / dd };
        const H = sub(add(add(A, B), C), sc(Oc, 2)), P = sc(add(add(A, sc(B, 2)), sc(C, 3)), 1 / 6);
        const f4 = d6 ? foc : foc, show = pick[4].length ? (pick[4].includes(f4) ? f4 : pick[4][pick[4].length - 1]) : f4;
        if (show === "A") { [A, B, C].forEach((Pt, i) => seg(Pt, sc(add([B, C, A][i], [C, A, B][i]), .5), T.sub, 1.4, true, .7)); dot(G, T.blue, "G 重心", 7);
          txt("OA+OB+OC=0 ⇔ O 为重心 ✓", 12, 22, T.blue, "left", 14); }
        else if (show === "B") { c.save(); c.globalAlpha = .3; c.strokeStyle = T.blue; c.lineWidth = 2; c.beginPath();
          c.arc(X(Oc.x), Y(Oc.y), Math.hypot(A.x - Oc.x, A.y - Oc.y) * m.sx, 0, 7); c.stroke(); c.restore();
          [A, B, C].forEach((Pt) => seg(Oc, Pt, T.blue, 1.4, true, .8)); dot(Oc, T.red, "O 外心", 7);
          txt("到三顶点等距的是外心，不是内心 ✗", 12, 22, DR(), "left", 14); }
        else if (show === "C") { dot(H, T.blue, "H 垂心", 7); [A, B, C].forEach((Pt) => seg(H, Pt, T.blue, 1.4, true, .8));
          txt("OB·(OA−OC)=OB·CA=0 ⇒ OB⊥CA，故为垂心 ✓", 12, 22, T.blue, "left", 14); }
        else { fill3([P, B, C], T.blue); [A, B, C].forEach((Pt) => seg(P, Pt, T.blue, 1.5, false, .9)); dot(P, T.blue, "O", 7);
          txt("S_A : S_B : S_C = 1 : 2 : 3 ⇒ S△OBC : S△ABC = 1 : 6 ✓", 12, 22, T.blue, "left", 14); }
        dot(A, T.fg, "A", 5); dot(B, T.fg, "B", 5); dot(C, T.fg, "C", 5);
        if (!d6) txt("点选选项，图形随之切换", 12, 42, T.fg, "left", 13);
      } else {
        if (anim) { const k = Math.min(1, (performance.now() - anim.t0) / 800), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          Ps.t = anim.from + (anim.to - anim.from) * e; if (k >= 1) anim = null; }
        const A = sq[0], B = sq[1], C2 = sq[2], D = sq[3], P = Pat(Ps.t);
        seg(A, B, T.fg, 2); seg(B, C2, T.fg, 2); seg(C2, D, T.fg, 2); seg(D, A, T.fg, 2);
        seg(A, C2, T.sub, 1.2, true, .7); seg(B, D, T.sub, 1.2, true, .4);
        dot(A, T.fg, "A", 5); dot(B, T.fg, "B", 5); dot(C2, T.fg, "C", 5); dot(D, T.fg, "D", 5); dot(O, T.fg, "O", 5);
        ar(P, A, T.blue, "PA", 2.4); ar(P, C2, T.blue, "PC", 2.4); seg(P, O, T.red, 1.6, true);
        dot(P, T.red, "P", 6);
        const v = dt(sub(A, P), sub(C2, P)), po = Math.hypot(P.x, P.y);
        txt("PO = " + po.toFixed(2) + "　PA·PC = PO² − 2 = " + v.toFixed(2), 12, 22, d6 ? T.blue : T.fg, "left", 14);
        if (d6) txt("PO 最小为 1（P 在边中点），最小值 −1", 12, 44, T.blue, "left", 14);
        else txt("拖动 P 沿正方形边移动", 12, 44, T.fg, "left", 13);
      }
      ring = null;
      if (allDone()) {
        c.save(); c.globalAlpha = .93; c.fillStyle = T.bg; c.fillRect(0, 0, w, h); c.restore();
        const cx = w / 2, cy = h / 2 - 18, rr = Math.min(76, h / 5);
        c.save(); c.lineWidth = 12; c.lineCap = "round";
        c.strokeStyle = T.grid; c.beginPath(); c.arc(cx, cy, rr, 0, 7); c.stroke();
        c.strokeStyle = T.blue; c.beginPath(); c.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + (total() / TOT) * 2 * Math.PI); c.stroke(); c.restore();
        c.save(); c.textAlign = "center"; c.textBaseline = "middle";
        c.fillStyle = T.fg; c.font = "600 " + Math.round(rr * .55) + "px ui-monospace,Menlo,monospace";
        c.fillText(total() + " / " + TOT, cx, cy - 4);
        c.fillStyle = T.sub; c.font = "13px " + font; c.fillText("总分 " + TOT + " 分", cx, cy + rr * .42); c.restore();
        ring = { x: cx - 70, y: cy + rr + 26, w: 140, h: 44 };
        c.save(); c.fillStyle = T.blue; c.beginPath();
        if (c.roundRect) c.roundRect(ring.x, ring.y, ring.w, ring.h, 22); else c.rect(ring.x, ring.y, ring.w, ring.h);
        c.fill(); c.fillStyle = "#fff"; c.font = "600 15px " + font; c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("再做一遍", cx, ring.y + 22); c.restore();
      }
      if (rd) { const r = rows(T), k2 = JSON.stringify(r); if (k2 !== key) { key = k2; rd.update(r); } }
    },
  };
})();
