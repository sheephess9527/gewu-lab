<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>格物实验室 导数</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--blue-fill:#0071e3;--blue-soft:#e6f0fc;--blue-text:#0058b0;--sec:#f5f5f7;--red:#e5484d;--gold:#c98a12;--gold-text:#9a6a00;--red-text:#c4262c;--teal:#0a9396;--purple:#8e6bd8;--grid:rgba(0,0,0,.05);--axis:rgba(0,0,0,.45);--bar:rgba(251,251,253,.72);--shadow:0 2px 12px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace;--sb:env(safe-area-inset-bottom,0px)}
html[data-theme=dark]{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--blue:#2997ff;--blue-fill:#0066cc;--blue-soft:#0f2236;--blue-text:#2997ff;--sec:#2c2c2e;--gold-text:#c98a12;--red-text:#ff6b70;--grid:rgba(255,255,255,.07);--axis:rgba(255,255,255,.5);--bar:rgba(0,0,0,.72);--shadow:0 2px 12px rgba(0,0,0,.4)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-weight:600;letter-spacing:-.02em}
.mono{font-family:var(--mono)}
a{color:var(--blue);text-decoration:none}
.pill{height:32px;padding:0 16px;border-radius:999px;background:var(--sec);font-size:13px;font-weight:500;white-space:nowrap}
.pill.pri{background:var(--blue-fill);color:#fff}
.pill:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;min-height:44px}
.back b{font-size:22px;font-weight:400;line-height:1}
.ttl{font-weight:600;letter-spacing:-.02em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:3px;margin-left:auto}
.prog i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--blue)}
.prog i.cur{background:var(--blue);width:22px}
.cnt{font-size:13px;color:var(--sub)}
.tbtns{display:flex;gap:8px}
.chbtn{display:none}
/* desktop layout */
.app{display:flex;height:calc(100vh - 52px);height:calc(100dvh - 52px)}
.toc{width:220px;flex:none;overflow-y:auto;padding:14px 10px;border-right:1px solid var(--line)}
.toc button,.sheet button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;font-size:14px;align-items:baseline}
.toc button:hover{background:var(--sec)}
.toc .num,.sheet .num{font-family:var(--mono);font-size:13px;color:var(--sub)}
.toc button.cur,.sheet button.cur{background:var(--blue-soft);color:var(--blue-text)}
.toc button.cur .num,.sheet button.cur .num{color:var(--blue-text)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:14px}
.explain{flex:none;padding:16px 20px}
.exhead{display:flex;align-items:center;gap:12px}
.exhead h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold{font-size:13px;color:var(--blue);padding:4px 8px}
.book{font-size:13px;color:var(--sub);margin-top:2px}
.extext{font-size:15px;line-height:1.6;max-height:4.8em;overflow-y:auto;margin-top:6px}
.explain.folded .book,.explain.folded .extext{display:none}
.cvwrap{flex:1;min-height:0;position:relative;overflow:hidden;padding:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
.soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.soon div{padding:28px 36px;text-align:center}
.soon h2{font-size:24px}
.soon p{color:var(--sub);font-size:14px;margin-top:4px}
.panel{width:340px;flex:none;overflow-y:auto;padding:14px 14px 14px 0;display:flex;flex-direction:column;gap:14px}
.panel .card{padding:16px 18px}
.panel h3{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:0;margin-bottom:8px}
.points ul{padding-left:18px;font-size:14px}
.points li+li{margin-top:4px}
.gk a{display:block;font-size:14px;padding:6px 0}
.mdark{display:none}
.empty{font-size:14px;color:var(--sub)}
/* controls */
.ctl{display:block;padding:6px 0}
.ctl-h{display:flex;justify-content:space-between;font-size:14px}
.ctl-h b{font-family:var(--mono);font-weight:400;color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.chips button{height:32px;padding:0 14px;border-radius:999px;background:var(--sec);font-size:13px}
.chips button.on{background:var(--blue-fill);color:#fff}
.btnrow{padding:6px 0}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 0;font-size:14px}
.tog i{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog.on i{background:var(--blue-fill)}.tog.on i::after{transform:translateX(16px)}
.ro{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ro span{color:var(--sub)}.ro b{font-family:var(--mono);font-weight:400}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:70vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:12px 12px calc(12px + var(--sb))}
.sheet h3{font-size:15px;padding:6px 12px 8px}
.sheet button{min-height:44px;align-items:center}
.bbar{display:none}
/* tablet + phone */
@media (max-width:1023px){
  .top{gap:8px;padding:0 8px}
  .back{width:44px;height:44px;justify-content:center}.back span{display:none}
  .ttl{flex:1;text-align:center}
  .prog,.cnt,.tbtns{display:none}
  .chbtn{display:block;height:44px;padding:0 12px;border-radius:999px;background:var(--sec);font-size:13px;white-space:nowrap}
  .app{display:flex;flex-direction:column;height:auto;padding-bottom:calc(76px + var(--sb))}
  .toc{display:none}
  .stage{display:contents}
  .cvwrap{order:1;flex:none;height:52vh;border-radius:0;border:0;box-shadow:none;border-bottom:1px solid var(--line)}
  .explain{order:2;background:none;border:0;box-shadow:none;border-radius:0;padding:18px 16px 4px}
  .exhead h1{white-space:normal;font-size:20px}
  .fold{display:none}
  .explain.folded .book,.explain.folded .extext{display:block}
  .extext{font-size:16px;line-height:1.7;max-height:none;overflow:visible;margin-top:10px}
  .panel{order:3;width:auto;overflow:visible;padding:8px 16px 16px}
  .ctl,.tog{min-height:44px}
  .chips button{height:44px;min-width:44px}
  .btnrow .pill{height:44px}
  .mdark{display:block;align-self:flex-start;height:44px;min-width:64px}
  .bbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + var(--sb));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
  .bbar .pill{flex:1;height:44px;font-size:15px}
}
@media (min-width:768px) and (max-width:1023px){.explain,.panel{max-width:760px;width:100%;margin:0 auto}}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../" aria-label="返回格物实验室"><b>‹</b><span>格物实验室</span></a>
  <div class="ttl">导数 · DerivLab</div>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <span class="cnt mono" id="cnt">01 / 11</span>
  <div class="tbtns">
    <button class="pill" id="prevT">上一章</button>
    <button class="pill pri" id="nextT">下一章</button>
    <button class="pill" id="darkT">深色</button>
    <button class="pill" id="fullT">全屏</button>
  </div>
  <button class="chbtn" id="chBtn">章节 01/11</button>
</header>
<div class="app">
  <nav class="toc" id="toc" aria-label="章节"></nav>
  <main class="stage">
    <section class="card explain" id="explain">
      <div class="exhead"><h1 id="chT"></h1><button class="fold" id="fold" aria-expanded="true">收起</button></div>
      <p class="book" id="book"></p>
      <div class="extext" id="exText"></div>
    </section>
    <div class="card cvwrap" id="cvwrap">
      <canvas id="cv"></canvas>
      <div class="soon" id="soon" hidden><div class="card"><h2>即将上线</h2><p id="soonT"></p></div></div>
    </div>
  </main>
  <aside class="panel">
    <div class="card"><h3>控件</h3><div id="ctrl"></div></div>
    <div class="card" id="readCard"><h3>读数</h3><div id="read"></div></div>
    <div class="card points" id="ptsCard"><h3>要点</h3><div id="pts"></div></div>
    <div class="card gk" id="gkCard"><h3>高考链接</h3><div id="gk"></div></div>
    <button class="pill mdark" id="darkM">深色</button>
  </aside>
</div>
<div class="bbar">
  <button class="pill" id="prevB">上一章</button>
  <button class="pill pri" id="nextB">下一章</button>
</div>
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-label="章节列表"><h3>章节</h3><div id="sheetList"></div></div>
</div>
<script>
"use strict";
const B = "人教A版 选择性必修第二册 · ";
const CH = [
  { n: "变化率与导数", book: B + "5.1 导数的概念及其意义", ready: true },
  { n: "导数的运算", book: B + "5.2 导数的运算", ready: false },
  { n: "切线问题", book: B + "5.1–5.2 · 拓展", ready: false },
  { n: "单调性与含参讨论", book: B + "5.3.1 函数的单调性", ready: false },
  { n: "极值与最值", book: B + "5.3.2 函数的极值与最大(小)值", ready: false },
  { n: "零点个数与参数", book: "高考拓展", ready: false },
  { n: "恒成立与存在性", book: "高考拓展", ready: false },
  { n: "切线放缩与常用不等式", book: "高考拓展", ready: false },
  { n: "极值点偏移", book: "高考拓展", ready: false },
  { n: "同构与指对跨阶", book: "高考拓展", ready: false },
  { n: "随堂检测", book: "第五章 一元函数的导数及其应用", ready: false },
];
const MODS = new Array(CH.length).fill(null);

/* ---------- 01 变化率与导数 ---------- */
MODS[0] = (() => {
  const FN = [
    { label: "s=t²", f: (t) => t * t, d: (t) => 2 * t },
    { label: "s=t³/3−t²+2t", f: (t) => (t * t * t) / 3 - t * t + 2 * t, d: (t) => t * t - 2 * t + 2 },
    { label: "s=√t·2", f: (t) => 2 * Math.sqrt(t), d: (t) => 1 / Math.sqrt(t) },
    { label: "s=sin t+t", f: (t) => Math.sin(t) + t, d: (t) => Math.cos(t) + 1 },
  ];
  const MARKS = [1, 0.5, 0.1, 0.01, 0.001], DUR = 2500, XR = [-0.3, 5.3];
  const S = { fi: 0, t0: 1.5, dt: 1, tan: true, play: false, p0: 0, d0: 1, prevAbs: 1, last: null, rec: new Map(), drag: null, map: null };
  const ui = {};
  const F = () => FN[S.fi];
  const MONO = "ui-monospace,Menlo,monospace", SANS = "-apple-system,BlinkMacSystemFont,sans-serif";
  function clampDt(v) {
    v = Math.min(Math.max(v, Math.max(-1.5, -S.t0)), Math.min(2, 5 - S.t0));
    if (Math.abs(v) < 0.001) v = v < 0 ? -0.001 : 0.001;
    return v;
  }
  function yRange() {
    const f = F().f; let lo = 0, hi = -Infinity;
    for (let i = 0; i <= 200; i++) { const y = f((5 * i) / 200); lo = Math.min(lo, y); hi = Math.max(hi, y); }
    const p = (hi - lo) * 0.1 || 1;
    return [lo - p * 0.6, hi + p];
  }
  function clearRec() { S.rec = new Map(); S.last = null; }
  function sync() {
    if (!ui.ro) return;
    const f = F().f, ds = f(S.t0 + S.dt) - f(S.t0), k = ds / S.dt, d = F().d(S.t0), T = theme();
    ui.t0.set(S.t0); ui.dt.set(S.dt);
    ui.ro.set([
      ["t₀", S.t0.toFixed(2)],
      ["Δt", S.dt.toFixed(3)],
      ["Δs", ds.toFixed(4)],
      ["平均变化率 Δs/Δt", k.toFixed(4), "var(--gold-text)"],
      ["瞬时变化率 f′(t₀)", d.toFixed(4), "var(--red-text)"],
      ["两者之差", (k - d).toFixed(4)],
    ]);
  }
  function stopPlay() { S.play = false; if (ui.play) ui.play.btn.textContent = "Δt→0"; }
  function startPlay() {
    if (Math.abs(S.dt) <= 0.0011) { S.dt = clampDt(1); clearRec(); }
    S.d0 = S.dt; S.p0 = performance.now(); S.prevAbs = Math.abs(S.dt) * (1 + 1e-9) + 1e-12;
    S.play = true; ui.play.btn.textContent = "暂停";
  }
  function tick(now) {
    if (!S.play) return;
    const tau = (now - S.p0) / DUR, a = Math.abs(S.d0), sg = S.d0 < 0 ? -1 : 1;
    const cur = tau >= 1 ? 0.001 : Math.max(0.001, a * Math.pow(0.001 / a, tau));
    const f = F().f;
    MARKS.forEach((m) => {
      if (m <= S.prevAbs && m >= cur - 1e-12 && !S.rec.has(m)) {
        S.rec.set(m, (f(S.t0 + sg * m) - f(S.t0)) / (sg * m)); S.last = m;
      }
    });
    S.prevAbs = cur; S.dt = sg * cur;
    if (tau >= 1) stopPlay();
    sync();
  }
  function reset() { stopPlay(); S.t0 = 1.5; S.dt = 1; S.tan = true; if (ui.tan) ui.tan.set(true); clearRec(); sync(); }

  function dot(ctx, x, y, c, label, dx, T) {
    if (S.drag && ((label === "P") === (S.drag === "P"))) {
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fillStyle = c; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = T.bg; ctx.stroke();
    ctx.font = "600 14px " + SANS; ctx.textAlign = dx > 0 ? "left" : "right"; ctx.textBaseline = "bottom";
    ctx.fillText(label, x + dx, y - 6);
  }
  function table(ctx, box, d, T, sm) {
    const tw = sm ? 136 : 156, rh = sm ? 18 : 20, rows = MARKS.length + 2;
    const tx = box.x + box.w - tw - 6, ty = box.y + 6, th = rows * rh + 10, sg = S.dt < 0 ? -1 : 1;
    ctx.save();
    ctx.globalAlpha = 0.92; ctx.fillStyle = T.bg; ctx.fillRect(tx, ty, tw, th);
    ctx.globalAlpha = 1; ctx.strokeStyle = T.axis; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
    ctx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, th - 1);
    ctx.beginPath(); ctx.moveTo(tx + 6, ty + 5 + rh); ctx.lineTo(tx + tw - 6, ty + 5 + rh);
    ctx.moveTo(tx + 6, ty + 5 + rh * (rows - 1)); ctx.lineTo(tx + tw - 6, ty + 5 + rh * (rows - 1)); ctx.stroke();
    ctx.globalAlpha = 1; ctx.textBaseline = "middle"; ctx.font = "12px " + MONO;
    const row = (i, a, b, c) => {
      const y = ty + 5 + rh * i + rh / 2; ctx.fillStyle = c;
      ctx.textAlign = "left"; ctx.fillText(a, tx + 8, y);
      ctx.textAlign = "right"; ctx.fillText(b, tx + tw - 8, y);
    };
    row(0, "Δt", "割线斜率", T.sub);
    MARKS.forEach((m, i) => {
      const has = S.rec.has(m);
      row(i + 1, (sg < 0 ? "−" : "") + m, has ? S.rec.get(m).toFixed(4) : "—", S.last === m ? T.gold : has ? T.fg : T.sub);
    });
    row(rows - 1, "f′(t₀)", d.toFixed(4), T.red);
    ctx.restore();
  }

  return {
    text: "汽车的位移 <i>s</i> 随时间 <i>t</i> 变化。一段时间内的<b>平均速度</b>是割线的斜率 Δ<i>s</i>/Δ<i>t</i>；让 Δ<i>t</i> 越来越小，割线绕着点 P 转动，最终贴成<b>切线</b>——它的斜率就是 <i>t</i>₀ 时刻的<b>瞬时速度</b>，也就是导数 <i>f</i>′(<i>t</i>₀) = lim<sub>Δ<i>t</i>→0</sub> [<i>f</i>(<i>t</i>₀+Δ<i>t</i>) − <i>f</i>(<i>t</i>₀)] / Δ<i>t</i>。",
    points: [
      "平均变化率 = 割线斜率",
      "导数 = 切线斜率 = 瞬时变化率",
      "<i>f</i>′(<i>x</i>₀) 是一个数，<i>f</i>′(<i>x</i>) 是一个函数",
      "Δ<i>x</i> 可正可负，但不为 0",
    ],
    gk: [
      "常考：利用导数的几何意义求切线斜率，利用物理意义求瞬时速度。",
      "易错：lim<sub><i>h</i>→0</sub> [<i>f</i>(<i>x</i>₀+2<i>h</i>) − <i>f</i>(<i>x</i>₀)] / <i>h</i> = 2<i>f</i>′(<i>x</i>₀)，不是 <i>f</i>′(<i>x</i>₀)。",
    ],
    mount(ctrl, read) {
      ui.fn = chips(FN.map((o, i) => ({ label: o.label, value: i })), S.fi, (v) => { stopPlay(); S.fi = v; clearRec(); sync(); });
      ui.t0 = slider("t₀", 0.2, 4.2, 0.01, S.t0, (v) => v.toFixed(2), (v) => { stopPlay(); S.t0 = v; S.dt = clampDt(S.dt); clearRec(); sync(); });
      ui.dt = slider("Δt", -1.5, 2, 0.001, S.dt, (v) => v.toFixed(3), (v) => { stopPlay(); S.dt = clampDt(v); sync(); });
      ui.play = button("Δt→0", () => (S.play ? stopPlay() : startPlay()), true);
      const rs = button("重置", reset); rs.btn.style.marginLeft = "8px"; ui.play.append(rs.btn);
      ui.tan = toggle("显示切线", S.tan, (v) => { S.tan = v; });
      ui.ro = readout();
      ctrl.append(ui.fn, ui.t0, ui.dt, ui.play, ui.tan); read.append(ui.ro);
      stopPlay(); sync();
    },
    unmount() { stopPlay(); S.drag = null; cv.style.cursor = ""; for (const k in ui) delete ui[k]; },
    draw(ctx, W, H) {
      tick(performance.now());
      const T = theme(), sm = W < 520;
      const box = { x: 40, y: 12, w: Math.max(10, W - 54), h: Math.max(10, H - 40) };
      const m = drawAxes(ctx, box, XR, yRange(), { xlabel: "t", ylabel: "s" }); S.map = m;
      const f = F().f, t0 = S.t0, t1 = t0 + S.dt, s0 = f(t0), s1 = f(t1), k = (s1 - s0) / S.dt, d = F().d(t0);
      if (S.tan) plotFn(ctx, m, (x) => s0 + d * (x - t0), null, T.red, 1.5, true);
      plotFn(ctx, m, f, [0, 5], T.blue, 2.5);
      plotFn(ctx, m, (x) => s0 + k * (x - t0), null, T.gold, 2);

/* ---------- 03 切线问题 ---------- */

  const cl = (v, a, b) => Math.min(b, Math.max(a, v));
  function bis(g, a, b) {
    let ga = g(a);
    for (let i = 0; i < 64; i++) { const c = (a + b) / 2, gc = g(c); if (gc < 0 === ga < 0) { a = c; ga = gc; } else b = c; }
    return (a + b) / 2;
  }
  const XS = bis((x) => f(x) - (YR[1] - 0.5), 2, 3);
  // 切点 t：2t³ − 3x_P t² + 3x_P + y_P = 0 的实根（临界点 0 与 x_P 分段 + 二分）
  function tangents(x, y) {

      if (w > 0) { plotFn(ctx, m, f(A[w]), null, K.rt, 1.8, true); lbl(2, "所选 a = " + A[w] + "：f′(−1) ≠ 0（虚线）", K.rt); }
      if (d) {
        plotFn(ctx, m, f(-3), null, T.blue, 2.6); dot(ctx, m.X(-1), m.Y(5), T.blue, T); dot(ctx, m.X(3), m.Y(-27), T.blue, T);
        tag(ctx, m.X(-1) + 10, m.Y(5) - 24, "极大值 f(−1) = 5", K.bt, T); tag(ctx, m.X(3) + 10, m.Y(-27) - 8, "极小值 f(3) = −27", T.fg, T);

    } else if (i === 3) {

      const P = (x) => (x > 0 ? 1 : NaN);
      plotFn(ctx, m, (x) => ex(x) - x - 1, null, T.blue, 2.4);
      plotFn(ctx, m, (x) => P(x) * (x - 1 - ln(x)), [1e-3, 3], T.blue, 2.4, true);

      ui.card = el("div"); ui.ro = readout(); ctrl.append(ui.nav, ui.card); read.append(ui.ro);

})();
const $ = (id) => document.getElementById(id);

/* ---------- theme ---------- */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

}

/* ---------- UI tools ---------- */

/* ---------- drawing tools ---------- */
function niceStep(range, n) {
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function fmtNum(v, s) { const d = Math.max(0, -Math.floor(Math.log10(s) + 1e-9)); const t = v.toFixed(d); return t === "-0" ? "0" : t; }

  const Y = (y) => box.y + box.h - ((y - yr[0]) / (yr[1] - yr[0])) * box.h;

  const sx = opts.xStep || niceStep(xr[1] - xr[0], Math.max(2, box.w / 70));
  const sy = opts.yStep || niceStep(yr[1] - yr[0], Math.max(2, box.h / 50));

  ctx.save(); ctx.lineWidth = 1;

    for (let y = Math.ceil(yr[0] / sy) * sy; y <= yr[1] + 1e-9; y += sy) { const p = Math.round(Y(y)) + 0.5; ctx.moveTo(box.x, p); ctx.lineTo(box.x + box.w, p); }

    ctx.textAlign = "right"; ctx.textBaseline = "middle";

    if (xr[0] < 0 && xr[1] > 0 && yr[0] < 0 && yr[1] > 0) { ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText("O", ax - 4, ay + 4); }
  }

}
function plotFn(ctx, map, f, xr, color, width, dashed) {

/* ---------- canvas ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {

}

  ctx.fillStyle = theme().bg; ctx.fillRect(0, 0, W, H);
  const m = MODS[cur];

}
function loop(t) { frame(t); requestAnimationFrame(loop); }
if (window.ResizeObserver) new ResizeObserver(resize).observe($("cvwrap"));

function pt(e, type) {

}

/* ---------- chapters ---------- */
let cur = -1;
const N = CH.length;
function buildNav() {

  });
}
function go(i) {

    const gk = Array.isArray(m.gk) ? m.gk : m.gk ? [m.gk] : [];
    $("gk").innerHTML = gk.map((g) => (typeof g === "string" ? "<p>" + g + "</p>" : '<a href="' + g.href + '" target="_blank" rel="noopener">' + g.t + " ›</a>")).join("");
    $("ptsCard").hidden = !m.points; $("gkCard").hidden = !gk.length; $("readCard").hidden = false;
    try { m.mount && m.mount(ctrl, read); } catch (e) { console.error(e); }
  } else {

}
function openSheet() { $("sheetBg").hidden = false; const c = $("sheetList").children[cur]; c && c.scrollIntoView({ block: "nearest" }); }

$("sheetBg").addEventListener("click", (e) => { if (e.target === $("sheetBg")) closeSheet(); });
$("chBtn").onclick = openSheet;

$("darkT").onclick = $("darkM").onclick = toggleDark;

  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {}
};

  resize();

document.addEventListener("keydown", (e) => {

const fromHash = () => { const k = parseInt(location.hash.slice(1), 10); return k >= 1 && k <= N ? k - 1 : 0; };

buildNav();
go(fromHash());
requestAnimationFrame(loop);
