<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>格物实验室 · 水循环三维沙盘</title>
    <style>
      :root {
        --bg1: #0e1420; --bg2: #121a2a; --panel: rgba(21, 30, 48, 0.82);
        --line: rgba(255, 255, 255, 0.08); --ink: #e6ecf5; --ink2: #8a97ad;
        --acc: #2ec4b6; --gold: #f2b544; --red: #ef6461;
        --serif: "Noto Serif SC", "Songti SC", serif;
        --sans: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
        --r: 10px;
      }
      html[data-theme="light"] {
        --bg1: #f6f3ec; --bg2: #f6f3ec; --panel: rgba(255, 255, 255, 0.9);
        --line: rgba(29, 36, 51, 0.12); --ink: #1d2433; --ink2: #5d6880;
        --acc: #139a8e; --gold: #c98a12; --acc-t: #0c6f66; --gold-t: #8a5a00;
      }
      :root { --acc-t: var(--acc); --gold-t: var(--gold); --sel: #122d35; }
      html[data-theme="light"] { --sel: #d6e7df; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background-color: var(--bg1);
        background-image: linear-gradient(160deg, var(--bg1), var(--bg2));
        color: var(--ink); font-family: var(--sans); font-size: 14px;
        overflow: hidden; -webkit-text-size-adjust: 100%;
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      .x-app { display: flex; flex-direction: column; height: 100%; }
      /* top bar */
      .x-top {
        height: 56px; flex: none; display: flex; align-items: center; gap: 14px;
        padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel);
        backdrop-filter: blur(12px);
      }
      .x-brand { font-family: var(--serif); font-weight: 700; white-space: nowrap; }
      .x-brand small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--ink2); }
      .x-prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
      .x-seg { flex: 1; display: flex; gap: 3px; min-width: 60px; }
      .x-seg i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background 200ms; }
      .x-seg i.on { background: var(--acc); }
      .x-count { font-family: var(--mono); font-size: 12px; color: var(--ink2); white-space: nowrap; }
      .x-tools { display: flex; gap: 6px; }
      .x-ic {
        width: 44px; height: 44px; border: 1px solid var(--line); border-radius: var(--r);
        background: transparent; font-family: var(--mono); font-size: 13px; transition: 200ms;
      }
      .x-ic:hover { border-color: var(--acc); color: var(--acc); }
      .x-body { flex: 1; display: flex; min-height: 0; }
      /* chapters */
      .x-chaps { width: 220px; flex: none; overflow-y: auto; background: var(--bg1); border-right: 1px solid var(--line); padding: 8px 0; }
      .x-chap {
        display: block; width: 100%; text-align: left; background: transparent; border: 0;
        border-left: 3px solid transparent; padding: 9px 14px; transition: 200ms;
      }
      .x-chap b { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink2); font-weight: 400; }
      .x-chap span { font-family: var(--serif); font-size: 14px; }
      .x-chap:hover { background: var(--sel); }
      .x-chap.on { border-left-color: var(--acc); background: var(--sel); }
      .x-chap.on span { color: var(--acc-t); }
      /* stage */
      .x-stage { flex: 1; position: relative; min-width: 0; }
      #scene { display: block; width: 100%; height: 100%; }
      .x-over {
        position: absolute; top: 14px; left: 14px; max-width: 330px; padding: 12px 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
        backdrop-filter: blur(12px);
      }
      .x-over h1 { font-family: var(--serif); font-size: 17px; margin: 0 0 4px; }
      .x-over .x-src { font-size: 12px; color: var(--gold-t); font-family: var(--mono); margin: 0 0 8px; }
      .x-over p { margin: 0 0 6px; font-size: 12.5px; line-height: 1.6; color: var(--ink2); }
      .x-over.min p, .x-over.min .x-src { display: none; }
      .x-fold { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 12px; line-height: 1; }
      .x-tip {
        position: absolute; left: 14px; bottom: 14px; padding: 8px 12px; font-size: 12px;
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink2);
      }
      .x-tip b { color: var(--acc-t); font-family: var(--mono); }
      /* right panel */
      .x-panel { width: 340px; flex: none; overflow-y: auto; background: var(--bg2); border-left: 1px solid var(--line); padding: 14px; }
      .x-h { font-family: var(--serif); font-size: 13px; letter-spacing: .04em; color: var(--ink2); margin: 0 0 8px; }
      .x-card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 14px; background: var(--panel); }
      .x-card p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.65; }
      .x-card p:last-child { margin-bottom: 0; }
      .x-key { border-color: rgba(242, 181, 68, .35); }
      .x-key h3 { font-family: var(--serif); font-size: 14px; margin: 0 0 8px; color: var(--gold); }
      .x-gk { font-size: 12px; color: var(--ink2); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
      .x-gk b { color: var(--red); }
      #donut { width: 100%; height: 190px; }
      .x-list { list-style: none; margin: 0; padding: 0; }
      .x-list button {
        width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px;
        background: transparent; border: 1px solid transparent; border-radius: 8px;
        padding: 6px 8px; text-align: left; transition: 200ms;
      }
      .x-list button:hover { border-color: var(--line); }
      .x-list button.on { border-color: var(--acc); background: var(--sel); }
      .x-sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
      .x-nm { flex: 1; font-size: 13px; }
      .x-pc { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
      .x-read { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.6; }
      .x-read b { color: var(--acc-t); font-family: var(--serif); }
      .x-read u { text-decoration: none; font-family: var(--mono); color: var(--gold); }
      .x-soon { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; text-align: center; color: var(--ink2); font-size: 12.5px; }
      .x-toggle { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 13px; }
      .x-toggle input { width: 18px; height: 18px; accent-color: var(--acc); }
      .x-hide { display: none; }
      .x-s6 circle { fill: transparent; stroke: var(--ink2); stroke-opacity: .4; stroke-width: 1.5; transition: 200ms; }
      .x-s6 text { fill: var(--ink2); font-size: 12px; font-family: var(--serif); }
      .x-s6.on circle { fill: var(--sel); stroke: var(--acc); stroke-opacity: 1; }
      .x-s6.on text { fill: var(--acc-t); }
      .x-e6 { stroke: var(--ink2); stroke-width: 1.5; opacity: .3; transition: 200ms; }
      .x-e6.on { stroke: var(--acc); opacity: 1; }
      #c5, #c7 { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #c5.x-hide, #c7.x-hide { display: none; }
      .x-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin-bottom: 8px; }
      .x-bar i { display: block; height: 100%; transition: width 200ms; }
      /* mobile */
      .x-tag8 { display: inline-block; font-size: 12px; padding: 2px 8px; margin: 0 4px 4px 0; border: 1px solid var(--line); border-radius: 10px; color: var(--ink2); }
      .x-tag8.on { border-color: var(--acc); background: var(--sel); color: var(--acc-t); }
      .x-eq9 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 13px; }
      .x-eq9 b { color: var(--acc-t); font-weight: 500; }
      .x-list button.x-ok { border-color: var(--acc); background: var(--sel); }
      .x-list button.x-no { border-color: var(--red); }
      .x-ok .x-pc { color: var(--acc-t); } .x-no .x-pc { color: var(--red); }
      .x-q10 { margin: 0 0 8px; font-size: 13.5px; line-height: 1.6; }
      #w9 { transform-box: fill-box; transform-origin: bottom; transition: transform 300ms; }
      #bk9 text { fill: var(--ink2); font-size: 12px; font-family: var(--mono); }
      .x-drawer-h { display: none; }
      @media (max-width: 1023px) { .x-chaps { width: 170px; } .x-panel { width: 290px; } }
      @media (max-width: 767px) {
        .x-body { flex-direction: column; }
        .x-chaps {
          width: 100%; display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0;
          border-bottom: 1px solid var(--line); padding: 6px 8px; gap: 6px; flex: none;
        }
        .x-chap { width: auto; flex: none; border-left: 0; border-bottom: 3px solid transparent; border-radius: 8px; padding: 6px 10px; white-space: nowrap; }
        .x-chap.on { border-bottom-color: var(--acc); }
        .x-stage { flex: 1; min-height: 180px; }
        .x-over { max-width: calc(100% - 28px); }
        .x-panel {
          width: 100%; border-left: 0; border-top: 1px solid var(--line); background: var(--bg2);
          max-height: 46vh; flex: none; padding-top: 4px;
        }
        .x-panel.down { max-height: 52px; overflow: hidden; }
        .x-drawer-h { display: flex; align-items: center; justify-content: center; height: 48px; }
        .x-drawer-h button { background: transparent; border: 0; color: var(--ink2); font-size: 13px; min-height: 44px; min-width: 120px; }
        .x-brand small { display: none; }
      }
    </style>
    <style>
      /* ===== Apple 式极简视觉层：只覆盖样式，不改结构与逻辑 ===== */
      html[data-theme="light"] {
        --bg1: #fbfbfd; --bg2: #fbfbfd; --panel: #ffffff; --glass: rgba(251, 251, 253, 0.72);
        --line: rgba(0, 0, 0, 0.08); --ink: #1d1d1f; --ink2: #6e6e73;
        --acc: #0071e3; --acc-t: #0062c4; --acc-h: #0077ed; --sel: #e8f1fc;
        --gold: #c98a12; --gold-t: #8a5c00; --red: #e5484d; --red-t: #c4282d;
        --teal: #0a9396; --teal-t: #077376; --fill2: #f5f5f7; --fill2-h: #ebebf0;
        --track: rgba(0, 0, 0, 0.12); --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --bg1: #000000; --bg2: #000000; --panel: #1d1d1f; --glass: rgba(0, 0, 0, 0.72);
        --line: rgba(255, 255, 255, 0.12); --ink: #f5f5f7; --ink2: #a1a1a6;
        --acc: #2997ff; --acc-t: #2997ff; --acc-h: #47a6ff; --sel: #0d2a47;
        --gold: #f2b544; --gold-t: #f2b544; --red: #ff6369; --red-t: #ff6369;
        --teal: #2ec4b6; --teal-t: #2ec4b6; --fill2: #2c2c2e; --fill2-h: #3a3a3c;
        --track: rgba(255, 255, 255, 0.2); --shadow: none;
        color-scheme: dark;
      }
      :root {
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
        --serif: var(--sans);
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --r: 18px; --pill: 980px;
        --ease: cubic-bezier(.2, .8, .2, 1); --t: .3s;
      }
      body {
        background: var(--bg1); font-size: 15px; line-height: 1.6;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.003em;
      }
      a { color: var(--acc-t); text-decoration: none; }
      button, a, input { -webkit-tap-highlight-color: transparent; }
      :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
      * { scrollbar-width: thin; scrollbar-color: var(--track) transparent; }

      /* 顶栏 */
      .x-top {
        height: 52px; gap: 16px; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        background: var(--glass); border-bottom: 0.5px solid var(--line);
        -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
        position: relative; z-index: 5;
      }
      .x-brand { display: flex; align-items: center; gap: 12px; font-family: var(--sans); font-weight: 600; min-width: 0; }
      .x-back {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px 0 0;
        font-size: 14px; font-weight: 400; color: var(--acc-t); white-space: nowrap; transition: opacity var(--t) var(--ease);
      }
      .x-back:hover { opacity: .7; }
      .x-name { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 12px; border-left: 0.5px solid var(--line); line-height: 20px; }
      .x-brand small { display: inline; font-size: 13px; font-weight: 400; color: var(--ink2); letter-spacing: 0; }
      .x-prog { gap: 12px; }
      .x-seg { gap: 4px; }
      .x-seg i { height: 3px; border-radius: var(--pill); background: var(--track); transition: background var(--t) var(--ease); }
      .x-seg i.on { background: var(--acc); }
      .x-count { color: var(--ink2); font-variant-numeric: tabular-nums; }
      .x-tools { gap: 2px; }
      .x-ic {
        width: 44px; height: 44px; border: 0; border-radius: var(--pill); background: transparent;
        font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--ink);
        transition: background var(--t) var(--ease), color var(--t) var(--ease);
      }
      .x-ic:hover { background: var(--fill2); color: var(--ink); }
      .x-ic:active { background: var(--fill2-h); }
      .x-toc {
        flex: none; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--pill);
        background: var(--fill2); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap;
        transition: background var(--t) var(--ease);
      }
      .x-toc:hover { background: var(--fill2-h); }

      /* 章节栏 */
      .x-chaps { background: var(--bg1); border-right: 0.5px solid var(--line); padding: 12px 10px; transition: width var(--t) var(--ease), padding var(--t) var(--ease); }
      .x-chaps.x-closed { width: 0; padding-left: 0; padding-right: 0; border-right: 0; overflow: hidden; }
      .x-chap {
        border-left: 0; border-radius: 12px; padding: 8px 12px; margin-bottom: 2px; min-height: 44px;
        transition: background var(--t) var(--ease), color var(--t) var(--ease);
      }
      .x-chap b { font-size: 12px; color: var(--ink2); }
      .x-chap span { font-family: var(--sans); font-size: 15px; letter-spacing: -0.01em; }
      .x-chap:hover { background: var(--fill2); }
      .x-chap.on { background: var(--sel); }
      .x-chap.on b, .x-chap.on span { color: var(--acc-t); }
      .x-chap.on span { font-weight: 600; }

      /* 舞台浮层 */
      .x-over {
        top: 16px; left: 16px; max-width: 360px; max-height: calc(100% - 84px); overflow-y: auto;
        padding: 20px 22px 16px; border: 0; border-radius: 24px; background: var(--panel);
        box-shadow: var(--shadow), 0 0 0 0.5px var(--line);
      }
      .x-over h1 { font-family: var(--sans); font-size: 21px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin: 0 48px 6px 0; }
      .x-over .x-src { font-size: 12px; color: var(--gold-t); margin-bottom: 10px; }
      .x-over p { font-size: 15px; line-height: 1.6; color: var(--ink2); margin-bottom: 8px; }
      .x-fold {
        top: 10px; right: 10px; border: 0; border-radius: var(--pill); background: transparent; color: var(--ink2);
        transition: background var(--t) var(--ease);
      }
      .x-fold:hover { background: var(--fill2); }
      .x-tip {
        left: 16px; bottom: 16px; padding: 8px 14px; border: 0; border-radius: var(--pill);
        background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
        box-shadow: var(--shadow), 0 0 0 0.5px var(--line); color: var(--ink2); font-size: 12px;
      }

      /* 右侧面板与卡片 */
      .x-panel { background: var(--bg2); border-left: 0.5px solid var(--line); padding: 20px 16px; }
      .x-h { font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--ink2); margin: 4px 4px 8px; }
      .x-card { border: 0; border-radius: 20px; padding: 16px 18px; margin-bottom: 16px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 0.5px var(--line); }
      .x-card p { font-size: 15px; line-height: 1.6; }
      .x-key h3 { font-family: var(--sans); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: var(--gold-t); }
      .x-gk { font-size: 13px; border-top: 0.5px solid var(--line); padding-top: 10px; margin-top: 10px; }
      .x-card p.x-gk { font-size: 13px; }
      .x-gk b { color: var(--red-t); }
      .x-read { border: 0; border-radius: 18px; background: var(--fill2); padding: 14px 16px; margin-bottom: 16px; font-size: 15px; }
      .x-read b { font-family: var(--sans); font-weight: 600; color: var(--acc-t); }
      .x-read u { color: var(--gold-t); }
      .x-soon { border: 0; border-radius: 18px; background: var(--fill2); font-size: 14px; }
      .x-q10 { font-size: 16px; font-weight: 500; }
      .x-eq9 { font-size: 14px; }
      .x-sw { border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14); }
      .x-pc { font-variant-numeric: tabular-nums; }
      .x-bar { height: 10px; border-radius: var(--pill); background: var(--fill2); }
      .x-tag8 { padding: 4px 12px; border: 0; border-radius: var(--pill); background: var(--fill2); color: var(--ink2); }
      .x-tag8.on { background: var(--sel); color: var(--acc-t); }
      html[data-theme="light"] .x-card[style*="border-left"] b[style*="color:#"] { color: var(--ink) !important; }

      /* 列表行 */
      .x-list button {
        border: 0; border-radius: 12px; padding: 8px 10px; font-size: 15px;
        transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease), color var(--t) var(--ease);
      }
      .x-list button:hover { background: var(--fill2); }
      .x-list button.on { background: var(--sel); }
      .x-list button.on .x-nm { color: var(--acc-t); font-weight: 500; }
      .x-nm { font-size: 15px; }
      .x-list button.x-ok { background: rgba(10, 147, 150, 0.08); box-shadow: inset 0 0 0 1.5px var(--teal); }
      .x-list button.x-no { background: rgba(229, 72, 77, 0.06); box-shadow: inset 0 0 0 1.5px var(--red); }
      .x-ok .x-pc { color: var(--teal-t); } .x-no .x-pc { color: var(--red-t); }

      /* 胶囊按钮：次按钮浅灰、选中 / 主按钮蓝底白字 */
      div.x-list > button {
        min-height: 44px; justify-content: center; text-align: center; border: 0 !important;
        border-radius: var(--pill); padding: 8px 16px; background: var(--fill2); color: var(--ink); font-weight: 500;
      }
      div.x-list > button:hover { background: var(--fill2-h); }
      div.x-list > button.on,
      #play5, #play7, #next10, #redo10 { background: var(--acc); color: #fff !important; }
      div.x-list > button.on:hover,
      #play5:hover, #play7:hover, #next10:hover, #redo10:hover { background: var(--acc-h); }
      div.x-list > button:active { transform: scale(.98); }
      #avg9 { color: var(--acc-t) !important; }

      /* iOS 式滑块 */
      .x-panel input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 100%; min-height: 44px; margin: 0;
        background: transparent; cursor: pointer;
      }
      .x-panel input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: var(--pill); background: var(--track); }
      .x-panel input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 28px; height: 28px; margin-top: -12px; border-radius: 50%; border: 0;
        background: #fff; box-shadow: 0 0.5px 4px rgba(0, 0, 0, 0.12), 0 6px 13px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
        transition: transform var(--t) var(--ease);
      }
      .x-panel input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.08); }
      .x-panel input[type="range"]::-moz-range-track { height: 4px; border-radius: var(--pill); background: var(--track); }
      .x-panel input[type="range"]::-moz-range-progress { height: 4px; border-radius: var(--pill); background: var(--acc); }

    <script type="application/json" id="chapters">
      [
        {"t":"地球上的水体","p":["地球上的水以海洋水为主，约占全球总水量的 96.5%。陆地上的冰川、地下水、湖泊、河流，大气中的水汽与生物体内的水，合起来只占 3.5% 左右。","淡水只占约 2.5%，其中近七成是两极和高山的冰川。人类容易利用的河流水、淡水湖泊水和浅层地下水，不到淡水总量的 0.3%。","点击右侧的水体，沙盘上会标出它的位置。注意比较各水体的更新周期：大气水约 8 天就更新一次，地下水要上千年。"]},
        {"t":"水的三态变化","p":["水在固态（冰、雪）、液态（水）、气态（水汽）之间不断转化，水循环就是靠这些状态变化推动的。","海面和湖面的水吸收太阳辐射的热量，汽化成水汽；水汽上升遇冷，液化成云中的小水滴，在高空更冷的地方直接凝华成冰晶。冬季山地降雪、积雪，春夏积雪和冰川熔化，融水汇入河流。","切换夏季 / 冬季，看雪线怎样升降；拖动“全球变暖”，看冰川和积雪的变化。"]},
        {"t":"海陆间循环","p":["海陆间循环发生在海洋与陆地之间，是最重要的水循环类型：它使陆地上的水不断得到补充，水资源得以再生。","① 蒸发 → ② 水汽输送 → ③ 降水 → ④ 地表径流 / ⑤ 下渗 → ⑥ 地下径流 → 海洋","点击下面的步骤逐个观察，或按分步演示自动播放。下渗和地下径流发生在地下，看沙盘前侧的剖面：雨水穿过土壤到达潜水面，再沿透水层缓慢流向海洋。"]},
        {"t":"三类水循环","p":["按发生的空间范围，水循环分为三类，沙盘上用颜色区分：","海上内循环：海洋水蒸发，在海洋上空凝结后又降回海洋。参与的水量最大。","海陆间循环：海洋与陆地之间的循环，使陆地水不断得到补充、更新。","陆地内循环：陆地上的水通过蒸发和植物蒸腾进入大气，又降落到陆地。山后的内陆盆地是内流区：内流河注入内陆湖，湖水只能靠蒸发离开，参与的水量最小。"]},
        {"t":"下渗与地表径流","p":["雨水落到地面后有三条去路：被植被截留后蒸发，下渗进入土壤，或者形成地表径流。下渗得多，地表径流就少，地下水得到的补给就多。","影响下渗的主要因素：降水强度（雨越急，来不及下渗的越多）、坡度（坡越陡，水流越快，下渗越少）、植被（根系和枯枝落叶层使土壤疏松，下渗增多）、土壤质地（砂土孔隙大、下渗快，黏土下渗慢）、地面硬化（水泥、沥青路面几乎不透水）。","调节参数后按「来一场暴雨」，比较分配比例和流量过程线。"]},
        {"t":"水循环的地理意义","p":["水循环把大气圈、水圈、岩石圈和生物圈联系在一起：","① 维持全球水量的动态平衡：海洋蒸发的水，通过降水和径流又回到海洋。","② 物质迁移与能量交换：河流把泥沙和溶解物质从陆地搬运到海洋；水汽蒸发时吸热、凝结时放热，把低纬的热量带到高纬，缓解了不同纬度热量收支的不平衡。","③ 塑造地表形态：流水在上游侵蚀出 V 形谷，在下游和河口堆积成冲积平原和三角洲。","④ 使水资源不断更新：淡水被使用后，通过水循环得到补充。"]},
        {"t":"城市化与海绵城市","p":["城市扩张后，农田和绿地变成了建筑、水泥地和沥青路，雨水下渗减少、地表径流增加，又通过排水管网迅速汇入河道：洪峰流量增大，峰现时间提前，城市更容易内涝；地下水得不到补给，河流枯水期流量减少；蒸发、蒸腾减少，城市更干热。","海绵城市用透水铺装、绿色屋顶、下沉式绿地和雨水花园，让城市像海绵一样「吸水、蓄水、渗水、净水」，需要时再把蓄存的水「释放」出来。","拖动硬化率、打开海绵城市，再来一场暴雨，比较流量过程线。"]},
        {"t":"人类活动的影响","p":["人类活动对水循环影响最大的是地表径流环节，也能影响下渗、蒸发和降水。","修建水库：拦蓄洪水、枯水期放水，削峰补枯；库区水面扩大，蒸发增加。跨流域调水（如南水北调）：改变地表径流的空间分布。","植树造林：增加下渗和蒸腾，减少地表径流和水土流失。过量抽取地下水：形成地下水降落漏斗，引起地面沉降，沿海地区海水入侵。人工增雨：向云中播撒催化剂，促使水汽凝结降水。"]},
        {"t":"水量平衡","p":["从多年平均看，全球的水量收支是平衡的。海洋：降水 + 径流入海 = 蒸发；陆地：降水 = 蒸发 + 径流。","海洋蒸发的水比降回海洋的多，多出的部分随水汽输送到陆地，等于陆地流入海洋的径流量。","对一个流域，在一段时间里：P = E + R + ΔS。P 为降水，E 为蒸发（含蒸腾），R 为径流，ΔS 为流域蓄水量的变化。多年平均 ΔS ≈ 0。内流区没有径流流出，降水最终全部蒸发：P ≈ E。"]},
        {"t":"随堂检测","p":["沙盘上的箭头已换成字母。读图并回答问题，答完会显示解析。"]},
        {"t":"自由探索","p":["所有参数都已开放。试着组合不同的条件，观察水循环各环节怎样变化：强向陆风 + 夏季，迎风坡暴雨、河流水量大；冬季，山地积雪、河流靠地下水补给；毁林 + 高硬化率 + 暴雨，洪峰陡涨；全球变暖，雪线上升、冰川退缩。"]}
      ]
    </script>

    <script>
      /* ---------- data ---------- */
      var WATER = JSON.parse(document.getElementById("water-data").textContent);
      var CH = JSON.parse(document.getElementById("chapters").textContent);
      var root = document.documentElement, cur = 0, donut = null, picked = -1;

      /* ---------- shell ---------- */
      var chaps = document.getElementById("chaps"), seg = document.getElementById("seg");
      CH.forEach(function (c, i) {
        var b = document.createElement("button");
        b.className = "x-chap"; b.innerHTML = "<b>" + String(i + 1).padStart(2, "0") + "</b><span>" + c.t + "</span>";
        b.onclick = function () { go(i); };
        chaps.appendChild(b);
        seg.appendChild(document.createElement("i"));
      });

      function go(i) {
        cur = Math.max(0, Math.min(CH.length - 1, i));
        location.hash = "#" + (cur + 1);
        var bs = chaps.children, ss = seg.children;
        for (var k = 0; k < CH.length; k++) {
          bs[k].classList.toggle("on", k === cur);
          ss[k].classList.toggle("on", k <= cur);
        }
        if (window.innerWidth < 768) bs[cur].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
        document.getElementById("count").textContent = String(cur + 1).padStart(2, "0") + " / 11";
        document.getElementById("ovTitle").textContent = CH[cur].t;
        var src = document.getElementById("ovSrc");
        src.textContent = cur >= 9 ? "教材：湘教版 必修第一册·第四章 综合" : cur === 7 ? "教材：湘教版 必修第一册·第四章 水循环与人类活动" : cur === 6 ? "教材：湘教版 必修第一册·第四章 水循环与城市化" : "教材：湘教版 必修第一册·第四章 第一节 水循环";
        src.classList.toggle("x-hide", cur > 10);
        document.getElementById("ovText").innerHTML = CH[cur].p.slice(0, 2).map(function (p) { return "<p>" + p + "</p>"; }).join("");
        buildPanel();
        highlight(-1);
        if (ch2) ch2.show(cur === 1);
        if (cur !== 2) stop3();
        if (ch3) ch3.show(cur === 2);
        if (ch4) ch4.show(cur === 3);
        if (ch5) ch5.show(cur === 4);
        if (ch6) ch6.show(cur === 5);
        if (ch7) ch7.show(cur === 6);
        if (ch8) ch8.show(cur === 7);
        if (ch9) ch9.show(cur === 8);
        if (ch10) ch10.show(cur === 9);
        if (ch11) ch11.show(cur === 10);
      }

      document.getElementById("prev").onclick = function () { go(cur - 1); };
      document.getElementById("next").onclick = function () { go(cur + 1); };
      document.getElementById("theme").onclick = toggleTheme;
      document.getElementById("reset").onclick = function () { resetView(); };
      document.getElementById("full").onclick = function () {
        var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      };
      document.getElementById("fold").onclick = function () { document.getElementById("over").classList.toggle("min"); };
      document.getElementById("drawer").onclick = function () { document.getElementById("panel").classList.toggle("down"); };
      function toggleTheme() {
