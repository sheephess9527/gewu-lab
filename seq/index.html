<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>格物实验室 数列</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--acc:#0071e3;--acc-soft:#e8f1fc;--acc-ink:#005bb5;--acc-btn:#0071e3;--btn2:#f5f5f7;--glass:rgba(251,251,253,.72);--shadow:0 2px 14px rgba(0,0,0,.06);
--red:#e5484d;--gold:#c98a12;--teal:#0a9396;--purple:#8e6bd8;--sans:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--acc:#2997ff;--acc-soft:#0d2740;--acc-ink:#2997ff;--acc-btn:#0071e3;--btn2:#2c2c2e;--glass:rgba(0,0,0,.72);--shadow:0 2px 14px rgba(0,0,0,.4)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--acc);text-decoration:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:999px;background:var(--btn2);font-size:14px;font-weight:500;white-space:nowrap}
.pill.pri{background:var(--acc-btn);color:#fff}
.pill:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px 18px}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;font-size:15px;white-space:nowrap}
.back b{font-size:22px;font-weight:400;line-height:1}
.ttl{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.segs{display:flex;gap:3px}.segs i{width:14px;height:4px;border-radius:2px;background:var(--line)}.segs i.on{background:var(--acc)}
.prog span{font-family:var(--mono);font-size:13px;color:var(--sub)}
.acts{display:flex;gap:8px}
.mch{margin-left:auto;min-height:36px}
/* layout */
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;height:calc(100dvh - 52px)}
.toc{border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px}
.toc button,.sheet button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;padding:9px 12px;border-radius:12px;font-size:14px}
.toc button:hover{background:var(--btn2)}
.toc em,.sheet em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--sub)}
.toc .cur,.sheet .cur{background:var(--acc-soft)!important;color:var(--acc-ink)}.toc .cur em,.sheet .cur em{color:var(--acc-ink)}
.stage{position:relative;min-width:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;left:16px;top:16px;max-width:min(420px,calc(100% - 32px));padding:14px 18px}
.ov-h{display:flex;align-items:center;gap:10px}.ov-h h2{font-size:18px;flex:1}
.ov-h button{width:28px;height:28px;border-radius:50%;background:var(--btn2);font-size:13px}
.ov p{margin-top:8px;color:var(--sub);font-size:14px;line-height:1.7}
.ov.fold p{display:none}
@media (min-width:1024px){
 .stage{display:flex;flex-direction:column}
 .ov{position:static;flex:none;max-width:none;margin:16px 16px 0;padding:12px 18px}
 .ov p{max-height:calc(3 * 1.7em);overflow-y:auto;overscroll-behavior:contain}
 #cv{flex:1 1 0;height:0;min-height:0}
}
.soon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:28px 36px}
.soon h3{font-size:20px;margin-bottom:4px}.soon p{color:var(--sub);font-size:14px}
.panel{border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:8px}
.ctrl{display:flex;flex-direction:column;gap:14px}
.ctl-h{display:flex;justify-content:space-between;gap:12px;font-size:14px}.ctl-h span:last-child{font-family:var(--mono);color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:32px;padding:0 14px;border-radius:999px;background:var(--btn2);font-size:13px}.chips .on{background:var(--acc-btn);color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:32px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}.sw::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(18px)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.ro dt{color:var(--sub)}.ro dd{font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.pts ul{padding-left:18px;font-size:14px;line-height:1.7}.pts li+li{margin-top:4px}
.gk a{display:block;font-size:14px;padding:4px 0}
.muted{color:var(--sub);font-size:14px}
.mhead,.mdark,.bar,.mch,.sheet-bg{display:none}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-height:70vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{font-size:15px;padding:8px 12px}
.sheet button{min-height:44px;font-size:15px;align-items:center}
/* tablet + phone */
@media (max-width:1023px){
 .prog,.acts,.toc,.ov{display:none}
 .mch{display:inline-flex;min-height:44px}
 .app{display:block;height:auto}
 .stage{height:56vh}
 .panel{border:0;overflow:visible;padding:20px 16px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
 .mhead{display:block}.mhead h2{font-size:20px}.mhead .bk{font-size:13px;color:var(--sub);margin:2px 0 10px}.mhead p.tx{font-size:16px;line-height:1.7}
 .ctl{min-height:44px}.ctl-h{font-size:15px}.chips button{min-height:44px;padding:0 16px}.tg{min-height:44px}.ctrl .pill{min-height:44px}
 .mdark{display:inline-flex;align-self:flex-start;min-height:44px;min-width:64px}
 .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .bar .pill{flex:1;min-height:44px}
}
@media (max-width:767px){
 .top{padding:0 8px 0 4px;gap:4px}.back span{display:none}.back{justify-content:center;width:44px}
 .stage{height:52vh}
}
sub,sup{font-size:max(12px,.75em)}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../" aria-label="返回格物实验室"><b>‹</b><span>格物实验室</span></a>
  <div class="ttl">数列 · SeqLab</div>
  <div class="prog"><div class="segs" id="segs"></div><span id="pg">01 / 11</span></div>
  <div class="acts">
    <button class="pill" id="prev">上一章</button>
    <button class="pill pri" id="next">下一章</button>
    <button class="pill" id="dark">深色</button>
    <button class="pill" id="full">全屏</button>
  </div>
  <button class="pill mch" id="mch">章节 <span class="mono" id="mpg">01/11</span></button>
</header>
<div class="app">
  <nav class="toc" id="toc" aria-label="章节"></nav>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="card ov" id="ov"><div class="ov-h"><h2 id="ovT"></h2><button id="fold" aria-label="折叠讲解">–</button></div><p id="ovP"></p></div>
    <div class="card soon" id="soon" hidden><h3>即将上线</h3><p id="soonP"></p></div>
  </div>
  <aside class="panel">
    <div class="mhead"><h2 id="mT"></h2><p class="bk" id="mB"></p><p class="tx" id="mP"></p></div>
    <section id="ctrlBox"><p class="lbl">控件</p><div class="ctrl" id="ctrl"></div></section>
    <section id="readBox"><p class="lbl">读数</p><div id="read"></div></section>
    <section class="card pts"><p class="lbl">要点</p><div id="pts"></div></section>
    <section class="gk"><p class="lbl">高考链接</p><div id="gk"></div></section>
    <p class="muted" id="bookD"></p>
    <button class="pill mdark" id="mdark">深色</button>
  </aside>
</div>
<div class="bar"><button class="pill" id="mprev">上一章</button><button class="pill pri" id="mnext">下一章</button></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="章节列表"><h3>章节</h3><div id="sheetList"></div></div></div>
<script>
"use strict";
const B = "人教A版 选择性必修第二册 · ";
const CH = [
  { n: "数列的概念", book: B + "4.1 数列的概念", ready: false },
  { n: "等差数列", book: B + "4.2.1 等差数列的概念", ready: false },
  { n: "等差数列的前 n 项和", book: B + "4.2.2 等差数列的前 n 项和", ready: false },
  { n: "等比数列", book: B + "4.3.1 等比数列的概念", ready: false },
  { n: "等比数列的前 n 项和", book: B + "4.3.2 等比数列的前 n 项和", ready: false },
  { n: "递推与蛛网图", book: B + "4.1 数列的递推公式 · 拓展", ready: false },
  { n: "构造法求通项", book: "高考拓展", ready: false },
  { n: "数列求和方法", book: "高考拓展", ready: false },
  { n: "放缩与面积比较", book: "高考拓展", ready: false },
  { n: "数学归纳法", book: B + "4.4 数学归纳法", ready: false },
  { n: "随堂检测", book: B + "第四章 数列", ready: false },
];
const MODS = new Array(CH.length).fill(null);
const $ = (id) => document.getElementById(id);
const pad = (i) => String(i + 1).padStart(2, "0");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- theme ---------- */
const PAL = {
  light: { bg: "#fbfbfd", fg: "#1d1d1f", sub: "#6e6e73", grid: "rgba(0,0,0,.06)", axis: "rgba(0,0,0,.35)", blue: "#0071e3", red: "#e5484d", gold: "#c98a12", teal: "#0a9396", purple: "#8e6bd8" },
  dark: { bg: "#000000", fg: "#f5f5f7", sub: "#a1a1a6", grid: "rgba(255,255,255,.08)", axis: "rgba(255,255,255,.4)", blue: "#2997ff", red: "#ff6369", gold: "#e0a53a", teal: "#2ec4c6", purple: "#a98bf0" },
};
const isDark = () => document.documentElement.dataset.theme === "dark";
function theme() { return PAL[isDark() ? "dark" : "light"]; }
function setDark(d) {
  document.documentElement.dataset.theme = d ? "dark" : "light";
  $("dark").textContent = $("mdark").textContent = d ? "浅色" : "深色";
  store.set("seqlab-theme", d ? "dark" : "light");
}
setDark(store.get("seqlab-theme") === "dark");

/* ---------- UI tools ---------- */
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function slider(label, min, max, step, val, fmt, onchange) {
  fmt = fmt || ((v) => String(v));
  const w = el("div", "ctl"), h = el("div", "ctl-h"), a = el("span", "", label), b = el("span"), r = el("input");
  Object.assign(r, { type: "range", min, max, step, value: val }); r.setAttribute("aria-label", label);
  const paint = () => { const v = +r.value; b.textContent = fmt(v); r.style.setProperty("--p", ((v - min) / (max - min)) * 100 + "%"); };
  r.addEventListener("input", () => { paint(); onchange && onchange(+r.value); });
  h.append(a, b); w.append(h, r); paint();
  w.set = (v) => { r.value = v; paint(); }; w.get = () => +r.value;
  return w;
}
function chips(options, val, onchange) {
  const w = el("div", "chips");
  const opts = options.map((o) => (Array.isArray(o) ? o : [o, o]));
  const render = () => w.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", opts[i][0] === val));
  opts.forEach(([v, l]) => { const b = el("button", "", l); b.onclick = () => { val = v; render(); onchange && onchange(v); }; w.append(b); });
  render(); w.set = (v) => { val = v; render(); };
  return w;
}
function button(label, onclick, primary) { const b = el("button", "pill" + (primary ? " pri" : ""), label); b.onclick = onclick; return b; }
function toggle(label, val, onchange) {
  const w = el("div", "tg"), s = el("button", "sw"); w.append(el("span", "", label), s);
  s.setAttribute("role", "switch"); s.setAttribute("aria-label", label);
  const paint = () => { s.classList.toggle("on", !!val); s.setAttribute("aria-checked", !!val); };
  s.onclick = () => { val = !val; paint(); onchange && onchange(val); };
  paint(); w.set = (v) => { val = v; paint(); };
  return w;
}
function readout(rows) {
  const d = el("dl", "ro");
  d.set = (rs) => { d.innerHTML = ""; rs.forEach(([k, v, c]) => { const dt = el("dt", "", k), dd = el("dd", "", v); if (c) dd.style.color = c; d.append(dt, dd); }); };
  d.set(rows || []);
  return d;
}
function niceStep(span, n) { const raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function drawAxes(ctx, box, xr, yr, opts) {
  opts = opts || {}; const T = theme();
  const X = (x) => box.x + ((x - xr[0]) / (xr[1] - xr[0])) * box.w;
  const Y = (y) => box.y + box.h - ((y - yr[0]) / (yr[1] - yr[0])) * box.h;
  const invX = (px) => xr[0] + ((px - box.x) / box.w) * (xr[1] - xr[0]);
  const invY = (py) => yr[0] + ((box.y + box.h - py) / box.h) * (yr[1] - yr[0]);
  const xs = opts.xStep || niceStep(xr[1] - xr[0], Math.max(2, box.w / 70));
  const ys = opts.yStep || niceStep(yr[1] - yr[0], Math.max(2, box.h / 50));
  const fmt = opts.fmt || ((v) => +v.toFixed(6) + "");
  const ax = Math.min(Math.max(0, yr[0]), yr[1]), ay = Math.min(Math.max(0, xr[0]), xr[1]);
  ctx.save(); ctx.lineWidth = 1;
  ctx.font = "12px ui-monospace,Menlo,monospace"; ctx.fillStyle = T.sub;
  for (let v = Math.ceil(xr[0] / xs) * xs; v <= xr[1] + 1e-9; v += xs) {
    const px = Math.round(X(v)) + 0.5;
    if (opts.grid !== false) { ctx.strokeStyle = T.grid; ctx.beginPath(); ctx.moveTo(px, box.y); ctx.lineTo(px, box.y + box.h); ctx.stroke(); }
    if (Math.abs(v) > 1e-9 || ay !== 0) { ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillText(fmt(v), px, Y(ax) + 5); }
  }
  for (let v = Math.ceil(yr[0] / ys) * ys; v <= yr[1] + 1e-9; v += ys) {
    const py = Math.round(Y(v)) + 0.5;
    if (opts.grid !== false) { ctx.strokeStyle = T.grid; ctx.beginPath(); ctx.moveTo(box.x, py); ctx.lineTo(box.x + box.w, py); ctx.stroke(); }
    if (Math.abs(v) > 1e-9 || ax !== 0) { ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(fmt(v), X(ay) - 6, py); }
  }
  ctx.strokeStyle = T.axis; ctx.beginPath();
  ctx.moveTo(box.x, Math.round(Y(ax)) + 0.5); ctx.lineTo(box.x + box.w, Math.round(Y(ax)) + 0.5);
  ctx.moveTo(Math.round(X(ay)) + 0.5, box.y); ctx.lineTo(Math.round(X(ay)) + 0.5, box.y + box.h); ctx.stroke();
  ctx.fillStyle = T.sub; ctx.font = "13px " + getComputedStyle(document.body).fontFamily;
  if (opts.xLabel) { ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillText(opts.xLabel, box.x + box.w, Y(ax) - 4); }
  if (opts.yLabel) { ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(opts.yLabel, X(ay) + 6, box.y); }
  ctx.restore();
  return { X, Y, invX, invY };
}

/* ---------- canvas ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect(); DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
if (window.ResizeObserver) { const ro = new ResizeObserver(resize); ro.observe($("stage")); ro.observe(cv); }
window.addEventListener("resize", resize);
resize();
function frame(ms) {
  const T = theme(), m = curMod();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
  if (m && m.draw) { try { m.draw(ctx, W, H, ms / 1000); } catch (e) { console.error(e); } }
  else { ctx.strokeStyle = T.grid; ctx.lineWidth = 1; ctx.beginPath(); for (let x = 0.5; x < W; x += 32) { ctx.moveTo(x, 0); ctx.lineTo(x, H); } for (let y = 0.5; y < H; y += 32) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke(); }
  requestAnimationFrame(frame);
}
function sendPtr(e, type) {
  const m = curMod(); if (!m || !m.pointer) return;
  const r = cv.getBoundingClientRect(); m.pointer(e, type, e.clientX - r.left, e.clientY - r.top);
}
cv.addEventListener("pointerdown", (e) => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} sendPtr(e, "down"); });
cv.addEventListener("pointermove", (e) => sendPtr(e, "move"));
cv.addEventListener("pointerup", (e) => sendPtr(e, "up"));
cv.addEventListener("pointercancel", (e) => sendPtr(e, "up"));

/* ---------- chapters ---------- */
let cur = -1;
const curMod = () => (cur >= 0 && CH[cur].ready ? MODS[cur] : null);
function listHTML(box) {
  box.innerHTML = "";
  CH.forEach((c, i) => { const b = el("button", "", `<em>${pad(i)}</em><span>${c.n}</span>`); b.onclick = () => { go(i); closeSheet(); }; box.append(b); });
}
listHTML($("toc")); listHTML($("sheetList"));
$("segs").innerHTML = CH.map(() => "<i></i>").join("");
function fill(box, html) { box.innerHTML = html; }
function go(i) {
  i = Math.max(0, Math.min(CH.length - 1, i | 0));
  if (i === cur) return;
  const old = curMod(); if (old && old.unmount) { try { old.unmount(); } catch (e) { console.error(e); } }
  cur = i; const c = CH[i], m = curMod(), ctrl = $("ctrl"), read = $("read");
  ctrl.innerHTML = ""; read.innerHTML = "";
  const text = m ? m.text || "" : "本章交互正在制作中。";
  $("ovT").textContent = $("mT").textContent = pad(i) + " · " + c.n;
  $("ovP").innerHTML = $("mP").innerHTML = text;
  $("mB").textContent = $("bookD").textContent = c.book;
  $("soon").hidden = !!m; $("ov").hidden = !m; $("soonP").textContent = pad(i) + " " + c.n;
  fill($("pts"), m && m.points && m.points.length ? "<ul>" + m.points.map((p) => `<li>${p}</li>`).join("") + "</ul>" : '<p class="muted">即将上线</p>');

MODS[0] = (() => {

    { l: "10·0.8ⁿ⁻¹", f: (x) => 10 * Math.pow(0.8, x - 1), nm: "a<sub>n</sub> = 10·0.8<sup>n−1</sup>" },
    { l: "递推 a<sub>n+1</sub>=2a<sub>n</sub>+1", rec: true, f: (x) => Math.pow(2, x) - 1, nm: "a<sub>1</sub> = 1，a<sub>n+1</sub> = 2a<sub>n</sub> + 1" },

      ctx.fillStyle = T.blue; ctx.fill();

    });
    if (prog[sel - 1] > 0) {
      const px = A.X(sel), py = A.Y(a[sel - 1]), txt = `(${sel}, ${sv(p, sel, a[sel - 1])})`;

/* 02 等差数列 */

    const mono = "12px ui-monospace,Menlo,monospace";
    // line y = dx + (a1 − d)
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = T.sub; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(A.X(0.4), A.Y(d * 0.4 + a1 - d)); ctx.lineTo(A.X(N + 0.6), A.Y(d * (N + 0.6) + a1 - d)); ctx.stroke();

MODS[2] = (() => {

  function draw(ctx, W, H) {

  };
})();

MODS[4] = (() => {

    pre.append(button("1+2+4+…", () => set(1, 2, "cancel")), button("1/2+1/4+…", () => set(0.5, 0.5, "inf")), button("1−1/2+1/4−…", () => set(1, -0.5, "inf")));
    ctrl.append(vc, sA, sQ, sN, btns, pre);
    ro = readout(); read.append(ro); upd();
  }

  return {
    text: "写出 S<sub>n</sub> = a<sub>1</sub> + a<sub>1</sub>q + … + a<sub>1</sub>q<sup>n−1</sup>，两边同乘 q 得 qS<sub>n</sub>，两式<b>错位相减</b>，中间各项全部抵消，只剩首尾：(1−q)S<sub>n</sub> = a<sub>1</sub> − a<sub>1</sub>q<sup>n</sup>。所以 q≠1 时 S<sub>n</sub> = a<sub>1</sub>(1−q<sup>n</sup>)/(1−q)；q=1 时 S<sub>n</sub> = na<sub>1</sub>。当 |q|<1 时，q<sup>n</sup> → 0，S<sub>n</sub> 越来越接近 <b>a<sub>1</sub>/(1−q)</b>。",
    points: [
      "q≠1：S<sub>n</sub> = a<sub>1</sub>(1−q<sup>n</sup>)/(1−q) = (a<sub>1</sub>−a<sub>n</sub>q)/(1−q)；q=1：S<sub>n</sub> = na<sub>1</sub>",
      "错位相减是推导公式与「差比数列」求和的通用方法",
      "S<sub>m</sub>，S<sub>2m</sub> − S<sub>m</sub>，S<sub>3m</sub> − S<sub>2m</sub> 成等比数列（各段和不为 0 时）",
      "|q|<1 时 S<sub>n</sub> → a<sub>1</sub>/(1−q)",
    ],
    gk: [
      "高考链接：公式与错位相减法是解答题第二问的高频方法。",
      "易错：用公式前必须讨论 q 是否为 1；q 含参数时要分 q=1 与 q≠1 两种情况。",
    ],
    mount, draw, unmount() { ts = null; ro = null; sA = sQ = sN = vc = null; },
  };
})();
CH[4].ready = true;

/* 06 递推与蛛网图 */
MODS[5] = (() => {
  const SB = "₀₁₂₃₄₅₆₇₈₉", sb = (k) => String(k).replace(/\d/g, (c) => SB[c]), SEG = 0.16;
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pi = 0, k = 2.8, N = 15, a1 = 0, ts = null, ro = null, sA = null, sK = null, kc = null, sN = null, map = null, drag = false;
  const P = [
    { l: "x/2+1", nm: "f(x) = x/2 + 1", f: (x) => x / 2 + 1, d: () => 0.5, xs: () => 2, xsS: "2", v: [-1, 5], a: [-1, 5, 0.01], a1: 0 },
    { l: "−x/2+3", nm: "f(x) = −x/2 + 3", f: (x) => -x / 2 + 3, d: () => -0.5, xs: () => 2, xsS: "2", v: [-1, 5], a: [-1, 5, 0.01], a1: 0 },
    { l: "(x+2/x)/2 牛顿", nm: "f(x) = (x + 2/x)/2", f: (x) => (x + 2 / x) / 2, d: () => 0, xs: () => Math.SQRT2, xsS: "√2 ≈ 1.4142", v: [0, 4], a: [0.3, 4, 0.01], a1: 3 },
    { l: "2x+1", nm: "f(x) = 2x + 1", f: (x) => 2 * x + 1, d: () => 2, xs: () => -1, xsS: "−1", v: [-4, 4], a: [-3, 3, 0.01], a1: -0.8 },
    { l: "逻辑斯蒂", nm: "f(x) = k·x(1−x)", log: true, f: (x) => k * x * (1 - x), d: () => (k > 1 ? 2 - k : k), xs: () => (k > 1 ? 1 - 1 / k : 0), v: [0, 1], a: [0.01, 0.99, 0.01], a1: 0.2 },
  ];
  const fmt = (v) => {
    if (!isFinite(v)) return "∞";
    if (Math.abs(v) >= 1e6) return v.toExponential(2).replace("-", "−");
    if (Math.abs(v) < 5e-5) return "0.0000";
    return (v < 0 ? "−" : "") + Math.abs(v).toFixed(4);
  };
  const fs = (v) => (v < 0 ? "−" : "") + +Math.abs(v).toFixed(4);
  const seq = (m) => { const a = [a1]; for (let i = 0; i < m - 1; i++) a.push(P[pi].f(a[i])); return a; };
  function verdict() {
    const p = P[pi];
    if (p.log) {
      if (k < 3) return k > 2 ? "收敛（振荡）" : "收敛（单调）";
      if (k < 3.449) return "周期 2";
      if (k < 3.544) return "周期 4";
      if (k < 3.57) return "倍周期（8、16…）";
      return "混沌附近";
    }
    const d = p.d();
    return Math.abs(d) < 1 ? (d >= 0 ? "收敛（单调）" : "收敛（振荡）") : "发散";
  }

  function upd() {
    if (!ro) return;
    const p = P[pi], a = seq(Math.max(8, N + 1)), xs = p.xs(), n = N + 1;
    ro.set([
      ["递推", `a<sub>n+1</sub> = f(a<sub>n</sub>)，${p.nm}${p.log ? `，k = ${k.toFixed(2)}` : ""}`],
      ["a₁ … a₄", a.slice(0, 4).map(fmt).join("，")],
      ["a₅ … a₈", a.slice(4, 8).map(fmt).join("，")],
      ["不动点", `x* = ${p.log ? fs(xs) : p.xsS}，f′(x*) = ${fs(p.d())}`],
      ["判定", `<b>${verdict()}</b>`],
      [`|a${sb(n)} − x*|`, fmt(Math.abs(a[n - 1] - xs))],
    ]);
  }

  function draw(ctx, W, H, t) {
    const T = theme(), p = P[pi], [lo, hi] = p.v, xs = p.xs();
    const s = Math.max(60, Math.min(W - 70, H - 56));
    const iw = Math.max(130, Math.min(220, W * 0.3)), ih = iw * 0.66;
    const box = { x: W - s - 52 >= iw + 90 ? 52 : Math.max(48, (W - s) / 2 + 10), y: 22, w: s, h: s };
    const A = drawAxes(ctx, box, [lo, hi], [lo, hi], { xLabel: "x", yLabel: "y", fmt: fs });
    map = Object.assign({ box }, A);
    const cl = (v) => Math.max(-1e4, Math.min(1e4, v)), PX = (x) => A.X(cl(x)), PY = (y) => A.Y(cl(y));
    ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
    ctx.strokeStyle = T.sub; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(A.X(lo), A.Y(lo)); ctx.lineTo(A.X(hi), A.Y(hi)); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.strokeStyle = T.blue; ctx.lineWidth = 2; ctx.beginPath();
    let pen = false;
    for (let i = 0; i <= 300; i++) {
      const x = lo + ((hi - lo) * i) / 300, y = p.f(x);
      if (!isFinite(y) || Math.abs(y) > 1e4) { pen = false; continue; }
      pen ? ctx.lineTo(A.X(x), A.Y(y)) : ctx.moveTo(A.X(x), A.Y(y)); pen = true;
    }
    ctx.stroke();
    // cobweb
    const a = seq(N + 1), pts = [[a[0], 0]];
    for (let i = 0; i < N; i++) pts.push([a[i], a[i + 1]], [a[i + 1], a[i + 1]]);
    if (ts === -1) ts = t;
    const tot = pts.length - 1, prog = ts == null || RM ? tot : Math.min(tot, (t - ts) / SEG);
    if (prog >= tot) ts = null;
    const whole = Math.floor(prog);
    ctx.strokeStyle = T.gold; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(PX(pts[0][0]), PY(0));
    for (let j = 1; j <= whole; j++) ctx.lineTo(PX(pts[j][0]), PY(pts[j][1]));
    if (whole < tot) {
      const f = prog - whole, q0 = pts[whole], q1 = pts[whole + 1];
      ctx.lineTo(PX(q0[0]) + (PX(q1[0]) - PX(q0[0])) * f, PY(q0[1]) + (PY(q1[1]) - PY(q0[1])) * f);
    }
    ctx.stroke();
    ctx.font = "12px ui-monospace,Menlo,monospace"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    for (let i = 0; i < N && 2 * i + 1 <= whole; i++) {
      const x = PX(a[i]), y = PY(a[i + 1]);
      ctx.fillStyle = T.gold; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      if (i < 6) { ctx.fillStyle = T.fg; ctx.fillText("a" + sb(i + 2), x + 5, y - 3); }
    }
    // fixed point
    ctx.strokeStyle = T.purple; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(A.X(xs), A.Y(xs), 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = T.purple; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("x*", A.X(xs) + 8, A.Y(xs) + 4);
    ctx.restore();
    // draggable a1
    ctx.save(); ctx.beginPath(); ctx.arc(A.X(a1), A.Y(0), 6, 0, Math.PI * 2);
    ctx.fillStyle = T.gold; ctx.fill(); ctx.strokeStyle = T.bg; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = T.fg; ctx.font = "12px ui-monospace,Menlo,monospace"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("a₁", A.X(a1), A.Y(0) - 9); ctx.restore();
    // inset: a_n vs n
    const ib = { x: W - iw - 14, y: H - ih - 26, w: iw, h: ih };
    ctx.save(); ctx.globalAlpha = 0.94; ctx.fillStyle = T.bg; ctx.fillRect(ib.x - 40, ib.y - 22, iw + 50, ih + 44);
    ctx.globalAlpha = 1; ctx.strokeStyle = T.grid; ctx.lineWidth = 1; ctx.strokeRect(ib.x - 40.5, ib.y - 22.5, iw + 50, ih + 44); ctx.restore();
    const B = drawAxes(ctx, ib, [0, 21], [lo, hi], { xStep: 5, yStep: niceStep(hi - lo, 2), grid: false, xLabel: "n", yLabel: "aₙ", fmt: fs });
    const a20 = seq(20);
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = T.purple; ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ib.x, B.Y(xs)); ctx.lineTo(ib.x + ib.w, B.Y(xs)); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = T.gold;
    a20.forEach((v, i) => { if (!(v >= lo && v <= hi)) return; ctx.beginPath(); ctx.arc(B.X(i + 1), B.Y(v), 2.5, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }

  function pointer(e, type, px, py) {
    if (type === "up") { drag = false; return; }
    if (!map) return;
    if (type === "down") { const b = map.box; drag = px >= b.x - 12 && px <= b.x + b.w + 12 && py >= b.y - 12 && py <= b.y + b.h + 24; }
    if (!drag) return;
    const r = P[pi].a;
    const v = Math.max(r[0], Math.min(r[1], +(Math.round(map.invX(px) / r[2]) * r[2]).toFixed(2)));
    if (v !== a1) { a1 = v; ts = null; sA && sA.set(v); upd(); }
  }

  function mkA() {
    const r = P[pi].a, s = slider("首项 a₁", r[0], r[1], r[2], a1, fs, (v) => { a1 = v; ts = null; upd(); });
    if (sA && sA.parentNode) sA.replaceWith(s);
    return (sA = s);
  }
  const showK = () => { const d = P[pi].log ? "" : "none"; sK.style.display = kc.style.display = d; };

  function mount(ctrl, read) {
    sA = null; ts = -1;
    const pc = chips(P.map((p, i) => [i, p.l]), pi, (i) => { pi = i; a1 = P[i].a1; mkA(); showK(); ts = -1; upd(); });
    sK = slider("k", 0.5, 4, 0.01, k, (v) => v.toFixed(2), (v) => { k = v; kc.set(v); ts = null; upd(); });
    kc = chips([[2.8, "2.8 收敛"], [3.2, "3.2 周期 2"], [3.5, "3.5 周期 4"], [3.9, "3.9 混沌"]], k, (v) => { k = v; sK.set(v); ts = -1; upd(); });
    sN = slider("步数", 1, 40, 1, N, (v) => v + " 步", (v) => { N = v; ts = null; upd(); });
    const btns = el("div", "chips");
    btns.append(
      button("播放", () => { ts = -1; }, true),
      button("重置", () => {
        N = 15; sN.set(N); a1 = P[pi].a1; mkA();
        if (P[pi].log) { k = 2.8; sK.set(k); kc.set(k); }
        ts = null; upd();
      })
    );
    ctrl.append(pc, sK, kc, mkA(), sN, btns); showK();
    ro = readout(); read.append(ro); upd();
  }

  return {
    text: "递推公式 a<sub>n+1</sub> = f(a<sub>n</sub>) 把「上一项」变成「下一项」。在同一坐标系里画出 y = f(x) 与 y = x：从 (a<sub>1</sub>, 0) 竖直走到曲线得到 a<sub>2</sub>，再水平走到直线 y = x 把它搬回横轴位置，再竖直走到曲线得到 a<sub>3</sub>……这条折线就是<b>蛛网图</b>。曲线与 y = x 的交点叫<b>不动点</b> x*（f(x*) = x*）；若 |f′(x*)| &lt; 1，数列会被吸向它（收敛），若 |f′(x*)| &gt; 1，会被推开（发散）。在横轴上拖动 a<sub>1</sub>，蛛网实时重画。",
    points: [
      "a<sub>n+1</sub> = f(a<sub>n</sub>) 的不动点满足 f(x) = x",
      "f 递增时数列单调；f 递减时数列摆动（奇偶项各自单调）",
      "|f′(x*)| &lt; 1 时局部收敛",
      "求通项常用「a<sub>n+1</sub> − x* = …(a<sub>n</sub> − x*)」构造（第 7 章）",
    ],
    gk: [
      "高考链接：递推数列判断单调性、有界性和证明 a<sub>n</sub> &lt; 某值常出现在压轴题，蛛网图能帮你先「看出」结论，再用归纳法或作差证明。",
      "易错：f 递减时数列不单调，要分奇偶项讨论。",
    ],
    mount, draw, pointer, unmount() { drag = false; ts = null; ro = null; sA = sK = kc = sN = null; map = null; },
  };
})();
CH[5].ready = true;

/* 07 构造法求通项 */
MODS[6] = (() => {
  const SB = "₀₁₂₃₄₅₆₇₈₉", sb = (x) => String(x).replace(/\d/g, (c) => SB[c]);
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 8;
  let mi = 0, p = 2, q = 1, a1 = 1, k = 2, ts = null, ro = null, sP = null, sQ = null, sA = null, sK = null;
  const num = (v) => {
    if (!isFinite(v)) return "∞";
    const s = v < 0 ? "−" : "", x = Math.abs(v);
    if (Math.abs(x - Math.round(x)) < 1e-9 && x < 1e7) return s + Math.round(x);
    if (x >= 1e7 || (x > 0 && x < 1e-4)) return s + x.toExponential(2);
    return s + +x.toFixed(4);
  };
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const frac = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(Math.abs(n), d) || 1; n /= g; d /= g; return d === 1 ? num(n) : num(n) + "/" + num(d); };
  const T0 = () => q / (1 - p);
  const co = (v) => (v === 1 ? "" : v === -1 ? "−" : num(v));
  const sgn = (v, u) => (v < 0 ? " − " : " + ") + num(Math.abs(v)) + (u || "");
  const deg = () => mi === 0 && Math.abs(a1 - T0()) < 1e-12;

  const M = [
    {
      l: "① p·aₙ+q", a1: () => a1, next: (a) => p * a + q,
      recur: () => `a<sub>n+1</sub> = ${co(p)}a<sub>n</sub>${sgn(q)}`,
      ct: () => `bₙ = aₙ${sgn(-T0())}`,
      b: (a) => a - T0(), kind: () => "geo", par: () => p,
      gen: (n) => (a1 - T0()) * Math.pow(p, n - 1) + T0(),
      steps: () => {
        const t = T0(), b1 = a1 - t;
        const s = [`设 a<sub>n+1</sub> − t = ${co(p)}(a<sub>n</sub> − t) ⇒ (1−p)t = q ⇒ t = ${frac(q, 1 - p)}`,
          `b<sub>n</sub> = a<sub>n</sub>${sgn(-t)}，b<sub>1</sub> = ${num(b1)}${deg() ? " = 0" : " ≠ 0"}`];
        if (deg()) { s.push("b<sub>n</sub> 恒为 0，不是等比数列", `a<sub>n</sub> 为常数列：a<sub>n</sub> = ${num(t)}`); return s; }
        s.push(`{b<sub>n</sub>} 是首项 ${num(b1)}、公比 ${num(p)} 的等比：b<sub>n</sub> = ${num(b1)}·${num(p)}<sup>n−1</sup>`);
        s.push(`a<sub>n</sub> = b<sub>n</sub> + t = ${num(b1)}·${num(p)}<sup>n−1</sup>${sgn(t)}`);
        return s;
      },
    },
    {
      l: "② +3ⁿ", a1: () => 1, next: (a, n) => 2 * a + Math.pow(3, n),
      recur: () => "a<sub>n+1</sub> = 2a<sub>n</sub> + 3<sup>n</sup>（a<sub>1</sub> = 1）",
      ct: () => "bₙ = aₙ/3ⁿ − 1",
      b: (a, n) => a / Math.pow(3, n) - 1, kind: () => "geo", par: () => 2 / 3,
      gen: (n) => Math.pow(3, n) - Math.pow(2, n),
      steps: () => ["两边同除 3<sup>n+1</sup>：令 c<sub>n</sub> = a<sub>n</sub>/3<sup>n</sup>，得 c<sub>n+1</sub> = (2/3)c<sub>n</sub> + 1/3",
        "再用①：t = (1/3)/(1−2/3) = 1，b<sub>n</sub> = c<sub>n</sub> − 1，b<sub>1</sub> = −2/3 ≠ 0",
        "{b<sub>n</sub>} 是公比 2/3 的等比：b<sub>n</sub> = −(2/3)<sup>n</sup>，c<sub>n</sub> = 1 − (2/3)<sup>n</sup>",
        "a<sub>n</sub> = 3<sup>n</sup>c<sub>n</sub> = 3<sup>n</sup> − 2<sup>n</sup>"],
    },
    {
      l: "②′ +2ⁿ⁺¹", a1: () => 2, next: (a, n) => 2 * a + Math.pow(2, n + 1),
      recur: () => "a<sub>n+1</sub> = 2a<sub>n</sub> + 2<sup>n+1</sup>（a<sub>1</sub> = 2）",
      ct: () => "bₙ = aₙ/2ⁿ",
      b: (a, n) => a / Math.pow(2, n), kind: () => "arith", par: () => 1,
      gen: (n) => n * Math.pow(2, n),
      steps: () => ["p = r 的情形：两边同除 2<sup>n+1</sup>，令 b<sub>n</sub> = a<sub>n</sub>/2<sup>n</sup>",
        "得 b<sub>n+1</sub> = b<sub>n</sub> + 1，是公差 1 的等差数列",
        "b<sub>1</sub> = a<sub>1</sub>/2 = 1 ⇒ b<sub>n</sub> = n",
        "a<sub>n</sub> = 2<sup>n</sup>b<sub>n</sub> = n·2<sup>n</sup>"],
    },
    {
      l: "③ 取倒数", a1: () => 1, next: (a) => a / (k * a + 1),
      recur: () => `a<sub>n+1</sub> = a<sub>n</sub>/(${num(k)}a<sub>n</sub> + 1)（a<sub>1</sub> = 1）`,
      ct: () => "bₙ = 1/aₙ",
      b: (a) => 1 / a, kind: () => "arith", par: () => k,
      gen: (n) => 1 / (1 + k * (n - 1)),
      steps: () => [`两边取倒数：1/a<sub>n+1</sub> = (${num(k)}a<sub>n</sub> + 1)/a<sub>n</sub> = 1/a<sub>n</sub> + ${num(k)}`,
        `令 b<sub>n</sub> = 1/a<sub>n</sub>，b<sub>n+1</sub> − b<sub>n</sub> = ${num(k)}，等差`,
        `b<sub>1</sub> = 1 ⇒ b<sub>n</sub> = 1 + ${num(k)}(n − 1)`,
        `a<sub>n</sub> = 1/[1 + ${num(k)}(n − 1)]`],
    },
    {
      l: "④ 累加", a1: () => 1, next: (a, n) => a + 2 * n,
      recur: () => "a<sub>n+1</sub> = a<sub>n</sub> + 2n（a<sub>1</sub> = 1）",
      ct: () => "bₙ = aₙ − a₁（累加量）",
      b: (a) => a - 1, kind: () => "sum", par: () => 0, lab: (i) => "+" + num(2 * i),
      gen: (n) => n * n - n + 1,
      steps: () => ["a<sub>n</sub> − a<sub>n−1</sub> = 2(n−1)，逐式累加（n ≥ 2）",
        "a<sub>n</sub> = a<sub>1</sub> + 2[1 + 2 + … + (n−1)] = 1 + n(n−1)",
        "a<sub>n</sub> = n² − n + 1",
        "验证 n = 1：1 − 1 + 1 = 1 = a<sub>1</sub>，公式对 n ≥ 1 成立"],
    },
    {
      l: "⑤ 累乘", a1: () => 1, next: (a, n) => (a * n) / (n + 1),
      recur: () => "a<sub>n+1</sub> = a<sub>n</sub>·n/(n+1)（a<sub>1</sub> = 1）",
      ct: () => "bₙ = aₙ/a₁（累乘量）",

        ctx.setLineDash([4, 4]); ctx.strokeStyle = T.sub; ctx.beginPath(); ctx.moveTo(A.X(0.5), A.Y(2)); ctx.lineTo(A.X(6.5), A.Y(14)); ctx.stroke(); ctx.setLineDash([]);
        txt(ctx, "a₁ = 4 不在直线 y = 2n + 1 上（该处为 3）", W / 2, 48, T.fg);
      }
    } else if (qi === 3) {
      chart(ctx, W, H, [1, 3, 7, 15, 31], [0, 34], { dots: true, hide: d ? 0 : 5, lab: (k, v) => String(v) });
      txt(ctx, d ? "a_n + 1 = 2ⁿ ⇒ a_n = 2ⁿ − 1" : "a_{n+1} = 2a_n + 1：1 → 3 → 7 → 15 → ?", W / 2, 48, T.fg);
    } else if (qi === 4) {
      const n = 12, v = Array.from({ length: n }, (_, k) => (d ? (k + 1) / (k + 2) : 1 / ((k + 1) * (k + 2))));
      const A = chart(ctx, W, H, v, [0, 1.1], { ys: 0.25, col: (k) => (d && k === 10 ? T.gold : T.blue) });
      if (d) { ctx.setLineDash([4, 4]); ctx.strokeStyle = T.red; ctx.beginPath(); ctx.moveTo(A.X(0.3), A.Y(1)); ctx.lineTo(A.X(n + 0.7), A.Y(1)); ctx.stroke(); ctx.setLineDash([]); }
      txt(ctx, d ? "S_n = 1 − 1/(n+1) 递增且 < 1；S₁₀ = 10/11" : "a_n = 1/(n(n+1)) = 1/n − 1/(n+1)", W / 2, 48, T.fg);
    } else {
      const n = 12, v = Array.from({ length: n }, (_, k) => (d ? 14 * (k + 1) - (k + 1) ** 2 : 15 - 2 * (k + 1)));
      chart(ctx, W, H, v, d ? [0, 54] : [-10, 14], { col: (k, x) => (d ? (k === 7 ? T.gold : T.blue) : x > 0 ? T.blue : T.red), lab: (k, x) => (d ? (k === 7 ? "S₇ = 49" : null) : k === 7 || k === 8 ? String(x) : null) });
      txt(ctx, d ? "S_n = 14n − n²，n = 7 时最大" : "a_n = 15 − 2n：a₇ > 0，a₈ < 0", W / 2, 48, T.fg);
    }
  }
  return {
    text: "6 道题，新高考 I 卷风格：单选 4 题（每题 5 分）、多选 1 题（全对 6 分、选对但不全 3 分、有错 0 分）、填空 1 题（5 分），满分 31 分。每题作答后点「提交」即时判分并显示解析。",
    points: ["下标和性质", "等比基本量", "由 S<sub>n</sub> 求 a<sub>n</sub>", "构造法求通项", "裂项相消", "等差 S<sub>n</sub> 最值"],
    gk: ["高考链接：数列在新高考 I 卷通常为一道小题 + 一道解答题（约 17 分），解答题常见「求通项 + 求和/证明不等式」两问结构。"],
    mount(ctrl) { box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:12px"; ctrl.append(box); reset(); },
    draw, unmount() { box = null; },
  };
})();
