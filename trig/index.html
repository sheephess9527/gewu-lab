<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>格物实验室 三角与解三角形</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--acc:#0071e3;--accDeep:#0058b0;--accSoft:#e8f1fc;--btn2:#f5f5f7;--bar:rgba(251,251,253,.72);--track:#e5e5ea;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace}
[data-theme=dark]{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--acc:#2997ff;--accDeep:#6cb6ff;--accSoft:rgba(41,151,255,.18);--btn2:#2c2c2e;--bar:rgba(0,0,0,.72);--track:#3a3a3c;--shadow:0 1px 2px rgba(0,0,0,.4)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit}
a{color:var(--acc)}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--acc);font-weight:500;white-space:nowrap}
.back .full{margin-left:4px}
.ttl{font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.segs{display:flex;gap:4px}.segs i{width:18px;height:4px;border-radius:2px;background:var(--track)}
.segs i.on{background:var(--acc);opacity:.4}.segs i.cur{background:var(--acc);opacity:1}
.cnt{font:13px var(--mono);color:var(--sub)}
.acts{display:flex;gap:8px}
.pill{border:0;border-radius:980px;padding:0 16px;min-height:36px;background:var(--btn2);cursor:pointer;font-size:14px;white-space:nowrap}
.pill.pri{background:#0066cc;color:#fff}
.pill:disabled{opacity:.4;cursor:default}
.chbtn{display:none;margin-left:auto;min-height:44px}
/* layout */
.app{display:grid;grid-template-columns:220px 1fr 340px;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.toc{border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
.toc ol,.sheet ol{list-style:none;margin:0;padding:0}
.toc li button,.sheet li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14px;align-items:baseline}
.toc li button:hover{background:var(--btn2)}
.toc li button b,.sheet li button b{font:13px var(--mono);color:var(--sub);font-weight:400}
.toc li button.cur,.sheet li button.cur{background:var(--accSoft);color:var(--accDeep);font-weight:600}
.toc li button.cur b,.sheet li button.cur b{color:var(--accDeep)}
.center{display:flex;flex-direction:column;gap:12px;padding:12px;min-width:0;min-height:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.lec{padding:14px 20px;flex:none}
.lec-h{display:flex;align-items:center;gap:10px}
.lec-h h2{font-size:20px;flex:1;min-width:0}
.fold{border:0;background:var(--btn2);border-radius:980px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:30px}
.book{font-size:13px;color:var(--sub);margin:2px 0 0}
.txt{margin:6px 0 0;max-height:4.8em;overflow:auto;line-height:1.6}
.lec.collapsed .book,.lec.collapsed .txt{display:none}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.box{padding:14px 16px}
.box h3{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:0}
.box ul{margin:0;padding-left:1.1em}.box li{margin:4px 0}
.mdark{display:none}
.empty{color:var(--sub);font-size:14px;margin:0}
/* controls */
.ctl{margin:0 0 12px}.ctl:last-child{margin-bottom:0}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.ctl-h span{font:13px var(--mono);color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--btn2);border-radius:980px;padding:4px 12px;min-height:34px;font-size:14px;cursor:pointer}
.chips button.on{background:#0066cc;color:#fff;border-color:transparent}
.tog{display:flex;justify-content:space-between;align-items:center;min-height:40px;font-size:14px;cursor:pointer}
.tog input{-webkit-appearance:none;appearance:none;width:44px;height:26px;border-radius:13px;background:var(--track);position:relative;cursor:pointer;transition:background .2s;margin:0}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog input:checked{background:#34c759}.tog input:checked::after{transform:translateX(18px)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.ro dt{color:var(--sub)}.ro dd{margin:0;text-align:right;font-family:var(--mono)}
/* sheet + bottom bar */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:70vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 10px}
.sheet li button{min-height:48px;font-size:15px}
.bbar{display:none}
/* tablet */
@media (max-width:1023px){
 .app{display:block;height:auto}
 .toc,.prog{display:none}
 .chbtn{display:inline-flex;align-items:center}
 .center{padding:12px}
 .stage{order:-1;flex:none;height:52vh}
 .fold{display:none}
 .lec.collapsed .book,.lec.collapsed .txt{display:block}
 .txt{max-height:none}
 .panel{border:0;padding:0 12px 24px}
 .mdark{display:block}
}
/* phone */
@media (max-width:767px){
 .top{height:52px;padding:0 4px 0 0;gap:4px}
 .back{width:44px;height:44px;justify-content:center;font-size:24px}.back .full{display:none}
 .ttl{flex:1;font-size:15px}
 .acts{display:none}
 .chbtn{margin-left:0}
 .center{padding:0;gap:0}
 .stage{border-radius:0;border-left:0;border-right:0;box-shadow:none}
 .lec{border:0;box-shadow:none;background:none;padding:16px}
 .lec-h h2{font-size:20px}
 .txt{font-size:16px;line-height:1.7}
 .panel{padding:0 16px calc(88px + env(safe-area-inset-bottom))}
 .ctl-h{min-height:28px}.chips button{min-height:44px}.tog{min-height:44px}
 .mdark .pill{min-height:44px}
 .bbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .bbar .pill{flex:1;min-height:44px;font-size:15px}
}
</style>
<style id="gw-hidden-fix">[hidden]{display:none!important}</style></head>
<body>
<header class="top">
  <a class="back" href="../" aria-label="返回格物实验室">‹<span class="full">格物实验室</span></a>
  <div class="ttl">三角与解三角形 · TrigLab</div>
  <div class="prog"><div class="segs" id="segs"></div><span class="cnt" id="cnt">01 / 09</span></div>
  <div class="acts">
    <button class="pill" id="prev">上一章</button>
    <button class="pill pri" id="next">下一章</button>
    <button class="pill" id="dark">深色</button>
    <button class="pill" id="fs">全屏</button>
  </div>
  <button class="pill chbtn" id="chbtn">章节 <span class="mono" id="chcnt">01/09</span></button>
</header>
<div class="app">
  <nav class="toc" aria-label="章节目录"><ol id="toc"></ol></nav>
  <main class="center">
    <section class="card lec" id="lec">
      <div class="lec-h"><h2 id="lt"></h2><button class="fold" id="fold" aria-expanded="true">收起</button></div>
      <p class="book" id="lb"></p>
      <div class="txt" id="lx"></div>
    </section>
    <div class="card stage" id="stage"><canvas id="cv" aria-label="实验画布"></canvas></div>
  </main>
  <aside class="panel">
    <div class="card box"><h3>控件</h3><div id="ctrl"></div></div>
    <div class="card box"><h3>读数</h3><div id="read"></div></div>
    <div class="card box" id="ptsBox"><h3>要点</h3><ul id="pts"></ul></div>
    <div class="card box" id="gkBox"><h3>高考链接</h3><div id="gk"></div></div>
    <div class="mdark"><button class="pill" id="dark2">深色</button></div>
  </aside>
</div>
<div class="backdrop" id="bd" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="章节列表"><div class="grab"></div><ol id="slist"></ol></div>
<div class="bbar"><button class="pill" id="prev2">上一章</button><button class="pill pri" id="next2">下一章</button></div>
<script>
const CH=[
 {n:"两角和与差",book:"人教A版 必修第一册 · 5.5.1 两角和与差的正弦、余弦和正切公式",ready:true},
 {n:"二倍角与降幂",book:"人教A版 必修第一册 · 5.5.1 二倍角公式 · 5.5.2 简单的三角恒等变换",ready:false},
 {n:"辅助角公式",book:"人教A版 必修第一册 · 5.5.2 · 高考拓展",ready:false},
 {n:"正弦定理",book:"人教A版 必修第二册 · 6.4.3 余弦定理、正弦定理",ready:false},
 {n:"余弦定理",book:"人教A版 必修第二册 · 6.4.3",ready:false},
 {n:"解的个数",book:"人教A版 必修第二册 · 6.4.3 · 已知两边及一边对角",ready:false},
 {n:"面积与最值",book:"人教A版 必修第二册 · 6.4.3 · 高考拓展",ready:false},
 {n:"测量应用",book:"人教A版 必修第二册 · 6.4.3 · 余弦定理、正弦定理应用举例",ready:false},
 {n:"随堂检测",book:"三角恒等变换与解三角形",ready:false}];
const MODS=[];
/* ---------- 01 两角和与差 ---------- */
MODS[0]=(()=>{
 const S={mode:"vec",a:60,b:20,fn:"sin",sg:1,sp:0,map:null,dk:null},R=d=>d*Math.PI/180;
 const F=v=>(Math.abs(v)<5e-10?0:v).toFixed(4),N=v=>v<-5e-10?"("+F(v)+")":F(v);
 const tri={sin:Math.sin,cos:Math.cos,tan:Math.tan};
 const SP={15:{a:45,b:30,sg:-1},75:{a:45,b:30,sg:1},105:{a:60,b:45,sg:1}};
 const EX={15:{sin:"(√6−√2)/4",cos:"(√6+√2)/4",tan:"2−√3"},75:{sin:"(√6+√2)/4",cos:"(√6−√2)/4",tan:"2+√3"},105:{sin:"(√6+√2)/4",cos:"(√2−√6)/4",tan:"−2−√3"}};
 const V={30:{sin:"1/2",cos:"√3/2",tan:"√3/3"},45:{sin:"√2/2",cos:"√2/2",tan:"1"},60:{sin:"√3/2",cos:"1/2",tan:"√3"}};
 const sc=()=>S.sg>0?"+":"−";
 // right side of the identity, built from term function s(f,angle) and product joiner j
 function exp(fn,sg,s,j){const p=sg>0?" + ":" − ",q=sg>0?" − ":" + ";
  if(fn==="sin")return s("sin","a")+j+s("cos","b")+p+s("cos","a")+j+s("sin","b");
  if(fn==="cos")return s("cos","a")+j+s("cos","b")+q+s("sin","a")+j+s("sin","b");
  return "("+s("tan","a")+p+s("tan","b")+")/(1"+q+s("tan","a")+"·"+s("tan","b")+")"}
 function vals(){const a=R(S.a),b=R(S.b),c=a+S.sg*b,sa=Math.sin(a),ca=Math.cos(a),sb=Math.sin(b),cb=Math.cos(b),ta=sa/ca,tb=sb/cb;
  const ok=S.fn!=="tan"||(Math.abs(ca)>1e-9&&Math.abs(cb)>1e-9&&Math.abs(Math.cos(c))>1e-9);
  const rhs=S.fn==="sin"?sa*cb+S.sg*ca*sb:S.fn==="cos"?ca*cb-S.sg*sa*sb:(ta+S.sg*tb)/(1-S.sg*ta*tb);
  return{a,b,c,lhs:tri[S.fn](c),rhs,ok}}
 const P1={k:"a",x:1,y:0,onmove:()=>upd()},P2={k:"b",x:1,y:0,onmove:()=>upd()};
 const dp=dragPoints([P1,P2],()=>S.map,(nx,ny,p)=>{const d=((Math.round(Math.atan2(ny,nx)*180/Math.PI/5)*5)%360+360)%360;S[p.k]=d;return{x:Math.cos(R(d)),y:Math.sin(R(d))}});
 let ro=null,box=null;
 function sliders(b){S.sa=slider("α",0,360,5,S.a,v=>v+"°",v=>{S.a=v;S.sp=0;S.spc&&S.spc.set(0);upd()});
  S.sb=slider("β",0,360,5,S.b,v=>v+"°",v=>{S.b=v;S.sp=0;S.spc&&S.spc.set(0);upd()});b.append(S.sa,S.sb)}
 function circle(top){const t=theme(),m=S.map=drawAxes(ctx,{x:16,y:top,w:W-32,h:H-top-16},[-1.35,1.35],[-1.35,1.35],{equal:true,xStep:.5,yStep:.5});
  const ox=m.X(0),oy=m.Y(0),r=m.X(1)-ox;ctx.save();ctx.strokeStyle=t.axis;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ox,oy,r,0,2*Math.PI);ctx.stroke();ctx.restore();
  return{m,ox,oy,r,t,P:th=>[m.X(Math.cos(th)),m.Y(Math.sin(th))]}}
 function dash(x1,y1,x2,y2,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
 function dot(x,y,c,big){ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,big?8:6,0,2*Math.PI);ctx.fill();ctx.restore()}
 const SUM_MODES=[
  {id:"vec",l:"向量证明",
   ctl(b){sliders(b);b.append(el("p","empty","也可直接拖动圆上的 P₁、P₂"))},
   ro(){const t=theme(),a=R(S.a),b=R(S.b),ca=Math.cos(a),cb=Math.cos(b),sa=Math.sin(a),sb=Math.sin(b);
    return[["α, β, α−β",S.a+"°, "+S.b+"°, "+(S.a-S.b)+"°"],
     ["|OP₁||OP₂|cos(α−β)","1×1×cos("+(S.a-S.b)+"°) = "+F(Math.cos(a-b)),t.blue],
     ["cos α cos β + sin α sin β",N(ca)+"×"+N(cb)+" + "+N(sa)+"×"+N(sb)+" = "+F(ca*cb+sa*sb),t.goldText]]},
   draw(){const g=circle(16),{ox,oy,r,t}=g,A=R(S.a),B=R(S.b);
    P1.x=Math.cos(A);P1.y=Math.sin(A);P2.x=Math.cos(B);P2.y=Math.sin(B);
    [[A,P1,t.blue,"P₁",t.blue],[B,P2,t.red,"P₂",t.redText]].forEach(([th,p,c,n,tc])=>{const[x,y]=g.P(th);
     dash(x,y,x,oy,t.sub);dash(x,y,ox,y,t.sub);arrow(ctx,ox,oy,x,y,c);dot(x,y,c,dp.active===p||dp.hover===p);
     label(ctx,n,ox+Math.cos(th)*(r+20),oy-Math.sin(th)*(r+20),tc)});
    if(S.a!==S.b)angleArc(ctx,ox,oy,Math.max(18,r*.3),B,A,t.gold,"α−β");
    label(ctx,"OP₁·OP₂ = cos(α−β) = "+F(Math.cos(A-B)),16,26,t.fg,"left")},
   pointer:(e,type,x,y)=>dp.pointer(e,type,x,y)},
  {id:"fml",l:"公式验证",
   ctl(b){b.append(chips([{v:"sin",l:"sin(α±β)"},{v:"cos",l:"cos(α±β)"},{v:"tan",l:"tan(α±β)"}],S.fn,v=>{S.fn=v;upd()}));
    S.sgc=chips([{v:1,l:"α + β"},{v:-1,l:"α − β"}],S.sg,v=>{S.sg=v;S.sp=0;S.spc.set(0);upd()});b.append(S.sgc);sliders(b);
    b.append(el("p","empty","特殊角"));
    S.spc=chips([{v:0,l:"自定"},{v:15,l:"15°"},{v:75,l:"75°"},{v:105,l:"105°"}],S.sp,v=>{S.sp=v;if(v){const e=SP[v];S.a=e.a;S.b=e.b;S.sg=e.sg;S.sgc.set(e.sg)}upd()});b.append(S.spc)},
   ro(){const t=theme(),v=vals(),nm=S.fn+"(α"+sc()+"β)",rows=[["α, β",S.a+"°, "+S.b+"°"]];
    if(!v.ok)return rows.concat([[nm,"无意义：tan α、tan β 或 tan(α"+sc()+"β) 不存在",t.redText]]);
    rows.push(["左边 "+nm,S.fn+"("+(S.a+S.sg*S.b)+"°) = "+F(v.lhs),t.blue]);
    rows.push(["右边 代入",exp(S.fn,S.sg,(f,k)=>N(tri[f](k==="a"?v.a:v.b)),"×")+" = "+F(v.rhs),t.goldText]);
    if(S.sp){const e=SP[S.sp];rows.push(["精确值",S.fn+" "+S.sp+"° = "+S.fn+"("+e.a+"°"+(e.sg>0?"+":"−")+e.b+"°) = "+
     exp(S.fn,e.sg,(f,k)=>V[k==="a"?e.a:e.b][f],"·")+" = "+EX[S.sp][S.fn]])}
    return rows},
   draw(){const t=theme(),v=vals(),nm=S.fn+"(α"+sc()+"β)",g=circle(84),{m,ox,oy,r}=g,[ax,ay]=g.P(v.a),[cx,cy]=g.P(v.c);
    label(ctx,nm+" = "+exp(S.fn,S.sg,(f,k)=>f+" "+(k==="a"?"α":"β")," "),16,22,t.fg,"left");
    if(v.ok){label(ctx,"左边 = "+F(v.lhs),16,46,t.blue,"left");label(ctx,"右边 = "+F(v.rhs),16,68,t.goldText,"left")}
    else label(ctx,"正切无意义",16,46,t.redText,"left");
    if(S.sp)label(ctx,S.fn+" "+S.sp+"° = "+EX[S.sp][S.fn],W-16,22,t.fg,"right");
    angleArc(ctx,ox,oy,Math.max(14,r*.18),0,v.a,t.gold);
    if(S.b%360)angleArc(ctx,ox,oy,Math.max(22,r*.36),v.a,v.c,t.gold,(S.sg>0?"+":"−")+"β");
    arrow(ctx,ox,oy,ax,ay,t.blue);label(ctx,"α",ox+Math.cos(v.a)*(r+18),oy-Math.sin(v.a)*(r+18),t.blue);
    arrow(ctx,ox,oy,cx,cy,t.fg,null,2.5);label(ctx,"α"+sc()+"β",ox+Math.cos(v.c)*(r+22),oy-Math.sin(v.c)*(r+22),t.fg);
    if(S.fn==="sin"){dash(cx,cy,cx,oy,t.red);label(ctx,"sin",cx+(cx>ox?-18:18),(cy+oy)/2,t.redText)}
    else if(S.fn==="cos"){dash(cx,cy,ox,cy,t.red);label(ctx,"cos",(cx+ox)/2,cy+(cy<oy?-12:12),t.redText)}
    else if(v.ok&&Math.abs(Math.tan(v.c))<1.3){const ty=m.Y(Math.tan(v.c));dash(m.X(1),m.Y(-1.3),m.X(1),m.Y(1.3),t.sub);dash(ox,oy,m.X(1),ty,t.red);dot(m.X(1),ty,t.red);label(ctx,"tan",m.X(1)+20,ty,t.redText)}
    dot(cx,cy,t.fg)}},
  {id:"rect",l:"矩形拼图",
   ctl(b){if(!S.ra){S.ra=30;S.rb=25}

 const pick=(x,y,rad)=>{let best=null,bd=rad;const m=M();points.forEach(p=>{if(p.fixed)return;const px=m?m.X(p.x):p.x,py=m?m.Y(p.y):p.y,dd=Math.hypot(px-x,py-y);if(dd<=bd){bd=dd;best=p}});return best};
 d.pointer=(e,type,x,y)=>{const rad=e&&e.pointerType==="touch"?22:12,m=M();
  if(type==="down"){d.active=pick(x,y,rad);return!!d.active}
  if(type==="move"){if(!d.active){d.hover=pick(x,y,rad);return false}
   let nx=m?m.invX(x):x,ny=m?m.invY(y):y;if(typeof snap==="number"){nx=Math.round(nx/snap)*snap;ny=Math.round(ny/snap)*snap}else if(typeof snap==="function"){const s=snap(nx,ny,d.active);if(s){nx=s.x;ny=s.y}}
   d.active.x=nx;d.active.y=ny;d.active.onmove&&d.active.onmove(d.active);return true}
  if(type==="up"){const was=!!d.active;d.active=null;return was}};return d}
function fmtDeg(rad){return(+(rad*180/PI).toFixed(1))+"°"}
function gcd(a,b){return b?gcd(b,a%b):a}
function fmtRad(rad){const k=rad/(PI/12),r=Math.round(k);if(Math.abs(k-r)>1e-6)return(+rad.toFixed(3))+"";if(r===0)return"0";
 const g=gcd(Math.abs(r),12),p=r/g,q=12/g,s=p<0?"-":"",a=Math.abs(p);return s+(a===1?"":a)+"π"+(q===1?"":"/"+q)}
/* ---------- shell ---------- */
const cv=$("cv"),ctx=cv.getContext("2d");let W=0,H=0,cur=-1,t0=performance.now();
function resize(){const r=$("stage").getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);frame()}
function mod(){const m=MODS[cur];return CH[cur]&&CH[cur].ready&&m?m:null}
function soon(){const T=theme(),w=Math.min(300,W-40),h=128,x=(W-w)/2,y=(H-h)/2;ctx.save();ctx.fillStyle=dark?"#2c2c2e":"#f5f5f7";ctx.beginPath();
 ctx.roundRect?ctx.roundRect(x,y,w,h,22):ctx.rect(x,y,w,h);ctx.fill();ctx.restore();
 label(ctx,pad(cur)+" · "+CH[cur].n,W/2,y+42,T.fg);ctx.save();ctx.font="600 22px -apple-system,'PingFang SC','Noto Sans SC',sans-serif";ctx.fillStyle=T.blue;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("即将上线",W/2,y+80);ctx.restore()}
function frame(){const T=theme();ctx.clearRect(0,0,W,H);ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);const m=mod();
 if(m&&m.draw){try{m.draw(ctx,W,H,(performance.now()-t0)/1000)}catch(e){console.error(e)}}else if(cur>=0)soon()}
(function loop(){frame();requestAnimationFrame(loop)})();
new ResizeObserver(resize).observe($("stage"));addEventListener("resize",resize);
let capId=null;
function fwd(type,e){const m=mod();if(!m||!m.pointer)return;const r=cv.getBoundingClientRect();try{if(m.pointer(e,type,e.clientX-r.left,e.clientY-r.top))e.preventDefault()}catch(err){console.error(err)}}
cv.addEventListener("pointerdown",e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}fwd("down",e)});
cv.addEventListener("pointermove",e=>fwd("move",e));
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,e=>fwd("up",e)));
function list(ol,close){ol.innerHTML="";CH.forEach((c,i)=>{const li=el("li"),b=el("button",null,"<b>"+pad(i)+"</b><span>"+c.n+"</span>");b.type="button";b.onclick=()=>{go(i);close&&sheet(false)};li.append(b);ol.append(li)})}
list($("toc"));list($("slist"),true);
CH.forEach(()=>$("segs").append(el("i")));
function go(i){i=Math.max(0,Math.min(CH.length-1,i));if(i===cur)return;const old=mod();if(old&&old.unmount){try{old.unmount()}catch(e){console.error(e)}}
 cur=i;const c=CH[i],m=mod(),ctrl=$("ctrl"),read=$("read");ctrl.innerHTML="";read.innerHTML="";
 $("lt").textContent=pad(i)+" "+c.n;$("lb").textContent=c.book;$("lx").innerHTML=m&&m.text?m.text:"本章交互正在制作中，即将上线。";
 if(m&&m.mount){try{m.mount(ctrl,read)}catch(e){console.error(e)}}
 if(!ctrl.children.length)ctrl.append(el("p","empty","暂无控件"));if(!read.children.length)read.append(el("p","empty","—"));
 const pts=m&&m.points||[];$("ptsBox").hidden=!pts.length;$("pts").innerHTML=pts.map(p=>"<li>"+p+"</li>").join("");
 $("gkBox").hidden=!(m&&m.gk);$("gk").innerHTML=m&&m.gk||"";
 document.querySelectorAll("#toc button,#slist button").forEach((b,k)=>b.classList.toggle("cur",k%CH.length===i));
 [...$("segs").children].forEach((s,k)=>{s.className=k<i?"on":k===i?"cur":""});
 $("cnt").textContent=pad(i)+" / "+pad(CH.length-1);$("chcnt").textContent=pad(i)+"/"+pad(CH.length-1);
 ["prev","prev2"].forEach(id=>$(id).disabled=i===0);["next","next2"].forEach(id=>$(id).disabled=i===CH.length-1);
 if(location.hash!=="#"+(i+1))history.replaceState(null,"","#"+(i+1));document.title="格物实验室 三角与解三角形 · "+c.n;frame()}
function sheet(open){$("sheet").hidden=$("bd").hidden=!open;if(open){const b=$("slist").querySelector(".cur");b&&b.scrollIntoView({block:"nearest"})}}
$("chbtn").onclick=()=>sheet(true);$("bd").onclick=()=>sheet(false);
["prev","prev2"].forEach(id=>$(id).onclick=()=>go(cur-1));["next","next2"].forEach(id=>$(id).onclick=()=>go(cur+1));
["dark","dark2"].forEach(id=>$(id).onclick=()=>setDark(!dark));
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$("fold").onclick=()=>{const c=$("lec").classList.toggle("collapsed");$("fold").textContent=c?"展开":"收起";$("fold").setAttribute("aria-expanded",!c);resize()};
addEventListener("keydown",e=>{const t=e.target,tag=t&&t.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable))return;
 if(e.key==="ArrowLeft")go(cur-1);else if(e.key==="ArrowRight")go(cur+1);else if(e.key==="Escape")sheet(false)});
function fromHash(){const n=parseInt(location.hash.slice(1),10);return n>=1&&n<=CH.length?n-1:0}
addEventListener("hashchange",()=>go(fromHash()));
setDark(dark);go(fromHash());resize();
