<!doctype html>
<html lang="zh-CN">
<head><script src="../lib/labfix-2d.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>资产阶级革命与制度 · 格物实验室</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--fg:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--sel:#e8f1fc;--selfg:#0058b0;--btn2:#f5f5f7;--bar:rgba(251,251,253,.72);--shadow:0 2px 12px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.04);
--sans:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;--mono:ui-monospace,Menlo,monospace}
html.dark{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12);--blue:#2997ff;--sel:rgba(41,151,255,.18);--selfg:#6cb6ff;--btn2:#2c2c2e;--bar:rgba(0,0,0,.72);--shadow:0 0 0 1px rgba(255,255,255,.08)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;padding-top:env(safe-area-inset-top);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.back{color:var(--blue);text-decoration:none;white-space:nowrap;display:flex;align-items:center;min-height:44px}
.back b{font-size:22px;font-weight:400;margin-right:4px}
.tname{font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.segs{display:flex;gap:3px}.segs i{width:18px;height:4px;border-radius:2px;background:var(--line)}.segs i.on{background:var(--blue)}
.count{font:13px var(--mono);color:var(--sub)}
.tbtns{display:flex;gap:8px}
.pill{border:0;border-radius:980px;padding:0 16px;min-height:36px;background:var(--btn2);font-size:14px;white-space:nowrap}
.pill.primary{background:var(--blue);color:#fff}
html.dark .pill.primary,html.dark .chips button.on{color:#000}
.pill:disabled{opacity:.4;cursor:default}
.chbtn{margin-left:auto;min-height:44px}
/* layout */
.app{display:grid;grid-template-columns:220px 1fr 340px;height:calc(100vh - 56px)}
.toc{border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
.toc button,.sheet button.it{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px;align-items:center}
.toc button:hover{background:var(--btn2)}
.toc button.on,.sheet button.it.on{background:var(--sel);color:var(--selfg);font-weight:600}
.toc .mono,.sheet .mono{font-size:13px;color:var(--sub)}.on .mono{color:var(--selfg)!important}
.stage{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;min-height:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 20px}
.explain{flex:none}
.ehead{display:flex;align-items:center;gap:10px}
.ehead h2{font-size:20px;flex:1;min-width:0}
.book{font-size:13px;color:var(--sub);margin:2px 0 0}
.etext{margin:8px 0 0;max-height:4.9em;overflow:auto;line-height:1.6}
.explain.collapsed .etext,.explain.collapsed .book{display:none}
.fold{border:0;background:var(--btn2);border-radius:980px;padding:4px 12px;font-size:13px;color:var(--sub);min-height:32px}
.cwrap{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mtitle{display:none}
.sec h3{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:0;margin:0 0 8px}
.ctrls{display:flex;flex-direction:column;gap:12px}
.sl label{display:flex;justify-content:space-between;font-size:14px}.sl output{font-family:var(--mono);color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:0;border-radius:980px;padding:0 14px;min-height:34px;background:var(--btn2);font-size:14px}.chips button.on{background:var(--blue);color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:36px;border:0;background:none;padding:0;width:100%}
.tg i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:.2s}.tg i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on i{background:#34c759}.tg.on i::after{left:20px}
.ro{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.ro dt{color:var(--sub)}.ro dd{margin:0;text-align:right;font-family:var(--mono)}
.points ul{margin:0;padding-left:18px}.points li{margin:4px 0}
.gk a{color:var(--blue);text-decoration:none;font-size:14px}
.mdark{display:none}
.soon{color:var(--sub);font-size:14px;margin:0}
/* sheet */
.mask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:70vh;overflow:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.bbar{display:none}
/* tablet */
@media (max-width:1023px){
 .prog{display:none}.app{display:block;height:auto}.toc{display:none}
 .stage{padding:12px}.cwrap{order:-1;flex:none;height:56vh}
 .explain .fold{display:none}.explain.collapsed .etext,.explain.collapsed .book{display:block}.etext{max-height:none;overflow:visible}
 .panel{border:0;padding:0 12px 24px}
}
@media (min-width:1024px){.chbtn{display:none}}
/* phone */
@media (max-width:767px){
 .top{height:calc(52px + env(safe-area-inset-top));gap:6px;padding-left:4px;padding-right:8px}
 .back{width:44px;justify-content:center}.back span{display:none}.back b{margin:0}
 .tname{flex:1;font-size:16px}.tbtns{display:none}.chbtn{margin-left:0;padding:0 12px}
 .stage{padding:0;gap:0}.cwrap{height:52vh;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
 .explain{background:none;box-shadow:none;padding:16px 16px 4px}.ehead h2{font-size:20px}.etext{font-size:16px;line-height:1.7}
 .panel{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
 input[type=range]{height:44px}.chips button,.tg{min-height:44px}
 .mdark{display:block;align-self:flex-start;min-height:44px}
 .bbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
 .bbar .pill{flex:1;min-height:44px}
}
</style>

<div class="app">
  <nav class="toc" id="toc" aria-label="章节"></nav>
  <main class="stage">
    <section class="card explain" id="explain">
      <div class="ehead"><h2 id="ctitle"></h2><button class="fold" id="fold" aria-expanded="true">收起</button></div>
      <p class="book" id="cbook"></p>
      <p class="etext" id="ctext"></p>
    </section>
    <div class="cwrap" id="cwrap"><canvas id="cv"></canvas></div>

  <aside class="panel">
    <section class="card sec" id="ctrlSec"><h3>控件</h3><div class="ctrls" id="ctrl"></div></section>
    <section class="card sec" id="readSec"><h3>读数</h3><div id="read"></div></section>
    <section class="card sec points" id="ptSec"><h3>要点</h3><div id="pts"></div></section>
    <section class="card sec gk" id="gkSec"><h3>高考链接</h3><div id="gk"></div></section>
    <button class="pill mdark" id="mdark">深色</button>

</div>
<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="章节列表"><div class="grab"></div><div id="slist"></div></div>
<div class="bbar"><button class="pill" id="bprev">上一章</button><button class="pill primary" id="bnext">下一章</button></div>
<script>
const CH=[
{n:"英国：权力天平向议会倾斜",book:"《中外历史纲要（下）》第 9 课 · 选择性必修1 第 3 课",ready:false},
{n:"美国 1787 年宪法：三权制衡",book:"第 9 课 · 选择性必修1 第 3 课",ready:false},
{n:"法国大革命：从三级会议到共和国",book:"第 9 课",ready:false},
{n:"拿破仑与《民法典》",book:"第 9 课",ready:false},
{n:"德意志统一与 1871 年宪法",book:"第 9 课",ready:false},
{n:"改革之路：俄国 1861 与日本明治维新",book:"第 12 课",ready:false},
{n:"代议制大比拼",book:"选择性必修1 第 3 课",ready:false},
{n:"拉美独立与亚洲觉醒",book:"第 13 课",ready:false},
{n:"随堂检测",book:"浙江选考 资本主义制度的确立",ready:false}];
/* ---------- history drawing tools ---------- */
const SANS="-apple-system,'PingFang SC','Noto Sans SC',sans-serif";
const INK={blue:"#0071e3",gold:"#9a6a00",red:"#c0362c"};// text colors: theme().fg or these three only
function itext(ctx,text,x,y,o){o=o||{};const T=theme(),col=o.color||T.fg;ctx.save();
 ctx.font=(o.weight||400)+" "+(o.size||13)+"px "+SANS;ctx.textAlign=o.align||"center";ctx.textBaseline="middle";ctx.lineJoin="round";
 ctx.lineWidth=3;ctx.strokeStyle=isDark()&&col===T.fg?T.bg:"rgba(255,255,255,.9)";ctx.strokeText(text,x,y);ctx.fillStyle=col;ctx.fillText(text,x,y);ctx.restore()}
function person(ctx,x,y,h,o){o=o||{};const col=o.color||theme().fg,role=o.role||"citizen",r=h*.11,hy=y-h+r,sh=hy+r*1.3;
 ctx.save();ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineCap="round";ctx.lineJoin="round";
 ctx.beginPath();ctx.arc(x,hy,r,0,7);ctx.fill();
 const robe=role==="judge"||role==="king",bw=robe?h*.2:h*.15;
 ctx.beginPath();ctx.moveTo(x-bw*.8,sh);ctx.lineTo(x+bw*.8,sh);ctx.lineTo(x+bw,robe?y:y-h*.4);ctx.lineTo(x-bw,robe?y:y-h*.4);ctx.closePath();ctx.fill();
 if(!robe){ctx.lineWidth=h*.07;ctx.beginPath();ctx.moveTo(x-bw*.5,y-h*.42);ctx.lineTo(x-bw*.6,y);ctx.moveTo(x+bw*.5,y-h*.42);ctx.lineTo(x+bw*.6,y);ctx.stroke()}
 ctx.lineWidth=h*.03;
 if(role==="king"){const cy=hy-r*.8;ctx.beginPath();ctx.moveTo(x-r,cy);ctx.lineTo(x-r,cy-r*.9);ctx.lineTo(x-r*.5,cy-r*.4);ctx.lineTo(x,cy-r*1.1);ctx.lineTo(x+r*.5,cy-r*.4);ctx.lineTo(x+r,cy-r*.9);ctx.lineTo(x+r,cy);ctx.closePath();ctx.fillStyle="#c98a12";ctx.fill()}
 if(role==="mp"||role==="judge"){ctx.beginPath();ctx.arc(x-r*.95,hy+r*.3,r*.45,0,7);ctx.arc(x+r*.95,hy+r*.3,r*.45,0,7);ctx.fill();ctx.beginPath();ctx.arc(x,hy-r*.35,r*1.05,Math.PI,0);ctx.fill()}
 if(role==="judge"){ctx.strokeStyle=theme().bg;ctx.beginPath();ctx.moveTo(x,sh+r*.3);ctx.lineTo(x,y-h*.05);ctx.stroke()}
 if(role==="soldier"){ctx.beginPath();ctx.moveTo(x-r*1.5,hy-r*.4);ctx.lineTo(x,hy-r*1.9);ctx.lineTo(x+r*1.5,hy-r*.4);ctx.closePath();ctx.fill();
  ctx.lineWidth=h*.035;ctx.beginPath();ctx.moveTo(x+bw*1.1,y-h*.3);ctx.lineTo(x+bw*1.5,y-h*1.05);ctx.stroke()}
 if(role==="president"){ctx.fillRect(x-r*1.4,hy-r*.85,r*2.8,r*.3);ctx.fillRect(x-r*.85,hy-r*2.3,r*1.7,r*1.5)}
 if(role==="peasant"){ctx.beginPath();ctx.moveTo(x-r*1.8,hy-r*.3);ctx.quadraticCurveTo(x,hy-r*2.2,x+r*1.8,hy-r*.3);ctx.closePath();ctx.fill();
  ctx.lineWidth=h*.035;ctx.beginPath();ctx.moveTo(x-bw*1.1,y);ctx.lineTo(x-bw*1.4,y-h*.85);ctx.lineTo(x-bw*.6,y-h*.95);ctx.stroke()}
 ctx.restore()}
function balance(ctx,x,y,w,tilt,ll,rl,lc,rc){const T=theme(),t=Math.max(-1,Math.min(1,tilt||0)),a=t*.35,hw=w/2,top=y-w*.55,dx=Math.cos(a)*hw,dy=Math.sin(a)*hw;
 lc=lc||INK.blue;rc=rc||INK.red;ctx.save();ctx.strokeStyle=T.fg;ctx.fillStyle=T.fg;ctx.lineCap="round";
 ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,top);ctx.stroke();ctx.fillRect(x-w*.14,y-4,w*.28,6);
 ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-dx,top-dy);ctx.lineTo(x+dx,top+dy);ctx.stroke();ctx.beginPath();ctx.arc(x,top,5,0,7);ctx.fill();
 const ph=w*.25,pw=w*.17;[[-1,lc,ll],[1,rc,rl]].forEach(([s,c,l])=>{const px=x+s*dx,py=top+s*dy,by=py+ph;
  ctx.strokeStyle=T.sub;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-pw,by);ctx.moveTo(px,py);ctx.lineTo(px+pw,by);ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(px-pw*1.1,by);ctx.quadraticCurveTo(px,by+pw*.7,px+pw*1.1,by);ctx.closePath();ctx.fill();
  if(l)itext(ctx,l,px,by+pw*.55+12,{color:c===lc||c===rc?c:T.fg,size:13,weight:600})});ctx.restore()}
function node(ctx,x,y,w,h,label,o){o=o||{};const T=theme(),col=o.color||T.fg;ctx.save();rrect(ctx,x,y,w,h,Math.min(12,h/3));
 ctx.fillStyle=isDark()?"#2c2c2e":"#fff";if(o.active){ctx.shadowColor=col;ctx.shadowBlur=16}ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle=o.active?col:isDark()?"rgba(255,255,255,.18)":"rgba(0,0,0,.14)";ctx.lineWidth=o.active?2.5:1;ctx.stroke();ctx.restore();
 if(label)itext(ctx,label,x+w/2,y+h/2,{color:col,size:14,weight:600})}
function arrowTo(ctx,x1,y1,x2,y2,o){o=o||{};const T=theme(),col=o.color||T.fg,p=o.progress==null?1:Math.max(0,Math.min(1,o.progress));if(p<=0)return;
 const ex=x1+(x2-x1)*p,ey=y1+(y2-y1)*p,a=Math.atan2(y2-y1,x2-x1),k=9;ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;ctx.lineCap="round";
 ctx.setLineDash(o.dash?[6,5]:[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex-Math.cos(a)*k*.6,ey-Math.sin(a)*k*.6);ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-k*Math.cos(a-.45),ey-k*Math.sin(a-.45));ctx.lineTo(ex-k*Math.cos(a+.45),ey-k*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();
 if(o.label&&p>=.5)itext(ctx,o.label,(x1+x2)/2,(y1+y2)/2-12,{color:col,size:12})}
const MODS=[];// MODS[i]={text,points,gk,mount(ctrlEl,readEl),draw(ctx,w,h,t),pointer(e,type,x,y),unmount()}
/* ---------- 第 1 章 英国：权力天平向议会倾斜 ---------- */
CH[0].ready=true;
MODS[0]=(()=>{
 const S=[
  {y:"1215 年前",ev:"中世纪王权",tl:-.6,gov:"封建君主制",nar:"中世纪英国：王权强大，国王掌握征税、立法与军队。点击「下一步」或下方时间轴节点。"},
  {y:"1215",nm:"大宪章",ev:"《大宪章》",tl:-.45,gov:"封建君主制",nar:"贵族迫使国王签署《大宪章》，承认“王在法下”，开创限制王权的传统。天平微微一动。"},
  {y:"1640",nm:"革命",ev:"资产阶级革命爆发",tl:-.2,gov:"君主专制受挑战",nar:"查理一世与议会围绕征税权激烈冲突，英国资产阶级革命爆发，随后爆发内战。"},
  {y:"1649",nm:"共和",ev:"处死查理一世",tl:.15,gov:"共和国",nar:"议会处死查理一世，宣布成立共和国。政局剧烈动荡，天平大幅摇摆后回摆。",shake:1},
  {y:"1660",nm:"复辟",ev:"斯图亚特王朝复辟",tl:-.35,gov:"君主制复辟",nar:"斯图亚特王朝复辟，王权反扑，天平向国王回摆——革命出现反复。",red:1},
  {y:"1688",nm:"光荣革命",ev:"光荣革命 · 《权利法案》",tl:.4,gov:"君主立宪制",rd:"君主立宪制确立",nar:"1688 年光荣革命，迎立威廉三世与玛丽；1689 年《权利法案》：法律效力高于王权，未经议会同意，国王不得征税、不得废除法律、不得维持常备军。"},
  {y:"18世纪",nm:"内阁制",ev:"责任内阁制形成",tl:.7,gov:"君主立宪制 · 责任内阁制",rd:"国王“统而不治”",nar:"1721 年沃波尔成为首任首相；1742 年沃波尔因失去下院多数支持而辞职。内阁向议会负责，国王“统而不治”。"}];
 let s=0,reform=false,tn=-.6,shT=null,grT=null,timer=null,hits=[],ro=null,autoB=null;
 const C=()=>{const T=theme();return isDark()?{blue:T.blue,gold:T.goldText,red:T.redText,fg:T.fg}:{blue:INK.blue,gold:INK.gold,red:INK.red,fg:T.fg}};
 const tgt=()=>Math.max(-1,Math.min(1,S[s].tl+(reform?.08:0)));
 function upd(){const st=S[s],c=C(),k=Math.round((1-tgt())/2*100);
  const bar=`<span style="display:inline-flex;width:96px;height:8px;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px"><i style="width:${k}%;background:${c.gold}"></i><i style="flex:1;background:${c.blue}"></i></span>${k}% : ${100-k}%`;
  const rows=[["年份",st.y],["事件",st.ev,st.red?c.red:""],["王权 : 议会",bar],["政体",st.gov,c.blue]];
  if(st.rd)rows.push(["读数",st.rd,c.gold]);if(reform)rows.push(["1832 改革","选举权扩大，工业资产阶级进入议会",c.blue]);ro&&ro.update(rows)}

 if(opts.grid){ctx.strokeStyle=T.grid;ctx.beginPath();for(let x=Math.ceil(x0/st)*st;x<=x1;x+=st){ctx.moveTo(X(x),box.y);ctx.lineTo(X(x),box.y+box.h)}for(let y=Math.ceil(y0/st)*st;y<=y1;y+=st){ctx.moveTo(box.x,Y(y));ctx.lineTo(box.x+box.w,Y(y))}ctx.stroke()}
 ctx.strokeStyle=T.axis;ctx.beginPath();ctx.moveTo(box.x,Y(0));ctx.lineTo(box.x+box.w,Y(0));ctx.moveTo(X(0),box.y);ctx.lineTo(X(0),box.y+box.h);ctx.stroke();
 if(opts.labels){ctx.fillStyle=T.sub;ctx.font="12px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="top";
  for(let x=Math.ceil(x0/st)*st;x<=x1;x+=st)if(Math.abs(x)>1e-9)ctx.fillText(fmtNum(x),X(x),Y(0)+4);
  ctx.textAlign="right";ctx.textBaseline="middle";for(let y=Math.ceil(y0/st)*st;y<=y1;y+=st)if(Math.abs(y)>1e-9)ctx.fillText(fmtNum(y),X(0)-5,Y(y));
  ctx.textBaseline="top";ctx.fillText("O",X(0)-4,Y(0)+4);ctx.font="italic 13px "+getComputedStyle(document.body).fontFamily;ctx.fillStyle=T.fg;
  ctx.fillText("x",box.x+box.w-4,Y(0)+4);ctx.textAlign="left";ctx.fillText("y",X(0)+6,box.y+4)}
 ctx.restore();return{X,Y,invX,invY,s:sx,box,xr:[x0,x1],yr:[y0,y1]}}
function drawLine(ctx,map,A,B,C,color,width,dashed){if(Math.abs(A)<1e-12&&Math.abs(B)<1e-12)return;const[x0,x1]=map.xr,[y0,y1]=map.yr,b=map.box;let p,q;
 if(Math.abs(B)>=Math.abs(A)){p=[x0,-(A*x0+C)/B];q=[x1,-(A*x1+C)/B]}else{p=[-(B*y0+C)/A,y0];q=[-(B*y1+C)/A,y1]}
 ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();ctx.strokeStyle=color||theme().blue;ctx.lineWidth=width||2;ctx.setLineDash(dashed?[6,5]:[]);
 ctx.beginPath();ctx.moveTo(map.X(p[0]),map.Y(p[1]));ctx.lineTo(map.X(q[0]),map.Y(q[1]));ctx.stroke();ctx.restore()}
function drawCircle(ctx,map,cx,cy,r,color,width,fill){const b=map.box;ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();ctx.beginPath();ctx.arc(map.X(cx),map.Y(cy),Math.max(0,r*map.s),0,Math.PI*2);
 if(fill){ctx.fillStyle=fill;ctx.fill()}if(width!==0){ctx.strokeStyle=color||theme().blue;ctx.lineWidth=width||2;ctx.stroke()}ctx.restore()}
function dragPoints(points,map,snap){const M=()=>typeof map==="function"?map():map;const h=function(e,type,x,y){const m=M();if(!m)return false;
 if(type==="down"){const R=e&&e.pointerType==="touch"?22:12;let best=-1,bd=R;points.forEach((p,i)=>{if(p.fixed)return;const d=Math.hypot(m.X(p.x)-x,m.Y(p.y)-y);if(d<=bd){bd=d;best=i}});h.active=best;return best>=0}
 if(type==="move"&&h.active>=0){const p=points[h.active];let nx=m.invX(x),ny=m.invY(y);if(snap){nx=Math.round(nx/snap)*snap;ny=Math.round(ny/snap)*snap}
  nx=Math.min(m.xr[1],Math.max(m.xr[0],nx));ny=Math.min(m.yr[1],Math.max(m.yr[0],ny));p.x=+nx.toFixed(6);p.y=+ny.toFixed(6);p.onmove&&p.onmove(p);h.onmove&&h.onmove(p,h.active);return true}
 if(type==="up"){const was=h.active>=0;h.active=-1;return was}return false};h.active=-1;return h}
function wrapText(ctx,text,x,y,maxW,lh){let line="";for(const ch of String(text)){if(ch==="\n"){ctx.fillText(line,x,y);line="";y+=lh;continue}
 const t=line+ch;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);line=ch;y+=lh}else line=t}if(line)ctx.fillText(line,x,y);return y+lh}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* ---------- placeholder ---------- */
function drawSoon(ctx,w,h){const T=theme(),cw=Math.min(320,w-40),ch=150,x=(w-cw)/2,y=(h-ch)/2;
 ctx.save();ctx.shadowColor="rgba(0,0,0,.08)";ctx.shadowBlur=24;ctx.shadowOffsetY=4;ctx.fillStyle=isDark()?"#2c2c2e":"#fff";rrect(ctx,x,y,cw,ch,22);ctx.fill();ctx.restore();
 ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=T.blue;ctx.font="13px ui-monospace,Menlo,monospace";ctx.fillText("CHAPTER "+pad(cur),w/2,y+38);
 ctx.fillStyle=T.fg;ctx.font="600 22px -apple-system,'PingFang SC','Noto Sans SC',sans-serif";ctx.fillText("即将上线",w/2,y+72);
 ctx.fillStyle=T.sub;ctx.font="14px -apple-system,'PingFang SC','Noto Sans SC',sans-serif";ctx.fillText(CH[cur].n,w/2,y+108)}
/* ---------- canvas loop ---------- */
function resize(){const r=$("cwrap").getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,3);W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);frame(performance.now())}
function frame(t){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=theme().bg;ctx.fillRect(0,0,W,H);
 try{mod&&mod.draw?mod.draw(ctx,W,H,t/1000):drawSoon(ctx,W,H)}catch(err){console.error(err)}}
function loop(t){frame(t);requestAnimationFrame(loop)}
new ResizeObserver(resize).observe($("cwrap"));window.addEventListener("resize",resize);
function ptr(type){return e=>{if(!mod||!mod.pointer)return;const r=cv.getBoundingClientRect();
 if(type==="down")try{cv.setPointerCapture(e.pointerId)}catch(_){}mod.pointer(e,type,e.clientX-r.left,e.clientY-r.top)}}
cv.addEventListener("pointerdown",ptr("down"));cv.addEventListener("pointermove",ptr("move"));cv.addEventListener("pointerup",ptr("up"));cv.addEventListener("pointercancel",ptr("up"));
/* ---------- chapters ---------- */
function list(host,cls){host.innerHTML="";CH.forEach((c,i)=>{const b=el("button",cls,`<span class="mono">${pad(i)}</span><span>${c.n}</span>`);b.onclick=()=>{go(i);closeSheet()};host.append(b)})}
list($("toc"),"");list($("slist"),"it");
$("segs").innerHTML=CH.map(()=>"<i></i>").join("");
function go(i){i=Math.max(0,Math.min(CH.length-1,i));if(mod&&mod.unmount)try{mod.unmount()}catch(e){console.error(e)}
 cur=i;const c=CH[i],m=c.ready&&MODS[i]?MODS[i]:null;mod=m;
 $("ctitle").textContent=pad(i)+"  "+c.n;$("cbook").textContent=c.book;$("ctext").innerHTML=m?m.text||"":"本章交互实验即将上线，敬请期待。";
 const ctrl=$("ctrl"),read=$("read");ctrl.innerHTML="";read.innerHTML="";$("pts").innerHTML="";$("gk").innerHTML="";
 if(m){m.mount&&m.mount(ctrl,read);$("pts").innerHTML=m.points?"<ul>"+[].concat(m.points).map(p=>"<li>"+p+"</li>").join("")+"</ul>":"";$("gk").innerHTML=m.gk||""}
 $("ctrlSec").hidden=!ctrl.children.length;$("readSec").hidden=!read.children.length;$("ptSec").hidden=!$("pts").innerHTML;$("gkSec").hidden=!$("gk").innerHTML;
 if(!m){$("ctrlSec").hidden=false;ctrl.innerHTML='<p class="soon">本章控件即将上线。</p>'}
 document.querySelectorAll("#toc button,#slist button").forEach(b=>{const on=+b.querySelector(".mono").textContent-1===i;b.classList.toggle("on",on);on?b.setAttribute("aria-current","true"):b.removeAttribute("aria-current")});
 document.querySelectorAll("#segs i").forEach((s,k)=>s.classList.toggle("on",k<=i));
 $("count").textContent=pad(i)+" / "+pad(CH.length-1);$("chnum").textContent=pad(i)+"/"+pad(CH.length-1);
 ["prev","bprev"].forEach(k=>$(k).disabled=i===0);["next","bnext"].forEach(k=>$(k).disabled=i===CH.length-1);
 if(location.hash!=="#"+(i+1))history.replaceState(null,"","#"+(i+1));resize()}
/* ---------- controls ---------- */
$("prev").onclick=$("bprev").onclick=()=>go(cur-1);$("next").onclick=$("bnext").onclick=()=>go(cur+1);
$("dark").onclick=$("mdark").onclick=()=>setDark(!isDark());
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$("fold").onclick=()=>{const c=$("explain").classList.toggle("collapsed");$("fold").textContent=c?"展开":"收起";$("fold").setAttribute("aria-expanded",!c);resize()};
function openSheet(){$("mask").hidden=$("sheet").hidden=false;const on=$("slist").querySelector(".on");on&&on.scrollIntoView({block:"nearest"})}
function closeSheet(){$("mask").hidden=$("sheet").hidden=true}
$("chbtn").onclick=openSheet;$("mask").onclick=closeSheet;
document.addEventListener("keydown",e=>{const t=e.target;if(t&&(t.tagName==="INPUT"&&t.type!=="range"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
 if(t&&t.type==="range")return;if(e.key==="ArrowLeft")go(cur-1);else if(e.key==="ArrowRight")go(cur+1);else if(e.key==="Escape")closeSheet()});
function fromHash(){const n=parseInt(location.hash.slice(1),10);return n>=1&&n<=CH.length?n-1:0}
window.addEventListener("hashchange",()=>{const i=fromHash();if(i!==cur)go(i)});
go(fromHash());requestAnimationFrame(loop);
</script>
