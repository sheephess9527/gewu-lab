<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>圆锥曲线 · ConicLab｜格物实验室</title>
    <link rel="stylesheet" href="hark.css" />
    <style>
      :root {
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
        --x-serif: var(--sans);
        --x-mono: ui-monospace, Menlo, "SF Mono", monospace;
        --x-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        /* light (default) */
        --x-bg1: #fbfbfd; --x-bg2: #fbfbfd; --x-solid: #ffffff; --x-panel: #ffffff;
        --x-line: rgba(0, 0, 0, 0.08); --x-line2: rgba(0, 0, 0, 0.22);
        --x-acc: #0a9396; --x-acc2: #c98a12; --x-red: #e5484d;
        --x-ink: #1d1d1f; --x-ink2: #6e6e73; --x-soft: #fbfbfd;
        --x-blue: #0071e3; --x-blue-soft: #e8f1fc;
        --x-fill: #f5f5f7; --x-fill2: #e8e8ed; --x-track: rgba(0, 0, 0, 0.12); --x-track2: #e5e5ea;
        --x-bar: rgba(251, 251, 253, 0.72); --x-glass: rgba(255, 255, 255, 0.86);
        --x-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); --x-hair: 0 0 0 0.5px rgba(0, 0, 0, 0.06);
        --x-teal-ink: #077d80; --x-gold-ink: #93650a; --x-red-ink: #c8373c; --x-gold-soft: #faf3e5;
      }
      html[data-theme="dark"] {
        --x-bg1: #000000; --x-bg2: #000000; --x-solid: #1d1d1f; --x-panel: #1d1d1f;
        --x-line: rgba(255, 255, 255, 0.1); --x-line2: rgba(255, 255, 255, 0.3);
        --x-acc: #2ec4b6; --x-acc2: #f2b544; --x-red: #ff6369;
        --x-ink: #f5f5f7; --x-ink2: #a1a1a6; --x-soft: #000000;
        --x-blue: #2997ff; --x-blue-soft: #0b2238;
        --x-fill: #2c2c2e; --x-fill2: #3a3a3c; --x-track: rgba(255, 255, 255, 0.2); --x-track2: #3a3a3c;
        --x-bar: rgba(0, 0, 0, 0.72); --x-glass: rgba(29, 29, 31, 0.86);
        --x-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); --x-hair: 0 0 0 0.5px rgba(255, 255, 255, 0.08);
        --x-teal-ink: #2ec4b6; --x-gold-ink: #f2b544; --x-red-ink: #ff6369; --x-gold-soft: #2e2615;
      }
      html, body { height: 100%; overflow: hidden; }
      body {
        margin: 0; background: var(--x-bg1) linear-gradient(160deg, var(--x-bg1), var(--x-bg2));
        color: var(--x-ink); font-family: var(--sans), system-ui, sans-serif;
      }
      .x-app { height: 100dvh; display: grid; grid-template-rows: 56px 1fr; }
      /* top bar */
      .x-top {
        display: flex; align-items: center; gap: 16px; padding: 0 14px;
        border-bottom: 1px solid var(--x-line); background: var(--x-panel);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      }
      .x-brand { font-family: var(--x-serif); font-size: 16px; white-space: nowrap; }
      .x-brand small { display: block; font-family: var(--sans); font-size: 12px; color: var(--x-ink2); letter-spacing: .08em; }
      .x-prog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
      .x-bars { display: flex; gap: 4px; flex: 1; min-width: 0; }
      .x-bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--x-line2); transition: background .2s; }
      .x-bars i.on { background: var(--x-acc); }
      .x-count { font-family: var(--x-mono); font-size: 12px; color: var(--x-ink2); white-space: nowrap; }
      .x-tools { display: flex; gap: 6px; }
      .x-ic {
        width: 44px; height: 36px; display: grid; place-items: center; cursor: pointer;
        border: 1px solid var(--x-line2); background: var(--x-solid); color: var(--x-ink);
        border-radius: 10px; font: 400 13px var(--x-mono); transition: all .2s;
      }
      .x-ic:hover { border-color: var(--x-acc); color: var(--x-acc); }
      .x-body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; min-height: 0; }
      /* chapters */
      .x-chaps { border-right: 1px solid var(--x-line); overflow: auto; padding: 8px 0; background: var(--x-bg1); }
      .x-chap {
        display: block; width: 100%; min-height: 44px; text-align: left; cursor: pointer; background: var(--x-bg1);
        border: 0; border-left: 3px solid transparent; padding: 9px 14px; color: var(--x-ink2);
        font-family: inherit; transition: all .2s;
      }
      .x-chap b { display: block; font: 400 12px var(--x-mono); letter-spacing: .1em; color: var(--x-ink2); }
      .x-chap span { font-family: var(--x-serif); font-size: 15px; color: var(--x-ink); }
      .x-chap:hover { background: var(--x-solid); }
      .x-chap.on { border-left-color: var(--x-acc); background: var(--x-solid); }
      .x-chap.on b, .x-chap.on span { color: var(--x-acc); }
      /* stage */
      .x-stage { position: relative; min-width: 0; overflow: hidden; }
      .x-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      .x-over {
        position: absolute; left: 16px; top: 16px; max-width: min(380px, 70%);
        background: var(--x-panel); border: 1px solid var(--x-line); border-radius: 10px;
        padding: 12px 14px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      }
      .x-over h1 { font: 600 17px var(--x-serif); margin: 0 0 6px; }
      .x-over p { font-size: 13px; line-height: 1.6; color: var(--x-ink2); margin: 0 0 4px; }
      .x-over.min .x-overbody { display: none; }
      .x-fold {
        position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border-radius: 8px;
        border: 0; background: var(--x-solid); color: var(--x-ink); cursor: pointer;
        font: 400 14px var(--x-mono);
      }
      .x-over { background: var(--x-solid); }
      .x-over h1 { padding-right: 40px; min-height: 30px; }
      .x-soon {
        position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      }
      .x-soon span {
        font-family: var(--x-serif); font-size: 15px; color: var(--x-ink); background: var(--x-solid);
        border: 1px dashed var(--x-line2); border-radius: 10px; padding: 14px 20px;
      }
      /* panel */
      .x-panel {
        border-left: 1px solid var(--x-line); overflow: auto; padding: 14px;
        display: flex; flex-direction: column; gap: 12px; background: var(--x-soft);
      }
      .x-card { border: 1px solid var(--x-line); border-radius: 10px; padding: 12px; background: var(--x-panel); }
      .x-card h2 { font: 600 13px var(--sans); letter-spacing: .08em; color: var(--x-ink2); margin: 0 0 10px; text-transform: uppercase; }
      .x-ctl { margin-bottom: 12px; }
      .x-ctl:last-child { margin-bottom: 0; }
      .x-lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
      .x-val { font: 400 13px var(--x-mono); color: var(--x-acc); }
      input[type="range"] { width: 100%; height: 24px; accent-color: var(--x-acc); background: none; }
      .x-btn {
        min-height: 44px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
        border: 1px solid var(--x-line2); background: var(--x-solid); color: var(--x-ink);
        font: 400 13px var(--sans); transition: all .2s;
      }
      .x-btn:hover { border-color: var(--x-acc); color: var(--x-acc); }
      .x-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; font-size: 13px; cursor: pointer; }
      .x-sw input { width: 40px; height: 22px; accent-color: var(--x-acc); }
      .x-key { font-family: var(--x-serif); font-size: 13.5px; line-height: 1.75; color: var(--x-ink); margin: 0 0 6px; }
      .x-key:last-child { margin-bottom: 0; }
      .x-key em { font-style: normal; font-family: var(--x-mono); color: var(--x-acc2); }
      .x-read { font: 400 12.5px var(--x-mono); color: var(--x-ink2); line-height: 1.9; }
      .x-read b { color: var(--x-ink); font-weight: 400; }
      .x-drawer-handle { display: none; }
      .x-c3 { position: absolute; inset: 0; }
      .x-l3 {
        position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
        font: 600 14px var(--x-serif); color: var(--x-ink); text-shadow: 0 0 4px var(--x-bg1), 0 0 2px var(--x-bg1);
      }
      .x-l3.p { color: var(--x-acc2); }
      .x-l3.f { color: var(--x-red); }
      .x-book {
        display: inline-block; font: 400 12px var(--sans); color: var(--x-acc2);
        border: 1px solid var(--x-line2); border-radius: 6px; padding: 2px 8px;
      }
      .x-ok { color: var(--x-acc); }
      .x-btn.on { border-color: var(--x-acc); color: var(--x-acc); }
      .x-no { color: var(--x-red); }
      .x-tag3 {
        position: absolute; right: 18px; bottom: 18px; pointer-events: none;
        font: 600 22px var(--x-serif); color: var(--x-acc);
      }
      @media (max-width: 1023px) {
        .x-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
        .x-chaps {
          border-right: 0; border-bottom: 1px solid var(--x-line); display: flex; gap: 4px;
          overflow-x: auto; padding: 6px 8px; scrollbar-width: none;
        }
        .x-chaps::-webkit-scrollbar { display: none; }
        .x-chap {
          border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap;
          border-radius: 8px 8px 0 0; padding: 6px 10px; flex: 0 0 auto; width: auto; min-height: 44px;
        }
        .x-chap.on { border-left: 0; border-bottom-color: var(--x-acc); }
        .x-chap b { display: inline; margin-right: 6px; }
        .x-chap span { font-size: 14px; }
        .x-panel {
          position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 72dvh;
          border-left: 0; border-top: 1px solid var(--x-line); border-radius: 16px 16px 0 0;
          background: var(--x-panel); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
          transform: translateY(calc(100% - 52px)); transition: transform .2s var(--ease-out, ease);
          padding-bottom: calc(14px + env(safe-area-inset-bottom));
        }
        .x-panel.open { transform: translateY(0); }
        .x-drawer-handle {
          display: block; width: 100%; min-height: 44px; margin: -14px 0 0; background: none; border: 0;
          color: var(--x-ink); font: 500 13px var(--sans); cursor: pointer;
        }
        .x-drawer-handle::before {
          content: ""; display: block; width: 38px; height: 4px; border-radius: 2px;
          background: var(--x-line2); margin: 8px auto 6px;
        }
        .x-over { left: 10px; top: 10px; max-width: 78%; padding: 10px 12px; }
        .x-over p { font-size: 12px; }
        .x-tag3 { bottom: 66px; font-size: 18px; }
        .x-top { gap: 10px; padding: 0 8px; }
        .x-bars { display: none; }
        .x-ic { width: 44px; height: 44px; }
        .x-tools { gap: 2px; }
      }
      @media (max-width: 560px) {
        .x-brand .x-en, .x-brand small, #full { display: none; }
      }
    </style>
    <style>
      /* ===== Apple-style visual layer (overrides only) ===== */
      body {
        background: var(--x-bg1); font-family: var(--sans); font-size: 15px; line-height: 1.6;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        transition: background-color .3s var(--x-ease), color .3s var(--x-ease);
      }
      button, input, label { font-family: var(--sans); }
      :focus-visible { outline: 2px solid var(--x-blue); outline-offset: 2px; }
      .x-app { grid-template-rows: 52px 1fr; }

      /* top bar */
      .x-top {
        position: relative; z-index: 30; gap: 12px; padding: 0 16px;
        padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
        background: var(--x-bar); border-bottom: 0.5px solid var(--x-line);
        -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      }
      .x-back {
        display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 2px; flex: 0 0 auto;
        color: var(--x-blue); text-decoration: none; font-size: 14px; white-space: nowrap;
        transition: opacity .3s var(--x-ease);
      }
      .x-back:hover { opacity: .72; }
      .x-back b { font: 400 22px/1 var(--sans); margin-top: -3px; }
      .x-sep { width: 0.5px; height: 18px; background: var(--x-line2); flex: 0 0 auto; }
      .x-brand {
        display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; flex: 0 0 auto;
        border: 0; background: none; cursor: default; color: var(--x-ink);
        font: 600 15px/1.2 var(--sans); letter-spacing: -0.01em; white-space: nowrap;
      }
      .x-brand .x-en { color: var(--x-ink2); font-weight: 400; }
      .x-caret { display: none; color: var(--x-ink2); font-size: 14px; transition: transform .3s var(--x-ease); }
      .x-prog { gap: 12px; }
      .x-bars { gap: 3px; max-width: 420px; margin-left: auto; }
      .x-bars i { height: 3px; border-radius: 980px; background: var(--x-track); transition: background .3s var(--x-ease); }
      .x-bars i.on { background: var(--x-blue); }
      .x-count { color: var(--x-ink2); }
      .x-tools { gap: 8px; }
      .x-ic {
        position: relative; width: 36px; height: 36px; border: 0; border-radius: 980px;
        background: var(--x-fill); color: var(--x-ink); font: 500 13px var(--x-mono);
        transition: background .3s var(--x-ease), color .3s var(--x-ease);
      }
      .x-ic::after { content: ""; position: absolute; inset: -4px; }
      .x-ic:hover { background: var(--x-blue-soft); color: var(--x-blue); border-color: transparent; }

      /* layout */
      .x-body { grid-template-columns: 232px minmax(0, 1fr) 344px; }
      .x-chaps { border-right: 0; padding: 14px 10px; background: var(--x-bg1); }
      .x-chap {
        border: 0; border-radius: 12px; margin: 0 0 2px; padding: 8px 12px; background: transparent;
        transition: background .3s var(--x-ease), color .3s var(--x-ease);
      }
      .x-chap b { font: 500 12px var(--x-mono); letter-spacing: .06em; color: var(--x-ink2); }
      .x-chap span { font: 500 15px/1.4 var(--sans); letter-spacing: -0.01em; color: var(--x-ink); }
      .x-chap:hover { background: var(--x-fill); }
      .x-chap.on { border-left-color: transparent; background: var(--x-blue-soft); }
      .x-chap.on b, .x-chap.on span { color: var(--x-blue); }
      html[data-theme="light"] .x-chap.on b, html[data-theme="light"] .x-chap.on span { color: #0062c4; }
      .x-stage { background: var(--x-bg1); }

      /* stage overlay */
      .x-over {
        left: 20px; top: 20px; max-width: min(400px, 70%); padding: 18px 20px;
        border: 0; border-radius: 22px; background: var(--x-glass); box-shadow: var(--x-hair), var(--x-shadow);
        -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      }
      .x-over h1 { font: 600 21px/1.3 var(--sans); letter-spacing: -0.02em; margin: 0 0 8px; padding-right: 40px; min-height: 30px; }
      .x-over p { font-size: 15px; line-height: 1.6; color: var(--x-ink2); margin: 0 0 6px; }
      .x-over p:last-child { margin-bottom: 0; }
      .x-over.min h1 { margin: 0; }
      .x-fold {
        right: 8px; top: 8px; border-radius: 980px; background: transparent; color: var(--x-ink2);
        font: 400 20px/1 var(--sans); transition: background .3s var(--x-ease), color .3s var(--x-ease);
      }
      .x-fold:hover { background: var(--x-fill); color: var(--x-ink); }
      .x-soon span {
        font: 500 15px var(--sans); border: 0; border-radius: 980px; padding: 12px 22px;
        background: var(--x-solid); box-shadow: var(--x-hair), var(--x-shadow);
      }
      .x-book {
        font: 500 12px/1.5 var(--sans); color: var(--x-gold-ink); background: var(--x-gold-soft);
        border: 0; border-radius: 14px; padding: 4px 10px;
      }

      /* panel & cards */
      .x-panel { border-left: 0; padding: 14px 16px 16px; gap: 14px; background: var(--x-bg1); }
      .x-card { border: 0; border-radius: 22px; padding: 18px 18px 16px; background: var(--x-solid); box-shadow: var(--x-hair), var(--x-shadow); }
      .x-card h2 { font: 600 17px/1.3 var(--sans); letter-spacing: -0.02em; color: var(--x-ink); text-transform: none; margin: 0 0 12px; }
      .x-ctl { margin-bottom: 14px; }
      .x-lab { font-size: 15px; margin-bottom: 2px; }
      .x-val { font: 500 13px var(--x-mono); color: var(--x-blue); }
      .x-key { font: 400 15px/1.65 var(--sans); color: var(--x-ink); }
      .x-key em { color: var(--x-gold-ink); font-family: var(--x-mono); font-size: 14px; }
      .x-read { font: 400 13px/1.9 var(--x-mono); color: var(--x-ink2); }
      .x-ok { color: var(--x-teal-ink); }
      .x-no { color: var(--x-red-ink); }
      .x-read [style*="--x-acc"] { color: var(--x-teal-ink) !important; }
      .x-l3 { font: 600 14px var(--sans); text-shadow: 0 0 4px var(--x-bg1), 0 0 2px var(--x-bg1), 0 0 1px var(--x-bg1); }
      .x-l3.p { color: var(--x-gold-ink); }
      .x-l3.f { color: var(--x-red-ink); }
      .x-tag3 { font: 600 22px var(--sans); letter-spacing: -0.02em; right: 20px; bottom: 20px; }

      /* buttons: pills */
      .x-row { gap: 8px; }
      .x-btn {
        min-height: 40px; padding: 8px 16px; border: 0; border-radius: 980px;
        background: var(--x-fill); color: var(--x-ink); font: 500 14px var(--sans);
        transition: background .3s var(--x-ease), color .3s var(--x-ease);
      }
      .x-btn:hover { background: var(--x-fill2); color: var(--x-ink); }
      .x-btn.on { background: var(--x-blue); color: #fff; }
      .x-btn.on:hover { background: var(--x-blue); color: #fff; opacity: .9; }

      /* iOS slider */
      input[type="range"] {
        -webkit-appearance: none; appearance: none; height: 32px; margin: 0; padding: 0;
        background: transparent; cursor: pointer; display: block;
      }
      input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 980px; background: var(--x-track); }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; border: 0;
        background: #fff; box-shadow: 0 0.5px 4px rgba(0, 0, 0, .12), 0 3px 8px rgba(0, 0, 0, .14), 0 0 0 0.5px rgba(0, 0, 0, .06);
        transition: transform .3s var(--x-ease);
      }
      input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.08); }
      input[type="range"]::-moz-range-track { height: 4px; border-radius: 980px; background: var(--x-track); }
      input[type="range"]::-moz-range-progress { height: 4px; border-radius: 980px; background: var(--x-blue); }
      input[type="range"]::-moz-range-thumb {
        width: 24px; height: 24px; border-radius: 50%; border: 0; background: #fff;
        box-shadow: 0 0.5px 4px rgba(0, 0, 0, .12), 0 3px 8px rgba(0, 0, 0, .14), 0 0 0 0.5px rgba(0, 0, 0, .06);
      }
      input[type="range"]:focus-visible { outline: none; }
      input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--x-blue); }
      input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--x-blue); }

      /* iOS switch */
      .x-sw { min-height: 44px; font-size: 15px; }
      .x-sw input {
        -webkit-appearance: none; appearance: none; position: relative; flex: 0 0 auto; margin: 0;
        width: 46px; height: 28px; border-radius: 980px; background: var(--x-track2); cursor: pointer;
        transition: background .3s var(--x-ease);
      }
      .x-sw input::before {
        content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
        background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .18), 0 0 0 0.5px rgba(0, 0, 0, .04);
        transition: transform .3s var(--x-ease);
      }
      .x-sw input:checked { background: var(--x-blue); }
      .x-sw input:checked::before { transform: translateX(18px); }

      @media (max-width: 1023px) {
        .x-top { gap: 8px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
        .x-brand { cursor: pointer; padding: 0 4px; }
        .x-caret { display: inline-block; }
        .x-body.x-toc-off .x-caret { transform: rotate(-90deg); }
        .x-chaps {
          gap: 6px; padding: 6px 10px; border-bottom: 0.5px solid var(--x-line);

        var CH = [
          { t: "圆锥的截线", p: ["用平面去截一个对顶圆锥，截线随平面的倾斜程度变化：平面垂直于轴时是圆，稍微倾斜是椭圆，与某条母线平行时是抛物线，同时截到上下两个圆锥时是双曲线。", "拖动旋转视角，滚轮或双指缩放，R 键复位。"],
            k: ["设截面与轴所成的角为 β，圆锥的半顶角为 α，则 <em>e = cos β / cos α</em>", "<em>β = 90°</em> 圆 · <em>β &gt; α</em> 椭圆 · <em>β = α</em> 抛物线 · <em>β &lt; α</em> 双曲线", "平面过顶点（d = 0）时，截线退化为一个点或两条直线"] },
          { t: "Dandelin 双球", p: ['<span class="x-book">教材：人教A版 选择性必修一·第三章 3.1 椭圆（阅读与思考）</span>', "在圆锥里放两个球，都与圆锥侧面相切、也与截平面相切。两球与截平面的切点 F₁、F₂ 就是椭圆的焦点；两球与圆锥相切于上、下两个圆。", "从球外一点引球的切线，切线长相等：PF₁、PQ₁ 都是 P 到上球的切线，所以 PF₁ = PQ₁；同理 PF₂ = PQ₂。", "所以 PF₁ + PF₂ = PQ₁ + PQ₂ = Q₁Q₂，是两切圆之间的母线长，与 P 的位置无关：这就是椭圆的定义（第一定义）。"],
            k: ["<em>PF₁ = PQ₁</em>，<em>PF₂ = PQ₂</em>（从球外一点引球的切线，切线长相等）", "<em>PF₁ + PF₂ = Q₁Q₂</em>，是两个切圆之间的母线长，与 P 的位置无关：这就是椭圆的定义", "高考链接：椭圆定义 <em>|PF₁|+|PF₂|=2a</em>（<em>2a&gt;|F₁F₂|</em>）常用于焦点三角形周长、面积问题；易错：忘记 <em>2a&gt;|F₁F₂|</em> 条件。"] },
